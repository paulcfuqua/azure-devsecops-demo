# Static serve for the control-tower SPA on port 8080 (ACA ingress target).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness endpoint for ACA probes and V7.1. The L7 CI deploy step stamps
    # the image content hash alongside this marker (see docs/runbooks/layers/L07.md).
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
