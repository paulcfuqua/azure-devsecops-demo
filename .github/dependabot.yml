# =============================================================================
# Dependabot configuration — L9 DevSecOps chain, feeding the L10 self-healing
# showpiece. Playbook: docs/runbooks/layers/L09.md (failure mode 5: "Dependabot
# config valid but silent" — wrong directory globs or an ecosystem typo means no
# alerts ever fire, which L10 then discovers the expensive way).
#
# Two different Dependabot features are in play, and they are easy to conflate:
#
#   * Dependabot ALERTS come from the dependency graph and are enabled as a REPO
#     SETTING. They do not read this file. Every manifest below is detected and
#     alerted on whether or not it is listed here.
#   * Dependabot VERSION UPDATES (the scheduled PRs) are what this file
#     configures.
#
# Both matter for the demo, and apps/vuln-lab needs them pulled apart — see its
# entry below.
# =============================================================================

version: 2

updates:
  # --- npm: workspace root -------------------------------------------------
  # The root manifest owns the shared toolchain (vite, vitest, typescript) for
  # every workspace member, so this is where most app-facing bumps land.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: scope

  # --- npm: per app --------------------------------------------------------
  - package-ecosystem: npm
    directory: /apps/launch-ops
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - launch-ops

  - package-ecosystem: npm
    directory: /apps/control-tower
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - control-tower

  # apps/copilot-svc was deleted by the 2026-08-24 Copilot Studio amendment and
  # its ecosystem entry removed with it: Dependabot errors on a directory that
  # holds no manifest. Its successor is apps/mcp-tools, below, joined by the
  # services that did not exist when this file was written.
  - package-ecosystem: npm
    directory: /apps/mcp-tools
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - mcp-tools

  - package-ecosystem: npm
    directory: /apps/data-api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - data-api

  - package-ecosystem: npm
    directory: /apps/directline-token
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - directline-token

  - package-ecosystem: npm
    directory: /apps/cost-ingest
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - cost-ingest

  - package-ecosystem: npm
    directory: /apps/shared/spec-renderer
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
      - spec-renderer

  # --- npm: the deliberately vulnerable lab --------------------------------
  # apps/vuln-lab pins three known-vulnerable versions (json5 2.2.0,
  # minimist 1.2.5, semver 7.5.1) on purpose: they are the seed for the L10
  # self-healing showpiece. It is deliberately OUTSIDE the root `workspaces`
  # list (open item P-6) so root hoisting cannot silently patch the pins.
  #
  # Listing it here is what L09 failure mode 5 asks for — the directory is
  # explicitly covered, so a graph/ecosystem mistake is visible in config review.
  #
  # `open-pull-requests-limit: 0` disables Dependabot's *version-update* PRs for
  # this directory ONLY. Alerts still fire — they come from the dependency
  # graph, not from this file — and the alert is the trigger the showpiece
  # rides.
  #
  # It does NOT disable Dependabot's *security-update* PRs, and that is
  # deliberate. GitHub documents that "security update pull requests are not
  # subject to this limit", so the three seeded CVEs still get a Dependabot PR
  # each, and `self-heal.yml`'s `dependabot` lane adopts that PR and arms
  # auto-merge on it (see its "Dependabot security update -> gauntlet" job).
  #
  # CORRECTED 2026-08-28. Until now these lines instructed the reader to leave
  # the repo-level "Dependabot security updates" setting OFF, "or it will race
  # self-heal.yml for these three CVEs". That was written before the 2026-08-24
  # amendment and following it BREAKS the showpiece: Copilot Autofix does not
  # generate fixes for dependency alerts and no API can request a security-update
  # PR on demand, so with the setting off there is no fix generator for the lab
  # at all and self-heal's dependabot lane finds nothing to adopt. The setting
  # must be **ON** — .github/README.md § "Repository settings this layer assumes"
  # says so, and has carried a note that this file contradicted it. It no longer
  # does. In a repository people clone and run, a comment telling them to turn
  # off the thing the demo needs is not a stale comment, it is a defect.
  - package-ecosystem: npm
    directory: /apps/vuln-lab
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - vuln-lab
      - do-not-auto-bump

  # --- pip: the synthetic data generators ----------------------------------
  # data/generators is pure stdlib at runtime; pytest is the only dependency.
  - package-ecosystem: pip
    directory: /data/generators
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python

  # --- github-actions ------------------------------------------------------
  # Keeps the pinned action versions in .github/workflows and the two composite
  # actions in .github/actions current. This is the supply chain the whole
  # estate deploys through, so it gets the same treatment as app code.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # --- docker ---------------------------------------------------------------
  # The ecosystem this file was missing, and the reason a CRITICAL openssl CVE
  # sat in three shipped images.
  #
  # `apps/{compliance,control-tower,launch-ops}/Dockerfile` were pinned to
  # `nginx:1.27-alpine`. Docker Hub last rebuilt that tag on 2025-04-16; 1.27 is
  # an end-of-line release, so it kept its name while quietly ceasing to receive
  # base rebuilds, and sixteen months of Alpine security updates never reached
  # the image. Nothing complained, because npm, pip and github-actions were the
  # only ecosystems configured here -- no one was reading the FROM lines at all.
  # Trivy eventually caught it (CVE-2026-31789, libcrypto3/libssl3), but only
  # after the finding had shipped.
  #
  # Dependabot reads FROM lines and opens a PR when the pinned tag moves, which
  # turns "the base image went stale" from something a scanner discovers into
  # something a bump PR prevents. One entry per Dockerfile rather than a
  # `directories:` glob, deliberately: this file's own header warns that a wrong
  # glob means no PRs ever fire, and an explicit path is checkable by eye.
  - package-ecosystem: docker
    directory: /apps/compliance
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/control-tower
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/launch-ops
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/data-api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /apps/mcp-tools
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
