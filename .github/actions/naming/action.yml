name: resolve estate naming
description: >-
  Derives the company prefix, environment segment and every fixed resource name the
  workflows need from infra/bicep/naming.bicep, so no workflow hardcodes the company
  prefix (CLAUDE.md: "Company name and prefix are set once in infra/bicep/naming.bicep
  — do not hardcode 'mls' elsewhere").

inputs:
  naming-file:
    description: 'Path to naming.bicep, relative to the workspace.'
    required: false
    default: infra/bicep/naming.bicep

outputs:
  prefix:
    description: 'Company prefix (naming.bicep defaultCompanyPrefix).'
    value: ${{ steps.resolve.outputs.prefix }}
  env:
    description: 'Environment segment (naming.bicep defaultEnv).'
    value: ${{ steps.resolve.outputs.env }}
  management-group:
    description: 'Management group name — managementGroupName(prefix).'
    value: ${{ steps.resolve.outputs.management-group }}
  rg-platform:
    description: 'resourceGroupName(prefix, "platform").'
    value: ${{ steps.resolve.outputs.rg-platform }}
  rg-apps:
    description: 'resourceGroupName(prefix, "apps").'
    value: ${{ steps.resolve.outputs.rg-apps }}
  rg-data:
    description: 'resourceGroupName(prefix, "data").'
    value: ${{ steps.resolve.outputs.rg-data }}
  rg-ops:
    description: 'resourceGroupName(prefix, "ops").'
    value: ${{ steps.resolve.outputs.rg-ops }}
  rg-list:
    description: 'Space-separated list of the four demo resource groups (teardown scope).'
    value: ${{ steps.resolve.outputs.rg-list }}
  ca-launch-ops:
    description: 'containerAppName(prefix, "launch-ops", env).'
    value: ${{ steps.resolve.outputs.ca-launch-ops }}
  ca-control-tower:
    description: 'containerAppName(prefix, "control-tower", env).'
    value: ${{ steps.resolve.outputs.ca-control-tower }}
  ca-mcp:
    description: >-
      containerAppName(prefix, "mcp", env) — the MCP tools server the Copilot Studio
      agent attaches to. Replaced ca-copilot when the 2026-08-24 amendment moved LLM
      orchestration to Copilot Studio.
    value: ${{ steps.resolve.outputs.ca-mcp }}
  ca-data-api:
    description: >-
      containerAppName(prefix, "data-api", env) — the serving layer both frontends
      proxy /api to. naming.bicep gained the `dataApi` app key with the same value,
      so this and the Bicep agree by construction.
    value: ${{ steps.resolve.outputs.ca-data-api }}
  ca-vuln-lab:
    description: >-
      containerAppName(prefix, "vuln-lab", env) — the L10 deployment witness. It is not a
      serving app: apps/vuln-lab is never containerised (see infra/bicep/apps/main.bicep),
      and this container runs a pinned public placeholder with ingress disabled. Both
      self-heal.yml and vuln-lab-witness.yml address it by this name, and
      verification/layer-10-audit.ps1 reads its revisions for the deploy stage of each
      healing trail. Composed here rather than in each workflow so the prefix stays owned
      by naming.bicep (CLAUDE.md).
    value: ${{ steps.resolve.outputs.ca-vuln-lab }}
  ca-compliance:
    description: >-
      containerAppName(prefix, "compliance", env) — the Task 13 compliance board, gated by
      Container Apps Easy Auth. app-compliance-ci.yml's deploy job and layer-07-apps.yml's
      image-digest resolution step both address it by this name.
    value: ${{ steps.resolve.outputs.ca-compliance }}
  key-vault:
    description: 'keyVaultName(prefix, env).'
    value: ${{ steps.resolve.outputs.key-vault }}
  law:
    description: >-
      logAnalyticsWorkspaceName(prefix, env). Needed by the L7 verify job, which
      resolves the workspace CUSTOMER id from ARM for V7.3 rather than carrying the
      L6 deployment outputs across workflow boundaries.
    value: ${{ steps.resolve.outputs.law }}
  app-insights:
    description: 'appInsightsName(prefix, env).'
    value: ${{ steps.resolve.outputs.app-insights }}

runs:
  using: composite
  steps:
    - name: Resolve names from naming.bicep
      id: resolve
      shell: bash
      env:
        NAMING_FILE: ${{ inputs.naming-file }}
      run: |
        set -euo pipefail

        if [ ! -f "${NAMING_FILE}" ]; then
          echo "::error title=naming.bicep missing::${NAMING_FILE} not found; cannot resolve estate names."
          exit 1
        fi

        read_var() {
          sed -n "s/^var $1 = '\([^']*\)'.*/\1/p" "${NAMING_FILE}" | head -n 1
        }

        # naming.bicep holds the DEFAULTS; MLS_COMPANY_PREFIX / MLS_ENV_SEGMENT
        # override them per deployment (estate.env locally, the `demo` GitHub
        # environment in CI). Rebranding used to mean editing naming.bicep and 22
        # hardcoded names in infra/entra/manifest.json - a manual step reading as a
        # design, the F79/F85 shape.
        #
        # `:-` NOT `:=` and not a bare test: AN UNDEFINED GITHUB VARIABLE EXPANDS TO
        # THE EMPTY STRING, not to unset (F26). `${VAR:-default}` treats empty and
        # unset alike, which is the behaviour wanted here; `${VAR-default}` would
        # accept the empty string and name every resource `-rg-platform`.
        prefix="${MLS_COMPANY_PREFIX:-$(read_var defaultCompanyPrefix)}"
        envseg="${MLS_ENV_SEGMENT:-$(read_var defaultEnv)}"

        if [ -z "${prefix}" ] || [ -z "${envseg}" ]; then
          echo "::error title=naming.bicep unreadable::Could not parse defaultCompanyPrefix / defaultEnv from ${NAMING_FILE}, and no MLS_COMPANY_PREFIX / MLS_ENV_SEGMENT override was set."
          exit 1
        fi

        # VALIDATE HERE, WHERE THE MESSAGE CAN BE READ. An over-long prefix does not
        # fail at the prefix - it fails inside a nested ARM deployment as
        # "resource name invalid", naming a resource the operator never typed. The
        # binding limit is Container Apps at 32 characters: the longest composed name
        # is <prefix>-control-tower-<env>-ca, which is 22 characters before the
        # prefix at env=demo, so 10 is the most a prefix can safely take.
        if ! printf '%s' "${prefix}" | grep -Eq '^[a-z][a-z0-9]{1,9}$'; then
          echo "::error title=Invalid company prefix::MLS_COMPANY_PREFIX='${prefix}' must be 2-10 characters, lowercase letters and digits, starting with a letter. Longer overflows the 32-character Container Apps name limit once the role and environment segments are appended (<prefix>-control-tower-${envseg}-ca)."
          exit 1
        fi
        if ! printf '%s' "${envseg}" | grep -Eq '^[a-z0-9]{2,6}$'; then
          echo "::error title=Invalid environment segment::MLS_ENV_SEGMENT='${envseg}' must be 2-6 characters, lowercase letters and digits."
          exit 1
        fi

        # Publish for every LATER step in the job, so infra/bicep/*/demo.bicepparam
        # (readEnvironmentVariable) and infra/entra/apply-entra.ps1 resolve the SAME
        # prefix this action just resolved, rather than each re-deriving it.
        {
          echo "MLS_COMPANY_PREFIX=${prefix}"
          echo "MLS_ENV_SEGMENT=${envseg}"
        } >> "${GITHUB_ENV}"

        {
          echo "prefix=${prefix}"
          echo "env=${envseg}"
          echo "management-group=${prefix}"
          echo "rg-platform=${prefix}-rg-platform"
          echo "rg-apps=${prefix}-rg-apps"
          echo "rg-data=${prefix}-rg-data"
          echo "rg-ops=${prefix}-rg-ops"
          echo "rg-list=${prefix}-rg-platform ${prefix}-rg-apps ${prefix}-rg-data ${prefix}-rg-ops"
          echo "ca-launch-ops=${prefix}-launch-ops-${envseg}-ca"
          echo "ca-control-tower=${prefix}-control-tower-${envseg}-ca"
          echo "ca-mcp=${prefix}-mcp-${envseg}-ca"
          echo "ca-data-api=${prefix}-data-api-${envseg}-ca"
          echo "ca-vuln-lab=${prefix}-vuln-lab-${envseg}-ca"
          echo "ca-compliance=${prefix}-compliance-${envseg}-ca"
          echo "key-vault=${prefix}-sec-${envseg}-kv"
          echo "law=${prefix}-obs-${envseg}-law"
          echo "app-insights=${prefix}-obs-${envseg}-appi"
        } >> "${GITHUB_OUTPUT}"
