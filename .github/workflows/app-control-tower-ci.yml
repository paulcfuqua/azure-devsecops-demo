name: app-control-tower-ci

# =============================================================================
# Path-filtered CI for apps/control-tower (L7).
# Playbook: docs/runbooks/layers/L07.md
# build -> test -> container build -> Trivy (fail on CRITICAL) -> smoke-test
#       (F22: docker run + /healthz) -> GHCR push
#       -> deploy to ACA via OIDC (guarded on the demo environment).
#
# ---------------------------------------------------------------------------
# OPEN ITEM P-7 — the Docker build context is the REPO ROOT, not
# apps/control-tower. The Dockerfile copies the root package-lock.json and the
# @mls/spec-renderer workspace, so an app-directory context cannot build it.
#
# OPEN ITEM P-1 — target port. The image serves on 8080 (nginx) but
# infra/bicep/apps/demo.bicepparam still defaults the container app's target port
# to the placeholder 80. Set CONTROL_TOWER_PORT=8080 in the `demo` GitHub
# environment when the first real image publishes; the deploy job warns rather
# than silently mutating ingress.
# ---------------------------------------------------------------------------
#
# PRE-G0 GUARD: build/test/scan/push run from day one; the deploy job skips until
# the `demo` environment variables exist.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - apps/control-tower/**
      - apps/shared/**
      - package.json
      - package-lock.json
      - .github/workflows/app-control-tower-ci.yml
  # NO `paths:` FILTER HERE, AND THAT IS THE POINT. Read this before adding one
  # back.
  #
  # The `image` job below is the only thing in this repository that runs the
  # Trivy CRITICAL gate and F22's boot smoke test. Both were advisory until
  # 2026-08-28: the branch ruleset's required checks were lint-ci, CodeQL,
  # gitleaks and pytest, and not one image job. A pull request whose container
  # image failed to scan, or could not start at all, satisfied every rule the
  # ruleset had. That is not hypothetical -- PR #37, which fixed exactly those
  # two defects, could itself have been merged with both still in it.
  #
  # Making the image job a REQUIRED check is what closes that, and a required
  # check must be able to report on every pull request. A `paths:`-filtered
  # workflow does not run at all when the filter misses, GitHub never receives
  # a conclusion for the context, and the pull request stays pending forever.
  # So the filter comes off the `pull_request` trigger and stays on `push`,
  # where nothing is gated on it and skipping the work is free.
  #
  # The cost is one container build per pull request. It is not a push: this
  # job's build step is `push: false` on pull requests and the GHCR login and
  # push steps are `if: github.event_name != 'pull_request'`, so a pull-request
  # run writes nothing to the registry and consumes only Actions time, which is
  # free on a public repository.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-control-tower-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/control-tower
  APP_SLUG: control-tower
  WORKSPACE: apps/control-tower

jobs:
  preflight:
    name: preflight (demo environment guard)
    # Fork pull requests must not reach the `demo` environment. This job mints no
    # OIDC token (top-level permissions are contents: read), so it was never a
    # credential path — but a public-repo PR should not touch a deployment
    # environment at all, and the deploy job below carries the same guard.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Bounded: reads repository variables and nothing else. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 10
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: control-tower deploy

  build-test:
    name: build and test
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build @mls/spec-renderer (workspace dependency)
        run: npm run build:renderer

      - name: Typecheck and build control-tower
        run: |
          set -euo pipefail
          npm run typecheck --workspace "${WORKSPACE}"
          npm run build --workspace "${WORKSPACE}"

      - name: Test the renderer and the app
        run: |
          set -euo pipefail
          npm run test --workspace apps/shared/spec-renderer
          npm run test --workspace "${WORKSPACE}"

      # THE CHECK NOBODY HAD WRITTEN: does a browser actually render this app?
      #
      # docs/DEMO-READINESS.md section D named this gap and 2026-09-01 evidenced
      # it five times - F110, F111, F116, F117 and a "Defender secure score 0.0%"
      # rendered from an empty API response. EVERY ONE was found by a human
      # opening the page, and none was catchable by anything in CI, because the
      # suites above run in Node: no browser, and no Content-Security-Policy for
      # a browser to enforce.
      #
      # This serves the production bundle under the production CSP, drives real
      # Chromium at it, and asserts each tab puts content in the DOM. It runs in
      # LOCAL_DATA mode against committed fixtures, so it needs no tenant, no
      # credential and no network - which is what makes it a pull-request check
      # rather than a post-deployment one.
      - name: Install Chromium for the render check
        run: npx playwright install --with-deps chromium

      - name: Render the app in a real browser under the production CSP
        run: |
          set -euo pipefail
          # LOCAL_DATA=1 forces the committed fixtures into a PRODUCTION build,
          # which is the only way to exercise the shipped bundle without a
          # tenant. vite maps it to VITE_LOCAL_DATA (see vite.config.ts).
          LOCAL_DATA=1 npm run build --workspace "${WORKSPACE}"
          npm run test:browser --workspace "${WORKSPACE}"

  image:
    # Named per app, not just "container build, scan and push": all five
    # app-*-ci.yml workflows run this job on every pull request now, and a
    # required status check is matched by the check run's NAME. Five check
    # runs sharing one name cannot be required unambiguously.
    name: container build, scan and push (control-tower)
    needs: build-test
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
      # The digest of what was actually pushed. L7's V7.1 binds the live
      # endpoint to the audited build by comparing the health payload's
      # content-hash marker with this, so it has to travel from the only
      # step that knows it to the deploy step that stamps it on the app.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute the GHCR reference
        id: tag
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          registry="ghcr.io/$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')/${APP_SLUG}"
          tag="sha-${GITHUB_SHA:0:7}"
          {
            echo "registry=${registry}"
            echo "tag=${tag}"
            echo "image=${registry}:${tag}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image (context = repo root, open item P-7)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tag.outputs.image }}
          # F118: Vite inlines VITE_ variables at BUILD time, so the Ask tab's
          # endpoint has to arrive here or the bundle ships dark whatever is
          # deployed. A repository variable, not a secret - it is a public URL.
          build-args: |
            VITE_DIRECTLINE_TOKEN_URL=${{ vars.MLS_DIRECTLINE_TOKEN_URL }}
          cache-from: type=gha,scope=control-tower
          cache-to: type=gha,mode=max,scope=control-tower

      - name: Trivy gate — fail the build on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy SARIF for the Security tab (non-blocking)
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-control-tower.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload the Trivy SARIF
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('trivy-control-tower.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-control-tower.sarif
          category: trivy-control-tower

      - name: Smoke-test the image — boot it and check its own /healthz (F22)
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          set -euo pipefail
          # F22: CI built and Trivy-scanned this image but never started it, so
          # Task 14's USER-nginx hardening had no proof the entrypoint actually
          # serves THIS app. The failure mode is silent, not loud: if
          # /etc/nginx/conf.d is not writable by `nginx`, the base image's
          # docker-entrypoint.sh skips the envsubst pass over *.template
          # (20-envsubst-on-templates.sh checks `[ -w "$output_dir" ]` and
          # no-ops rather than erroring) and nginx falls back to the STOCK
          # "Welcome to nginx!" config baked into nginx:1.31-alpine.
          #
          # WHICH HALF OF THIS CHECK CATCHES THAT (corrected by the Task 24
          # review; the earlier wording claimed a 404 on /healthz). Per this
          # app's Dockerfile, stock nginx serves on PORT 80 -- only our
          # template ever says `listen 8080;`. We publish and curl 8080 only,
          # so an untemplated image accepts no connection at all and the poll
          # below fails on its bounded timeout. That timeout branch is the
          # load-bearing one for the F14 regression. The "ok " body-prefix
          # assertion is an independent second guard, covering every other
          # "something answers 8080 but it is not this app" case that a bare
          # 200 would wave through.
          #
          # Placed after the Trivy CRITICAL gate (a vulnerable image is never
          # even started) and before "Log in to GHCR" (no registry credential
          # has entered the job's environment yet). The brief's other placement
          # rule -- no job holding packages:write or id-token:write -- cannot be
          # honoured to the letter: this `image` job builds AND pushes, so it
          # holds packages:write (and security-events:write) by construction,
          # same as every app-*-ci.yml image job. This is the closest safe
          # position inside the only job that has the built image loaded (see
          # the Task 24 report for the full ruling).
          container_id="$(docker run -d -p 127.0.0.1::8080 "${IMAGE}")"
          cleanup() {
            docker stop "${container_id}" >/dev/null 2>&1 || true
            docker rm "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          host_port="$(docker port "${container_id}" 8080/tcp | awk -F: '{print $NF}' | head -n1)"
          if [ -z "${host_port}" ]; then
            echo "::error::control-tower: docker port reported no host mapping for 8080. Usually this means the container is already gone (an image whose entrypoint exits immediately); a container that starts but never binds 8080 normally fails the poll below instead."
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

          url="http://127.0.0.1:${host_port}/healthz"
          status=""
          body=""
          for _ in $(seq 1 30); do
            if raw="$(curl -s --max-time 3 -w '\n%{http_code}' "${url}")"; then
              status="${raw##*$'\n'}"
              body="${raw%$'\n'*}"
              break
            fi
            sleep 2
          done

          if [ -z "${status}" ]; then
            echo "::error::control-tower never accepted a connection on :8080/healthz within 60s"
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

          echo "GET /healthz -> ${status}: ${body}"
          if [ "${status}" != "200" ] || ! printf '%s' "${body}" | grep -Eq '^ok '; then
            echo "::error::control-tower answered on 8080 but /healthz did not return this app's own payload (status ${status}, body: ${body}) -- something is serving that port and it is not this app. Note the F14 untemplated-nginx case does NOT land here: stock nginx serves on port 80, so that regression fails the poll above with no connection at all."
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        id: push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.registry }}:latest
          # F118: Vite inlines VITE_ variables at BUILD time, so the Ask tab's
          # endpoint has to arrive here or the bundle ships dark whatever is
          # deployed. A repository variable, not a secret - it is a public URL.
          build-args: |
            VITE_DIRECTLINE_TOKEN_URL=${{ vars.MLS_DIRECTLINE_TOKEN_URL }}
          cache-from: type=gha,scope=control-tower
          cache-to: type=gha,mode=max,scope=control-tower

  deploy:
    name: deploy to Container Apps
    needs: [preflight, image]
    if: ${{ needs.preflight.outputs.configured == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the new image onto the container app
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.names.outputs.ca-control-tower }}
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # MLS_IMAGE_DIGEST is stamped in the same call. L7's V7.1 compares the
          # health payload's content-hash marker with the digest the deploy run
          # recorded and refuses to pass on liveness alone, and this step is the
          # only place on the per-app deploy path that knows it. --set-env-vars,
          # not --replace-env-vars: DATA_API_ORIGIN and the App Insights
          # connection string came from the L7 template and must survive.
          # THE APP IS CREATED BY L7, AND THIS WORKFLOW DOES NOT KNOW THAT.
          #
          # The job is gated on `preflight.outputs.configured` - the demo environment having
          # its identity variables - which says nothing about whether the container app
          # exists. It had never been noticed because app CI only fires when an app's paths
          # change, and no such push had landed since L6 first created the Container Apps
          # ENVIRONMENT. The moment one did, five workflows failed with
          # `The containerapp '<name>' does not exist` (F83).
          #
          # An image build succeeding and there being nowhere to roll it are different facts.
          # Missing app: report and stop cleanly. The image is built, scanned and pushed, and
          # the next L7 deploy picks it up.
          if ! az containerapp show --resource-group "${RG_APPS}" --name "${APP_NAME}" >/dev/null 2>&1; then
            echo "::notice title=Container app not deployed yet::'${APP_NAME}' does not exist in ${RG_APPS}, so there is nothing to roll the new image onto. L7 creates it; the image is already built, scanned and pushed, and the next L7 deploy will use it."
            exit 0
          fi

          az containerapp update \
            --resource-group "${RG_APPS}" \
            --name "${APP_NAME}" \
            --image "${IMAGE}" \
            --set-env-vars "MLS_IMAGE_DIGEST=${IMAGE_DIGEST:-unset}" \
            --min-replicas 0 \
            --output none
          echo "Deployed ${IMAGE} (digest ${IMAGE_DIGEST:-unset}) to ${APP_NAME}."
          if [ -z "${IMAGE_DIGEST:-}" ]; then
            echo "::warning title=No image digest recorded::The push step reported no digest, so MLS_IMAGE_DIGEST is 'unset' on ${APP_NAME} and L7 V7.1 will report that the health payload does not carry the deployed digest."
          fi

      - name: Check the ingress target port (open item P-1)
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.names.outputs.ca-control-tower }}
          CONFIGURED_PORT: ${{ vars.CONTROL_TOWER_PORT }}
        run: |
          set -euo pipefail
          current="$(az containerapp show -g "${RG_APPS}" -n "${APP_NAME}" \
            --query properties.configuration.ingress.targetPort -o tsv)"
          echo "Current ingress target port: ${current}"
          if [ "${current}" = "80" ] && [ -z "${CONFIGURED_PORT}" ]; then
            echo "::warning title=Ingress still on the placeholder port::${APP_NAME} serves a real image on 8080 but ingress still targets port 80, so this app was last deployed by an L7 run that took the placeholder path. Re-run layer-07-apps.yml - it now derives the port from the image it deploys (F88), so no variable needs setting. Ingress is deliberately NOT mutated here."
          fi

      - name: Deployment summary
        env:
          APP_NAME: ${{ steps.names.outputs.ca-control-tower }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          {
            echo "### control-tower deployed"
            echo
            echo "- container app: \`${APP_NAME}\`"
            echo "- image: \`${IMAGE}\`"
            echo
            echo "Verification: \`verification/layer-07-audit.ps1\`; the Dev/Sec feeds"
            echo "it renders are wired at L9 (\`verification/layer-09-audit.ps1\`)."
          } >> "${GITHUB_STEP_SUMMARY}"
