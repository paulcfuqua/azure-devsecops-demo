name: app-data-api-ci

# =============================================================================
# Path-filtered CI for apps/data-api (L7 serving layer).
# Playbook: docs/runbooks/layers/L07.md
# Plan: docs/superpowers/plans/2026-08-24-phase-q-turnkey.md (Track B, gap Q-4)
#
# build -> test (route/shape parity with BOTH frontends' ApiProvider, allowlist,
#          row caps, error shapes, mocked cloud adapters)
#       -> container build -> Trivy (fail on CRITICAL) -> smoke-test
#       (F22: docker run + /healthz) -> GHCR push
#       -> deploy to ACA via OIDC (guarded on the demo environment).
#
# This service answers what apps/launch-ops and apps/control-tower already
# fetch. Its test suite re-derives the routes and row types from those two
# packages' sources at run time, so the frontends are path-filter inputs here:
# editing a provider must be able to fail this pipeline. That is the point of
# including them below rather than only apps/data-api/**.
#
# It holds no stored secret. Azure SQL, the Fabric SQL analytics endpoint,
# Defender and Log Analytics all authenticate with the container app's managed
# identity; CI itself authenticates by OIDC and carries nothing but
# GITHUB_TOKEN.
#
# ---------------------------------------------------------------------------
# OPEN ITEM P-1 (shared with the other app pipelines) — target port. The image
# serves on 8080 but infra/bicep may still default the container app's target
# port to the placeholder 80. Set DATA_API_PORT=8080 in the `demo` GitHub
# environment once the first real image publishes. Ingress is deliberately NOT
# mutated here.
#
# CLOSED — container app name. `.github/actions/naming` now exposes `ca-data-api`
# and `naming.bicep` carries the matching `dataApi` app key, so the container app
# this workflow rolls images onto and the one `infra/bicep/apps/main.bicep`
# provisions are named from one source. `DATA_API_APP_NAME` still overrides it.
# ---------------------------------------------------------------------------
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - apps/data-api/**
      - apps/launch-ops/src/providers/**
      - apps/control-tower/src/providers/**
      - package.json
      - package-lock.json
      - .github/workflows/app-data-api-ci.yml
  # NO `paths:` FILTER HERE, AND THAT IS THE POINT. Read this before adding one
  # back.
  #
  # The `image` job below is the only thing in this repository that runs the
  # Trivy CRITICAL gate and F22's boot smoke test. Both were advisory until
  # 2026-08-28: the branch ruleset's required checks were lint-ci, CodeQL,
  # gitleaks and pytest, and not one image job. A pull request whose container
  # image failed to scan, or could not start at all, satisfied every rule the
  # ruleset had. That is not hypothetical -- PR #37, which fixed exactly those
  # two defects, could itself have been merged with both still in it.
  #
  # Making the image job a REQUIRED check is what closes that, and a required
  # check must be able to report on every pull request. A `paths:`-filtered
  # workflow does not run at all when the filter misses, GitHub never receives
  # a conclusion for the context, and the pull request stays pending forever.
  # So the filter comes off the `pull_request` trigger and stays on `push`,
  # where nothing is gated on it and skipping the work is free.
  #
  # The cost is one container build per pull request. It is not a push: this
  # job's build step is `push: false` on pull requests and the GHCR login and
  # push steps are `if: github.event_name != 'pull_request'`, so a pull-request
  # run writes nothing to the registry and consumes only Actions time, which is
  # free on a public repository.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-data-api-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/data-api
  APP_SLUG: data-api
  WORKSPACE: apps/data-api

jobs:
  preflight:
    name: preflight (demo environment guard)
    # Fork pull requests must not reach the `demo` environment. This job mints no
    # OIDC token (top-level permissions are contents: read), so it was never a
    # credential path — but a public-repo PR should not touch a deployment
    # environment at all, and the deploy job below carries the same guard.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Bounded: reads repository variables and nothing else. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 10
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: data-api deploy

  build-test:
    name: build and contract tests
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate the deterministic dataset the LOCAL backend serves
        run: |
          set -euo pipefail
          cd data
          python -m generators build

      - name: Typecheck and build data-api
        run: |
          set -euo pipefail
          npm run typecheck --workspace "${WORKSPACE}"
          npm run build --workspace "${WORKSPACE}"

      - name: Contract tests (parity with both ApiProviders, allowlists, caps, cloud mocks)
        run: npm run test --workspace "${WORKSPACE}"

      - name: Frontend tests still pass against the shared contract
        run: |
          set -euo pipefail
          npm run build --workspace apps/shared/spec-renderer
          npm run test --workspace apps/launch-ops
          npm run test --workspace apps/control-tower

  image:
    # Named per app, not just "container build, scan and push": all five
    # app-*-ci.yml workflows run this job on every pull request now, and a
    # required status check is matched by the check run's NAME. Five check
    # runs sharing one name cannot be required unambiguously.
    name: container build, scan and push (data-api)
    needs: build-test
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
      # The digest of what was actually pushed. L7's V7.1 binds the live
      # endpoint to the audited build by comparing the health payload's
      # content-hash marker with this, so it has to travel from the only
      # step that knows it to the deploy step that stamps it on the app.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute the GHCR reference
        id: tag
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          registry="ghcr.io/$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')/${APP_SLUG}"
          tag="sha-${GITHUB_SHA:0:7}"
          {
            echo "registry=${registry}"
            echo "tag=${tag}"
            echo "image=${registry}:${tag}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image (context = repo root for the workspace lockfile)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=data-api
          cache-to: type=gha,mode=max,scope=data-api

      - name: Trivy gate — fail the build on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy SARIF for the Security tab (non-blocking)
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-data-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload the Trivy SARIF
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('trivy-data-api.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-data-api.sarif
          category: trivy-data-api

      - name: Smoke-test the image — boot it and check its own /healthz (F22)
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          set -euo pipefail
          # F22: CI built and Trivy-scanned this image but never started it.
          # data-api boots in MLS_DATA_BACKENDS=local mode (config.ts's default
          # when the var is unset) with no environment at all: LocalTablesBackend
          # only reads data/generated/*.json lazily per table request, and
          # /healthz never touches it, so the process comes up and answers
          # /healthz with no setup here.
          #
          # Placed after the Trivy CRITICAL gate (a vulnerable image is never
          # even started) and before "Log in to GHCR" (no registry credential
          # has entered the job's environment yet). The brief's other placement
          # rule -- no job holding packages:write or id-token:write -- cannot be
          # honoured to the letter: this `image` job builds AND pushes, so it
          # holds packages:write (and security-events:write) by construction,
          # same as every app-*-ci.yml image job. This is the closest safe
          # position inside the only job that has the built image loaded (see
          # the Task 24 report for the full ruling).
          container_id="$(docker run -d -p 127.0.0.1::8080 "${IMAGE}")"
          cleanup() {
            docker stop "${container_id}" >/dev/null 2>&1 || true
            docker rm "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          host_port="$(docker port "${container_id}" 8080/tcp | awk -F: '{print $NF}' | head -n1)"
          if [ -z "${host_port}" ]; then
            echo "::error::data-api: docker port reported no host mapping for 8080. Usually this means the container is already gone (an image whose entrypoint exits immediately); a container that starts but never binds 8080 normally fails the poll below instead."
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

          url="http://127.0.0.1:${host_port}/healthz"
          status=""
          body=""
          for _ in $(seq 1 30); do
            if raw="$(curl -s --max-time 3 -w '\n%{http_code}' "${url}")"; then
              status="${raw##*$'\n'}"
              body="${raw%$'\n'*}"
              break
            fi
            sleep 2
          done

          if [ -z "${status}" ]; then
            echo "::error::data-api never accepted a connection on :8080/healthz within 60s"
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

          echo "GET /healthz -> ${status}: ${body}"
          if [ "${status}" != "200" ]; then
            echo "::error::data-api /healthz returned HTTP ${status} (body: ${body})"
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi
          # The app-own discriminator (not the stock anything -- this image has
          # no nginx fallback, but the contract is the same idea as the two
          # frontends': the payload must be the app's, not a default).
          if ! printf '%s' "${body}" | jq -e '.service == "data-api"' >/dev/null 2>&1; then
            echo "::error::data-api /healthz did not report the app's own payload (expected .service == \"data-api\", got: ${body})"
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        id: push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.registry }}:latest
          cache-from: type=gha,scope=data-api
          cache-to: type=gha,mode=max,scope=data-api

  deploy:
    name: deploy to Container Apps
    needs: [preflight, image]
    if: ${{ needs.preflight.outputs.configured == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Resolve the container app name
        id: app
        env:
          DERIVED: ${{ steps.names.outputs.ca-data-api }}
          OVERRIDE: ${{ vars.DATA_API_APP_NAME }}
        run: |
          set -euo pipefail
          # Open item closed: naming.bicep gained the `dataApi` app key and the
          # naming action now exposes ca-data-api, so this no longer re-implements
          # the <prefix>-<app>-<env>-<type> pattern by hand. The Bicep that
          # provisions the app and this workflow that rolls images onto it now
          # derive the name from the same single source (CLAUDE.md).
          name="${OVERRIDE:-${DERIVED}}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "Container app: ${name}"

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the new image onto the container app
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.app.outputs.name }}
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # apps/data-api/src/config.ts reads MLS_IMAGE_DIGEST as the /healthz
          # `build` marker, which is what binds a live endpoint to an audited
          # build. --set-env-vars, not --replace-env-vars: MLS_DATA_BACKENDS and
          # the whole cloud-mode block came from the L7 template and must survive
          # a per-app image roll.
          # THE APP IS CREATED BY L7, AND THIS WORKFLOW DOES NOT KNOW THAT.
          #
          # The job is gated on `preflight.outputs.configured` - the demo environment having
          # its identity variables - which says nothing about whether the container app
          # exists. It had never been noticed because app CI only fires when an app's paths
          # change, and no such push had landed since L6 first created the Container Apps
          # ENVIRONMENT. The moment one did, five workflows failed with
          # `The containerapp '<name>' does not exist` (F83).
          #
          # An image build succeeding and there being nowhere to roll it are different facts.
          # Missing app: report and stop cleanly. The image is built, scanned and pushed, and
          # the next L7 deploy picks it up.
          if ! az containerapp show --resource-group "${RG_APPS}" --name "${APP_NAME}" >/dev/null 2>&1; then
            echo "::notice title=Container app not deployed yet::'${APP_NAME}' does not exist in ${RG_APPS}, so there is nothing to roll the new image onto. L7 creates it; the image is already built, scanned and pushed, and the next L7 deploy will use it."
            exit 0
          fi

          az containerapp update \
            --resource-group "${RG_APPS}" \
            --name "${APP_NAME}" \
            --image "${IMAGE}" \
            --set-env-vars "MLS_IMAGE_DIGEST=${IMAGE_DIGEST:-unset}" \
            --min-replicas 0 \
            --output none
          echo "Deployed ${IMAGE} (digest ${IMAGE_DIGEST:-unset}) to ${APP_NAME}."

      - name: Check the ingress target port (open item P-1)
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.app.outputs.name }}
          CONFIGURED_PORT: ${{ vars.DATA_API_PORT }}
        run: |
          set -euo pipefail
          current="$(az containerapp show -g "${RG_APPS}" -n "${APP_NAME}" \
            --query properties.configuration.ingress.targetPort -o tsv)"
          echo "Current ingress target port: ${current}"
          if [ "${current}" = "80" ] && [ -z "${CONFIGURED_PORT}" ]; then
            echo "::warning title=Ingress still on the placeholder port::${APP_NAME} serves a real image on 8080 but ingress still targets port 80, so this app was last deployed by an L7 run that took the placeholder path. Re-run layer-07-apps.yml - it now derives the port from the image it deploys (F88), so no variable needs setting. Ingress is deliberately NOT mutated here."
          fi

      - name: Confirm the backend mode the deployed revision will serve
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          set -euo pipefail
          mode="$(az containerapp show -g "${RG_APPS}" -n "${APP_NAME}" \
            --query "properties.template.containers[0].env[?name=='MLS_DATA_BACKENDS'].value | [0]" \
            -o tsv)"
          echo "MLS_DATA_BACKENDS on the container app: ${mode:-<unset>}"
          if [ "${mode}" != "cloud" ]; then
            echo "::warning title=data-api is not in cloud mode::MLS_DATA_BACKENDS is '${mode:-<unset>}'. LOCAL mode reads data/generated, which is NOT baked into the image, so every table route will answer 503. Set MLS_DATA_BACKENDS=cloud (plus the SQL/Fabric/Defender/Log Analytics settings) on the container app."
          fi

      - name: Deployment summary
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          {
            echo "### data-api deployed"
            echo
            echo "- container app: \`${APP_NAME}\`"
            echo "- image: \`${IMAGE}\`"
            echo "- routes: \`GET /tables/:table\`, \`GET /feeds/:name\`, \`GET /healthz\`"
            echo
            echo "\`/healthz\` reports the live backend set, the allowlists and whether"
            echo "tracing is exporting — check it before blaming the frontends for an"
            echo "empty dashboard."
          } >> "${GITHUB_STEP_SUMMARY}"
