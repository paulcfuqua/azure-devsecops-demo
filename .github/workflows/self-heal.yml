name: self-heal

# =============================================================================
# Showpiece #3 — the self-healing pipeline (L10).
# Playbook: docs/runbooks/layers/L10.md
# Governing amendment: docs/superpowers/specs/2026-08-24-amendment-copilot-studio.md
#
#   security finding -> GitHub-generated fix -> PR -> CI gauntlet
#                    -> auto-merge on green -> deploy -> alert closed
#
# The authored Claude triage step is gone (amendment §2: "GitHub Copilot Autofix
# (GHAS code scanning) generates the fix for CodeQL and dependency findings").
# No LLM API key of any kind is read anywhere in this file — the amendment makes
# "no stored secrets in CI" absolute — and .github/scripts/ is gone with it.
#
# ---------------------------------------------------------------------------
# WHAT COPILOT AUTOFIX ACTUALLY DOES, AND WHAT THIS WORKFLOW HAS TO DO ITSELF
#
# Verified against docs.github.com on 2026-08-24. The amendment's phrase
# "generates the fix for CodeQL *and dependency* findings" is only half right,
# and the difference is load-bearing, so it is spelled out rather than papered
# over:
#
#   CODE SCANNING (CodeQL) alerts — Autofix applies.
#     * Autofix "Generates a single suggested fix for an alert, which you review
#       and apply yourself." It produces a DIFF. It does not commit, and it does
#       not open a pull request.
#       https://docs.github.com/en/code-security/concepts/code-scanning/copilot-autofix-for-code-scanning
#     * It runs AUTOMATICALLY for CodeQL alerts found ON PULL REQUESTS. For
#       alerts already sitting on the default branch — which is what a scheduled
#       heal is looking at — a fix must be requested: the "Generate fix" button,
#       or POST .../autofix.
#     * GA and free on all public repositories; no Copilot subscription, no AI
#       credits, and enabled by default alongside CodeQL.
#     * It is NOT guaranteed to produce anything. GitHub documents Autofix as
#       non-deterministic and capable of producing incomplete or partial fixes,
#       so "no suggestion" is a normal outcome this workflow must survive rather
#       than a failure it should report.
#       https://docs.github.com/en/code-security/code-scanning/managing-code-scanning-alerts/responsible-use-autofix-code-scanning
#     * The three REST endpoints this workflow drives:
#         POST   /repos/{o}/{r}/code-scanning/alerts/{n}/autofix          (202/200)
#         GET    /repos/{o}/{r}/code-scanning/alerts/{n}/autofix          (status)
#         POST   /repos/{o}/{r}/code-scanning/alerts/{n}/autofix/commits  (201)
#       The commits endpoint takes `target_ref` + `message` and states plainly:
#       "Branch needs to already exist." It commits to a branch. It does NOT
#       create the branch and it does NOT open the PR.
#       https://docs.github.com/en/rest/code-scanning/code-scanning
#     * So the honest division of labour is:
#         Autofix generates      -> the patch
#         this workflow does     -> request it, wait for it, create the branch,
#                                   commit it, open the PR, arm auto-merge
#
#   DEPENDABOT (dependency) alerts — Autofix does NOT apply.
#     * There is no autofix endpoint under /repos/{o}/{r}/dependabot/alerts.
#       Copilot Autofix's suggested-diff feature is a code-scanning feature.
#       https://docs.github.com/en/rest/dependabot/alerts
#     * There is also no API to trigger a Dependabot security-update PR on
#       demand. The Dependabot alerts API can list, read and triage alerts —
#       nothing more.
#     * Dependabot opens the PR itself when "Dependabot security updates" is
#       enabled: "Dependabot will automatically try to open pull requests to
#       resolve every open Dependabot alert that has an available patch."
#       https://docs.github.com/en/code-security/concepts/supply-chain-security/dependabot-security-updates
#     * This matters for the demo because all three seeded apps/vuln-lab CVEs
#       (json5 2.2.0, minimist 1.2.5, semver 7.5.1) are DEPENDENCY findings.
#       Autofix will never touch them, and until the lab also seeds a
#       CodeQL-detectable code flaw the `autofix` job below has nothing to act
#       on. So the `dependency` job does the only honest thing available: it
#       finds Dependabot's own security PR and puts it through the same gauntlet
#       with the same auto-merge-on-green.
#       (`open-pull-requests-limit: 0` in dependabot.yml does not block this —
#       that setting caps *version* updates; security updates are exempt.)
#     * The newer "assign a Dependabot alert to an AI coding agent" path (GA
#       2026-04-07) does open a draft PR from an alert, but it requires a Copilot
#       plan with coding-agent access and consumes AI credits. That is a paid
#       dependency this demo does not have, so it is not wired here.
#
# ---------------------------------------------------------------------------
# WHY AUTO-MERGE-ON-GREEN IS DELIBERATE HERE, AND ONLY HERE
#
# Merging a machine-authored patch without a human approval is normally a
# terrible idea. In this repository it is the entire point of the demo:
#
#   * The brief makes the closed loop the deliverable — "auto-merge on green"
#     is written into the master plan's L10 definition, and L10 V10.1 stage 4
#     explicitly FAILS the audit if `mergedBy.login` is a human. A
#     hand-assisted chain is a failed chain.
#   * The human still sees everything. Per the brief they see the PR trail —
#     the generated diff, the check runs, the merge — just not an approval
#     prompt. Nothing is hidden; the review is post-hoc and fully auditable.
#   * The blast radius is a public demo repo full of synthetic data. There is
#     no customer, no production traffic and no real secret in the diff path.
#     The estate it deploys to is disposable by design (`infra-down.yml`).
#   * The merge is not unconditional: the PR must clear the same checks any
#     other change to these paths clears. `--auto` only fires when every
#     required check is green, and a heal that breaks the build simply never
#     merges (L10 failure mode 4: "the pipeline honestly refusing a bad heal").
#
#     WHAT THAT ACTUALLY IS, on a heal PR touching `apps/vuln-lab/**` (F29 —
#     this list previously also named the Trivy CRITICAL gate and ZAP, and
#     neither can run on such a PR):
#       * `lint-ci`  — actionlint, PSScriptAnalyzer, the Pester suite, pytest,
#                      `npm test` and `npm run typecheck`. No path filter, so it
#                      runs on every PR.
#       * `codeql`   — `pull_request` on `main`, no path filter.
#       * `gitleaks` — `pull_request` on `main`, no path filter.
#     NOT reachable on a heal PR, and not to be claimed:
#       * The **Trivy CRITICAL gate** lives only in the five `app-*-ci.yml`
#         workflows, whose `pull_request` `paths:` filters are `apps/<app>/**`
#         plus the ROOT `package.json`/`package-lock.json`. A Dependabot fix to
#         `apps/vuln-lab/package*.json` matches none of them, so no app CI runs
#         and no image is ever scanned.
#       * **ZAP** (`zap.yml`) has only `workflow_call` and `workflow_dispatch`
#         triggers. A workflow with no `pull_request` trigger cannot produce a
#         check run on a PR, so it can never be a required check on one.
#     Keep this list honest: it is the justification for merging machine-written
#     code without a human, and it is worth exactly what it actually runs.
#   * Scope is narrow: this workflow only ever lands a fix GitHub itself
#     generated for a named security advisory, on its own branch.
#
# DO NOT copy this pattern into a repository that ships to real users without
# replacing auto-merge with a required human review.
#
# ---------------------------------------------------------------------------
# THE TOKEN PROBLEM, STATED UP FRONT (L10 failure mode 2's real cause)
#
# Two documented behaviours can silently stall the chain, and both are about
# WHICH token opens the PR:
#
#   1. "When you use the repository's GITHUB_TOKEN to perform tasks, events
#      triggered by the GITHUB_TOKEN will not create a new workflow run, with
#      the following exceptions: pull_request events with the opened,
#      synchronize, or reopened activity types: when a workflow using
#      GITHUB_TOKEN creates or updates a pull request, the resulting
#      pull_request event creates workflow runs in an APPROVAL-REQUIRED state."
#      https://docs.github.com/en/actions/concepts/security/github_token
#      A gauntlet waiting on a human to click "Approve workflows to run" is a
#      gauntlet that never goes green, and auto-merge never fires.
#
#   2. The autofix REST endpoints document classic-PAT scopes (`security_events`
#      for generate/read, the broader `repo` for commits). GitHub does not
#      publish whether the Actions GITHUB_TOKEN satisfies them. Unverified is
#      unverified, so every autofix call here degrades to a NOTICE on 403
#      rather than failing the run.
#
# Both are answered by the optional `SELF_HEAL_TOKEN` secret — a PAT or GitHub
# App token. With it, PRs are authored by a non-GITHUB_TOKEN identity and their
# checks run without an approval gate. Without it the workflow still runs end to
# end and says, in the job summary, exactly which half is stalled and why.
#
# ---------------------------------------------------------------------------
# TRIGGER DEVIATION (important — this is not what the playbook assumed)
#
# L10's deploy procedure names `dependabot_alert` / `code_scanning_alert` as the
# triggers, flagged `[derived trigger detail]`. Neither is a valid GitHub Actions
# workflow event — they exist as webhook events only, and actionlint rejects them
# outright ("unknown Webhook event"). Verified against actionlint 1.7.12 and
# against docs.github.com's list of events that trigger workflows, where neither
# name appears.
#
# The closest honest equivalents, all wired below:
#   * `schedule` — poll open alerts and heal the next un-healed one. This is the
#     no-external-infrastructure path and the one the demo relies on; L10's audit
#     window is 24 h from re-seed, which a 6-hourly poll sits comfortably inside.
#   * `repository_dispatch` — a real event bridge. Point an org/repo webhook for
#     `dependabot_alert` / `code_scanning_alert` at
#     `POST /repos/{owner}/{repo}/dispatches` with the matching event_type and the
#     alert in `client_payload`, and the chain fires on alert creation.
#   * `workflow_dispatch` — manual, for demos and for re-running one alert.
# ---------------------------------------------------------------------------
# =============================================================================

on:
  schedule:
    # Every 6 hours. Alerts appear minutes-to-hours after a re-seed merge.
    - cron: '13 */6 * * *'
  repository_dispatch:
    types:
      - dependabot-alert
      - code-scanning-alert
  workflow_dispatch:
    inputs:
      alert_kind:
        description: Which alert surface to heal
        type: choice
        options:
          - dependabot
          - code-scanning
        default: dependabot
      alert_number:
        description: 'Alert number to heal (empty = pick the oldest open alert)'
        type: string
        default: ''
      dry_run:
        description: 'Open/locate the PR but do not enable auto-merge'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  select:
    name: select the alert to heal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    outputs:
      found: ${{ steps.pick.outputs.found }}
      kind: ${{ steps.pick.outputs.kind }}
      number: ${{ steps.pick.outputs.number }}
    steps:
      - name: Resolve the alert
        id: pick
        env:
          # A PAT with `security_events` reads Dependabot alerts reliably; the
          # default GITHUB_TOKEN may be refused on that endpoint. Either way a
          # 403 is a NOTICE, never a failed run.
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_KIND: ${{ inputs.alert_kind }}
          INPUT_NUMBER: ${{ inputs.alert_number }}
          PAYLOAD_KIND: ${{ github.event.client_payload.alert_kind }}
          PAYLOAD_NUMBER: ${{ github.event.client_payload.alert_number }}
        run: |
          set -euo pipefail

          kind="dependabot"
          number=""

          case "${EVENT}" in
            workflow_dispatch)
              kind="${INPUT_KIND:-dependabot}"
              number="${INPUT_NUMBER}"
              ;;
            repository_dispatch)
              kind="${PAYLOAD_KIND:-dependabot}"
              number="${PAYLOAD_NUMBER}"
              ;;
          esac

          if [ -n "${number}" ]; then
            {
              echo "found=true"
              echo "kind=${kind}"
              echo "number=${number}"
            } >> "${GITHUB_OUTPUT}"
            echo "Healing ${kind} alert #${number} (explicitly requested)."
            exit 0
          fi

          if [ "${kind}" = "dependabot" ]; then
            endpoint="repos/${REPO}/dependabot/alerts?state=open&per_page=100"
          else
            # F14: a code-scanning alert's most_recent_instance tracks
            # whichever ref last produced it, and codeql.yml runs on
            # pull_request -- so a fork PR's own analysis can raise an
            # "open" alert too. Restrict the listing to the default
            # branch's own analysis, not just "open".
            default_branch="$(gh api "repos/${REPO}" --jq '.default_branch')"
            target_ref="refs/heads/${default_branch}"
            endpoint="repos/${REPO}/code-scanning/alerts?state=open&ref=${target_ref}&per_page=100"
          fi

          if ! gh api "${endpoint}" > alerts.json 2>alerts.err; then
            echo "::notice title=Could not read alerts::$(head -c 400 alerts.err). Set the SELF_HEAL_TOKEN secret (a token with security_events read) if this is a permissions problem."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Skip alerts that already have an open self-heal branch -- scoped
          # to THIS repository's own refs, never a fork's. (F14: `gh pr list`
          # enumerates ALL open PRs including forks, and the attacker
          # controls their own head-branch name, so squatting
          # self-heal/<kind>-<n>-* names made every alert look
          # already-handled and the run report "Nothing to heal" -- green.
          # git/matching-refs is rooted at ${REPO} itself: a fork's branch
          # lives in the fork's own ref namespace and can never appear here,
          # so this sidesteps the fork question rather than filtering for
          # it, and it only needs contents:read, which this job already has
          # -- unlike gh pr list, which reads pull-requests.)
          if ! gh api "repos/${REPO}/git/matching-refs/heads/self-heal/?per_page=100" \
              --jq '.[].ref' > self-heal-branches.txt 2>/dev/null; then
            : > self-heal-branches.txt
          fi

          if [ "${kind}" = "code-scanning" ]; then
            # Defense in depth: do not rely on the endpoint's ref= filter
            # alone -- re-check the field directly so an alert whose most
            # recent instance is off the default branch can never be picked.
            candidate_numbers="$(jq -r --arg ref "${target_ref}" \
              '.[] | select(.most_recent_instance.ref == $ref) | .number' alerts.json)"
          else
            candidate_numbers="$(jq -r '.[].number' alerts.json)"
          fi

          number="$(printf '%s\n' "${candidate_numbers}" | while read -r n; do
            [ -n "${n}" ] || continue
            if ! grep -q "self-heal/${kind}-${n}-" self-heal-branches.txt; then
              echo "${n}"
              break
            fi
          done)"

          if [ -z "${number}" ]; then
            echo "::notice title=Nothing to heal::No open ${kind} alert without an existing self-heal PR."
            {
              echo "## self-heal: nothing to do"
              echo
              echo "No open ${kind} alert is waiting for a patch."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "found=true"
            echo "kind=${kind}"
            echo "number=${number}"
          } >> "${GITHUB_OUTPUT}"
          echo "Healing ${kind} alert #${number}."

  autofix:
    name: Copilot Autofix -> patch PR (code scanning)
    needs: select
    if: ${{ needs.select.outputs.found == 'true' && needs.select.outputs.kind == 'code-scanning' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    outputs:
      # The two pointers verification/layer-10-audit.ps1 needs for V10.1. Without
      # them the criterion records "no CodeQL alert number supplied" as a FINAL
      # failure — it will not go looking for a healing trail it was not told
      # about, and it should not have to.
      alert: ${{ needs.select.outputs.number }}
      pr: ${{ steps.pr-number.outputs.number }}
    steps:
      # Nothing here builds the repo — the checkout exists so `gh pr create`,
      # `gh pr merge` and friends have a git remote to resolve the repository
      # from. The patch itself is committed by GitHub through the autofix API,
      # never from this working tree.
      - uses: actions/checkout@v7

      - name: Assert the alert's most recent instance is on the default branch
        id: ref-check
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.select.outputs.number }}
        run: |
          set -euo pipefail
          # F14, second defense layer: the `select` job's listing already
          # filters to the default branch, but an alert number can also
          # arrive here via workflow_dispatch/repository_dispatch, which
          # bypasses that listing (and its ref filter) entirely. Re-check
          # directly so a fork PR's own CodeQL analysis (codeql.yml runs on
          # pull_request) can never drive the autofix machinery, however the
          # number was selected.
          default_branch="$(gh api "repos/${REPO}" --jq '.default_branch')"
          target_ref="refs/heads/${default_branch}"
          actual_ref="$(gh api "repos/${REPO}/code-scanning/alerts/${NUMBER}" --jq '.most_recent_instance.ref // ""')"
          if [ "${actual_ref}" != "${target_ref}" ]; then
            echo "::error title=Alert not on the default branch::Code scanning alert #${NUMBER}'s most recent instance is on '${actual_ref:-unknown}', not '${target_ref}'. Refusing to run Autofix against it (F14) -- this is very likely a fork PR's own analysis, not a finding on the default branch."
            exit 1
          fi

      - name: Request a fix from Copilot Autofix
        id: request
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.select.outputs.number }}
        run: |
          set -euo pipefail
          # Autofix generates automatically for CodeQL alerts raised ON A PULL
          # REQUEST. This alert is on the default branch, so the suggestion has
          # to be asked for. 202 = generating, 200 = one already exists.
          if ! gh api --method POST \
              "repos/${REPO}/code-scanning/alerts/${NUMBER}/autofix" \
              > autofix-request.json 2>autofix-request.err; then
            echo "::notice title=Autofix could not be requested::$(head -c 400 autofix-request.err) — Copilot Autofix needs code scanning enabled on this repository, and the calling token needs security_events write. GitHub does not document whether the default GITHUB_TOKEN qualifies, so set SELF_HEAL_TOKEN if this is a 403."
            echo "requested=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "requested=true" >> "${GITHUB_OUTPUT}"

      - name: Wait for the suggestion
        id: wait
        if: ${{ steps.request.outputs.requested == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.select.outputs.number }}
        run: |
          set -euo pipefail
          # Documented statuses: pending | error | success | outdated.
          # Budget: 15 s intervals, 5 minutes total. `outdated` means the
          # suggestion no longer matches the code, so ask for it again — once,
          # then keep waiting inside the same budget.
          status="pending"
          regenerated="false"

          for _ in $(seq 1 20); do
            if ! gh api "repos/${REPO}/code-scanning/alerts/${NUMBER}/autofix" \
                > autofix.json 2>/dev/null; then
              status="unreadable"
              break
            fi
            status="$(jq -r '.status // "unknown"' autofix.json)"

            if [ "${status}" = "outdated" ] && [ "${regenerated}" = "false" ]; then
              echo "::notice title=Autofix outdated::The stored suggestion no longer matches the code; requesting a fresh one."
              regenerated="true"
              gh api --method POST \
                "repos/${REPO}/code-scanning/alerts/${NUMBER}/autofix" >/dev/null 2>&1 || true
              status="pending"
            fi

            [ "${status}" = "pending" ] || break
            sleep 15
          done

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          if [ "${status}" != "success" ]; then
            echo "::notice title=No autofix suggestion::Copilot Autofix returned status '${status}' for code scanning alert #${NUMBER}. This is an expected outcome, not a workflow failure: Autofix covers a subset of the CodeQL default and security-extended query suites, and GitHub documents it as non-deterministic and capable of producing incomplete fixes. This alert needs a human."
            exit 0
          fi
          jq -r '.description // ""' autofix.json > autofix-description.md

      - name: Create the branch the autofix commit needs
        id: branch
        if: ${{ steps.wait.outputs.status == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.select.outputs.number }}
        run: |
          set -euo pipefail
          # POST .../autofix/commits requires an existing branch: "Branch needs
          # to already exist." Nothing creates it for us.
          base="$(gh api "repos/${REPO}" --jq '.default_branch')"
          base_sha="$(gh api "repos/${REPO}/git/ref/heads/${base}" --jq '.object.sha')"
          branch="self-heal/code-scanning-${NUMBER}-autofix"

          if gh api "repos/${REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            echo "::notice title=Branch already exists::${branch} is already present; reusing it."
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f "ref=refs/heads/${branch}" \
              -f "sha=${base_sha}" > /dev/null
          fi

          {
            echo "base=${base}"
            echo "branch=${branch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Commit the generated fix onto the branch
        id: commit
        if: ${{ steps.branch.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.select.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          message="fix(security): apply Copilot Autofix for code scanning alert #${NUMBER}"
          if ! gh api --method POST \
              "repos/${REPO}/code-scanning/alerts/${NUMBER}/autofix/commits" \
              -f "target_ref=refs/heads/${BRANCH}" \
              -f "message=${message}" \
              > autofix-commit.json 2>autofix-commit.err; then
            echo "::notice title=Autofix commit refused::$(head -c 400 autofix-commit.err) — this endpoint needs write access to repository contents as well as code scanning alerts."
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          sha="$(jq -r '.sha // ""' autofix-commit.json)"
          echo "committed=true" >> "${GITHUB_OUTPUT}"
          echo "Committed ${sha} to ${BRANCH}."

      - name: Open the patch PR
        id: pr
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          AUTHORED_BY_PAT: ${{ secrets.SELF_HEAL_TOKEN != '' }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.select.outputs.number }}
          BASE: ${{ steps.branch.outputs.base }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/code-scanning/alerts/${NUMBER}" > alert.json
          rule="$(jq -r '.rule.id // "unknown"' alert.json)"
          severity="$(jq -r '.rule.security_severity_level // .rule.severity // "unknown"' alert.json)"
          summary="$(jq -r '.rule.description // ""' alert.json)"

          {
            echo "## self-heal: Copilot Autofix"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Alert | [#${NUMBER}](https://github.com/${REPO}/security/code-scanning/${NUMBER}) |"
            echo "| Rule | \`${rule}\` |"
            echo "| Severity | ${severity} |"
            echo
            echo "${summary}"
            echo
            echo "### What generated this diff"
            echo
            echo "GitHub Copilot Autofix produced the change on this branch. It was"
            echo "requested through \`POST /code-scanning/alerts/${NUMBER}/autofix\` and"
            echo "committed through \`.../autofix/commits\` — Autofix generates the patch,"
            echo "this workflow only moves it onto a branch and opens this PR."
            echo
            if [ -s autofix-description.md ]; then
              cat autofix-description.md
              echo
            fi
            echo "### What happens next"
            echo
            echo "This PR runs the same gauntlet as any other change — lint-ci, both test"
            echo "suites, CodeQL, gitleaks, the Trivy CRITICAL gate and ZAP — and merges"
            echo "itself only if all of it is green. Review it like any other patch: an"
            echo "Autofix suggestion is a suggestion, and the gauntlet is what decides."
          } > pr-body.md

          url="$(gh pr create \
            --base "${BASE}" \
            --head "${BRANCH}" \
            --title "fix(security): Copilot Autofix for ${rule} (alert #${NUMBER})" \
            --body-file pr-body.md \
            --label security \
            --label self-heal)"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Opened ${url}"

          if [ "${AUTHORED_BY_PAT}" != "true" ]; then
            echo "::warning title=Checks will need manual approval::This PR was authored with the default GITHUB_TOKEN, so its pull_request workflow runs start in an approval-required state and auto-merge cannot fire until someone clicks 'Approve workflows to run'. Set the SELF_HEAL_TOKEN secret to close the loop without a human in it."
          fi

      # `gh pr create` prints a URL; the audit wants the number. Extracted here so
      # the job output is the pointer V10.1 actually takes.
      - name: Extract the heal PR number for the Verifier
        id: pr-number
        if: ${{ steps.pr.outputs.url != '' }}
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          number="${PR_URL##*/}"
          case "${number}" in
            ''|*[!0-9]*)
              echo "::warning title=Could not read the heal PR number::'${PR_URL}' does not end in a pull request number, so verification/layer-10-audit.ps1 will report that no Autofix PR was supplied."
              number=""
              ;;
          esac
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: Enable auto-merge (see the header for why this is intentional)
        if: ${{ steps.pr.outputs.url != '' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          # --auto merges ONLY once every required check is green. If the gauntlet
          # rejects the heal, the PR simply sits there — which is the honest
          # outcome, not a failure of this workflow.
          if gh pr merge "${PR_URL}" --auto --squash --delete-branch; then
            echo "Auto-merge armed."
          else
            echo "::warning title=Auto-merge not armed::Enable 'Allow auto-merge' in repository settings, make sure main carries a branch protection rule with at least one requirement, and make sure its required checks match the gauntlet's job names exactly (L10 failure mode 2)."
          fi

      - name: Summary
        if: ${{ always() }}
        env:
          NUMBER: ${{ needs.select.outputs.number }}
          STATUS: ${{ steps.wait.outputs.status }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "## self-heal — code scanning alert #${NUMBER}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Fix generated by | GitHub Copilot Autofix |"
            echo "| Autofix status | ${STATUS:-not requested} |"
            echo "| Pull request | ${PR_URL:-none opened} |"
            echo
            echo "Autofix produces a suggested diff and nothing else — no branch, no"
            echo "commit, no PR. Everything after the diff on this run was orchestrated"
            echo "by this workflow."
          } >> "${GITHUB_STEP_SUMMARY}"

  dependency:
    name: Dependabot security update -> gauntlet
    needs: select
    if: ${{ needs.select.outputs.found == 'true' && needs.select.outputs.kind == 'dependabot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: read
    steps:
      - name: Read the alert
        id: alert
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.select.outputs.number }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${REPO}/dependabot/alerts/${NUMBER}" > alert.json 2>alert.err; then
            echo "::notice title=Could not read the alert::$(head -c 400 alert.err)"
            echo "package=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "package=$(jq -r '.dependency.package.name // ""' alert.json)"
            echo "ghsa=$(jq -r '.security_advisory.ghsa_id // ""' alert.json)"
            echo "severity=$(jq -r '.security_advisory.severity // "unknown"' alert.json)"
            echo "patched=$(jq -r '.security_vulnerability.first_patched_version.identifier // ""' alert.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Find Dependabot's security-update PR for this package
        id: find
        if: ${{ steps.alert.outputs.package != '' }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PACKAGE: ${{ steps.alert.outputs.package }}
        run: |
          set -euo pipefail
          # Autofix has no dependency-alert equivalent and there is no API to ask
          # for a security-update PR, so Dependabot's own PR *is* the generated
          # fix for this path. All this job does is put it through the gauntlet.
          gh pr list --repo "${REPO}" --state open --author 'app/dependabot' \
            --json number,url,headRefName,title > dependabot-prs.json

          url="$(jq -r --arg pkg "${PACKAGE}" \
            'map(select(.headRefName | contains($pkg))) | .[0].url // ""' \
            dependabot-prs.json)"

          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          if [ -z "${url}" ]; then
            echo "::notice title=No Dependabot PR to gauntlet::No open Dependabot pull request mentions '${PACKAGE}'. Copilot Autofix does not cover dependency alerts, and no API can request a security-update PR — so this path needs 'Dependabot security updates' switched ON in repository settings. Until then this alert has no automated fix path."
          else
            echo "Found ${url}"
          fi

      - name: Explain the chain on the Dependabot PR
        if: ${{ steps.find.outputs.url != '' }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.find.outputs.url }}
          NUMBER: ${{ needs.select.outputs.number }}
          GHSA: ${{ steps.alert.outputs.ghsa }}
          SEVERITY: ${{ steps.alert.outputs.severity }}
          PATCHED: ${{ steps.alert.outputs.patched }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## self-heal: adopted for the gauntlet"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Dependabot alert | [#${NUMBER}](https://github.com/${REPO}/security/dependabot/${NUMBER}) |"
            echo "| Advisory | ${GHSA:-unknown} (${SEVERITY}) |"
            echo "| First patched version | ${PATCHED:-unknown} |"
            echo
            echo "Copilot Autofix does not generate fixes for dependency alerts — its"
            echo "suggested-diff feature is a code-scanning feature, and there is no"
            echo "autofix endpoint under \`/dependabot/alerts\`. Dependabot's own security"
            echo "update is therefore the generated fix on this path, and \`self-heal.yml\`"
            echo "has armed auto-merge so it clears exactly the same gauntlet as a"
            echo "Copilot Autofix PR: lint-ci, both test suites, CodeQL, gitleaks, the"
            echo "Trivy CRITICAL gate and ZAP."
            echo
            echo "Note that workflow runs on a Dependabot pull request get a read-only"
            echo "\`GITHUB_TOKEN\` and no repository secrets, so any gauntlet leg that needs"
            echo "a secret will skip on this PR rather than pass."
          } > adopt.md
          gh pr comment "${PR_URL}" --body-file adopt.md

      - name: Enable auto-merge on the Dependabot PR
        if: ${{ steps.find.outputs.url != '' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.find.outputs.url }}
        run: |
          set -euo pipefail
          if gh pr merge "${PR_URL}" --auto --squash; then
            echo "Auto-merge armed."
          else
            echo "::warning title=Auto-merge not armed::Enable 'Allow auto-merge' in repository settings, make sure main carries a branch protection rule with at least one requirement, and make sure its required checks match the gauntlet's job names exactly (L10 failure mode 2)."
          fi

      - name: Summary
        if: ${{ always() }}
        env:
          NUMBER: ${{ needs.select.outputs.number }}
          PACKAGE: ${{ steps.alert.outputs.package }}
          PATCHED: ${{ steps.alert.outputs.patched }}
          PR_URL: ${{ steps.find.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "## self-heal — Dependabot alert #${NUMBER}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`${PACKAGE:-unknown}\` |"
            echo "| First patched version | ${PATCHED:-unknown} |"
            echo "| Fix generated by | Dependabot security updates (Copilot Autofix does not cover dependency alerts) |"
            echo "| Pull request | ${PR_URL:-none found} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # L10 VERIFICATION — the showpiece-#3 audit, run as mls-verifier.
  #
  # Both criteria have a 24-hour window and are evaluated ONCE (the audit passes
  # -InProcessWaitMinutes 0), so running this immediately after the run that
  # opened the PR is correct: it records PENDING with the deadline, and the same
  # workflow re-dispatched later closes it. That only works if it is told when the
  # window opened — hence MLS_L10_RESEED_MERGED_AT, which apps/vuln-lab/reseed.ps1
  # cannot know (the clock starts when the re-seed PR MERGES, which is after the
  # script has finished). It is therefore a demo variable set once per demo cycle.
  #
  # V10.2 reads Dependabot alerts, which the default GITHUB_TOKEN is refused on;
  # that is what SELF_HEAL_TOKEN / MLS_VERIFIER_GH_TOKEN exist for, and the audit
  # reports the 403 as an unverifiable trail rather than as a passing one.
  # ---------------------------------------------------------------------------
  verify:
    name: verify L10 (mls-verifier)
    needs: [select, autofix, dependency]
    if: >-
      ${{ always()
          && needs.select.outputs.found == 'true'
          && vars.AZURE_VERIFIER_CLIENT_ID != ''
          && !contains(fromJSON('["cancelled"]'), needs.autofix.result)
          && !contains(fromJSON('["cancelled"]'), needs.dependency.result) }}
    runs-on: ubuntu-latest
    environment: verify
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    env:
      MLS_REPOSITORY: ${{ github.repository }}
      MLS_VERIFIER_GH_TOKEN: ${{ secrets.MLS_VERIFIER_GH_TOKEN || secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.MLS_VERIFIER_GH_TOKEN || secrets.SELF_HEAL_TOKEN || secrets.GITHUB_TOKEN }}
      # `pwsh -File` cannot bind a string[] parameter — a comma-joined value
      # arrives as ONE element and a space-separated one silently drops the tail —
      # so the alert LIST goes through its environment variable, which the audit
      # splits on [,;\s]+. The demo variable carries all three seeded pins; the
      # alert this run happened to pick is appended so a fresh alert is covered
      # before anyone updates the variable.
      MLS_L10_DEPENDABOT_ALERTS: >-
        ${{ vars.MLS_L10_DEPENDABOT_ALERTS }}
        ${{ needs.select.outputs.kind == 'dependabot' && needs.select.outputs.number || '' }}
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-verifier — Reader only)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Note the missing re-seed timestamp
        if: ${{ vars.MLS_L10_RESEED_MERGED_AT == '' }}
        run: |
          set -euo pipefail
          echo "::warning title=No re-seed merge timestamp::MLS_L10_RESEED_MERGED_AT is not set on the demo environment, so the 24-hour chain deadline cannot be computed and an incomplete healing trail is recorded FAIL rather than PENDING. Set it to the UTC time the apps/vuln-lab/reseed.ps1 PR merged: gh variable set MLS_L10_RESEED_MERGED_AT --env demo --body \$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run verification/layer-10-audit.ps1
        id: audit
        uses: ./.github/actions/layer-audit
        with:
          layer: '10'
          # This job's timeout-minutes is 45, not the usual 60, so the audit gets a
          # smaller retry budget and still leaves room to write its report (F58).
          run-budget-minutes: '30'
          args: |
            -Repository
            ${{ github.repository }}
            -ResourceGroupName
            ${{ steps.names.outputs.rg-apps }}
            -VulnLabAppName
            ${{ steps.names.outputs.ca-vuln-lab }}
            ${{ needs.autofix.outputs.alert && '-CodeQlAlertNumber' || '' }}
            ${{ needs.autofix.outputs.alert }}
            ${{ needs.autofix.outputs.pr && '-AutofixPrNumber' || '' }}
            ${{ needs.autofix.outputs.pr }}
            ${{ vars.MLS_L10_RESEED_MERGED_AT && '-ReseedMergedUtc' || '' }}
            ${{ vars.MLS_L10_RESEED_MERGED_AT }}

      - name: Upload audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-10-audit-report
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30
