name: layer-02-landing-zone

# =============================================================================
# L2 — Landing zone: management group, governance policies, NIST 800-53 R5.
# Playbook: docs/runbooks/layers/L02.md   Templates: infra/bicep/landing-zone/
#
# Callable (workflow_call) from infra-up.yml and dispatchable on its own.
# Every Azure-facing job is gated on the `demo` GitHub environment already
# carrying the G0 identity variables — see .github/actions/demo-env-guard.
# Nothing here runs, and nothing fails, before G0.
#
# Teardown of this layer is G3 (tenant-level): infra/policy/teardown.ps1.
# The standard kill/rebuild cycle deliberately leaves L2 in place.
#
# F9 (compliance/findings/2026-08-26-prepublication-review.md#f9, Task 13)
# named this file for the subscription Activity Log diagnostic setting. It is
# NOT here: the setting's destination (the Log Analytics workspace) does not
# exist until L6 runs. On a FULL run, L6 always runs after this layer
# (layer-06 needs: [..., layer-04], which needs [..., layer-02]), and teardown
# deletes the LAW's resource group every cycle, so a full pass never reaches
# this point with the LAW already present. (infra-up.yml also supports a
# skip-tolerant selective replay — e.g. `layers: l6` alone, skipping this
# layer entirely — so that is a same-pass invariant, not a universal one; it
# is still sufficient for why this step doesn't belong here.) The Activity Log
# wiring lives in layer-06-platform.yml's deploy job instead, immediately
# after the LAW becomes a real deployed resource. See task-13-report.md for
# the full reasoning this moved the work rather than faking a step here.
# =============================================================================

on:
  workflow_call:
    inputs:
      location:
        description: >-
          Azure region. EMPTY MEANS "use vars.AZURE_LOCATION from the demo environment",
          which is the single source of truth; pass a value only to override it (F53).
        type: string
        required: false
        default: ''
      dry_run:
        description: Run `az deployment mg what-if` only; make no writes.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      location:
        description: >-
          Azure region. EMPTY MEANS "use vars.AZURE_LOCATION from the demo environment",
          which is the single source of truth; pass a value only to override it (F53).
        type: string
        required: false
        default: ''
      dry_run:
        description: Run `az deployment mg what-if` only; make no writes.
        type: boolean
        required: false
        default: false

      only_criterion:
        description: >-
          Verify only these criteria, e.g. `V2.2` or `V2.1,V2.3`. Everything else
          reports SKIP and the audit exits 3 - a DIAGNOSTIC, never a sign-off. Re-testing
          one criterion should not cost a whole audit's wall clock (P-10). Leave empty for
          a verdict.
        type: string
        required: false
        default: ''
permissions:
  contents: read

jobs:
  preflight:
    name: preflight (demo environment guard)
    runs-on: ubuntu-latest
    # Bounded: reads repository variables and nothing else. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 10
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      verifier: ${{ steps.verifier.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L2 landing zone
      - id: verifier
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L2 verification (mls-verifier)

  deploy:
    name: deploy L2 landing zone
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    env:
      # vars.AZURE_LOCATION is the single source of truth for the estate's region.
      # It is resolved HERE, not in infra-up.yml, because a reusable-workflow caller
      # job cannot declare `environment:` and therefore cannot see an environment
      # variable at all - which is why every layer used to carry `default: eastus`
      # instead. An explicit `location` input still overrides, for a one-off (F53).
      AZURE_LOCATION: ${{ inputs.location || vars.AZURE_LOCATION }}
      # Where the policy assignments' managed identities live. Normally EMPTY, meaning
      # "same as AZURE_LOCATION" - correct for a fresh estate. It is set only on an estate
      # whose region changed after L2 first ran, because an assignment's location cannot be
      # updated and the identities are already registered in Entra with the old one. Not a
      # second source of truth for the estate's region: a different value, about a different
      # thing (F55).
      MLS_POLICY_ASSIGNMENT_LOCATION: ${{ vars.POLICY_ASSIGNMENT_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure management group and subscription placement
        env:
          MG_NAME: ${{ steps.names.outputs.management-group }}
        run: |
          set -euo pipefail
          # Idempotent: create-if-absent, then (re)place the demo subscription.
          if az account management-group show --name "${MG_NAME}" >/dev/null 2>&1; then
            echo "Management group ${MG_NAME} already exists."
          else
            az account management-group create --name "${MG_NAME}" --display-name 'Meridian Launch Systems'
          fi
          az account management-group subscription add \
            --name "${MG_NAME}" \
            --subscription "${AZURE_SUBSCRIPTION_ID}" 2>/dev/null \
            || echo "Subscription already placed under ${MG_NAME}."

      - name: Clear management-group deployment records pinned to another region
        env:
          MG_NAME: ${{ steps.names.outputs.management-group }}
        run: |
          set -euo pipefail
          # A management-group-scope deployment's LOCATION IS IMMUTABLE. Redeploying the
          # same deployment name into a different region fails with
          #   InvalidDeploymentLocation: the deployment 'X' already exists in location 'Y'
          # and the template's module names are stable by design (they have to be, for
          # idempotent replay), so every one of them collides at once - ten Conflicts in a
          # single MultipleErrorsOccurred.
          #
          # Deleting a deployment RECORD deletes history, never resources: the policy
          # assignments those deployments created are untouched and are re-converged by the
          # deploy step below. So this is safe to run unconditionally, and it only ever
          # matches records whose location differs from the region now being deployed.
          #
          # This matters beyond one estate: F52 established that Azure SQL cannot provision
          # in several regions on a trial subscription, so changing AZURE_LOCATION is a
          # thing adopters will have to do, and without this L2 is permanently wedged
          # afterwards (F54).
          # ONE AT A TIME, WITH RETRIES, AND BOTH SCOPES.
          #
          # `az deployment ... delete` is asynchronous: a second delete issued while the
          # first is still settling returns "Operation returned an invalid status 'Bad
          # Request'". A plain loop therefore removes only the LAST record and reports
          # nothing wrong - and a `|| true` would leave the rest behind silently for the
          # next deploy to fail on.
          #
          # Both scopes matter. The template deploys at the management group, but the AVM
          # policy-assignment module fans out to SUBSCRIPTION scope for the NIST assignment
          # (`pol-asi-sub-*`), and L6's own records live there too. Clearing only the MG
          # records left exactly one conflict behind and cost a full deploy to find.
          drain() {
            scope="$1"; listCmd="$2"; delCmd="$3"; attempt=0
            while [ "${attempt}" -lt 25 ]; do
              remaining=$(eval "${listCmd}" 2>/dev/null || true)
              [ -z "${remaining}" ] && break
              name=$(echo "${remaining}" | head -n 1)
              echo "::notice title=Clearing stale deployment record::${name} (${scope}) was created in another region; deleting the RECORD - no resources are affected."
              eval "${delCmd} '${name}'" >/dev/null 2>&1 || true
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ -n "$(eval "${listCmd}" 2>/dev/null || true)" ]; then
              echo "::error title=Stale deployment records remain::Could not clear every ${scope} record pinned to another region; the deploy below would fail on them."
              return 1
            fi
            echo "No ${scope} deployment records pinned to another region."
          }

          drain 'management group' \
            "az deployment mg list --management-group-id '${MG_NAME}' --query \"[?location!='${AZURE_LOCATION}'].name\" -o tsv" \
            "az deployment mg delete --management-group-id '${MG_NAME}' --name"

          drain 'subscription' \
            "az deployment sub list --subscription '${AZURE_SUBSCRIPTION_ID}' --query \"[?location!='${AZURE_LOCATION}'].name\" -o tsv" \
            "az deployment sub delete --subscription '${AZURE_SUBSCRIPTION_ID}' --name"

      - name: Grant the Verifier read access to the management group
        env:
          MG_NAME: ${{ steps.names.outputs.management-group }}
          VERIFIER_CLIENT_ID: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
        run: |
          set -euo pipefail
          # THE VERIFIER COULD NOT SEE THE LAYER IT SIGNS OFF. mls-verifier is Reader at
          # SUBSCRIPTION scope; a management group is not in that scope, and nothing ever
          # granted it anything there. So every V2.x criterion that reads MG state threw
          # AuthorizationFailed - and L2, the layer whose whole output lives at the
          # management group, could never be verified at all (F57).
          #
          # Granted here rather than in 01-root-oidc.ps1 because the human running that
          # script has no authority at this management group either: the deployer created it
          # and is its only Owner, so the deployer is the only principal that can delegate.
          #
          # Reader, not Contributor: the Verifier's independence is that it can only look
          # (CLAUDE.md hard rule 1). This grant widens what it can look AT, never what it can
          # do.
          if [ -z "${VERIFIER_CLIENT_ID}" ]; then
            echo "::notice title=Verifier not configured::AZURE_VERIFIER_CLIENT_ID is unset; skipping the management-group read grant."
            exit 0
          fi
          objectId=$(az ad sp show --id "${VERIFIER_CLIENT_ID}" --query id -o tsv)
          scope="/providers/Microsoft.Management/managementGroups/${MG_NAME}"
          if az role assignment list --scope "${scope}" --assignee "${objectId}"                --query "[?roleDefinitionName=='Reader'] | length(@)" -o tsv | grep -qv '^0$'; then
            echo "Verifier already holds Reader on ${MG_NAME}."
          else
            az role assignment create --assignee-object-id "${objectId}"               --assignee-principal-type ServicePrincipal               --role Reader --scope "${scope}"
            echo "::notice title=Verifier granted Reader::mls-verifier can now read ${MG_NAME}, which V2.x requires."
          fi

      - name: Grant the human sponsor read access to the management group
        env:
          MG_NAME: ${{ steps.names.outputs.management-group }}
          SPONSOR_OBJECT_ID: ${{ vars.MLS_SPONSOR_OBJECT_ID }}
        run: |
          set -euo pipefail
          # THE PERSON WHO OWNS THE SUBSCRIPTION CANNOT SEE THE MANAGEMENT GROUP.
          #
          # An agent created `mls` and, by creating it, became its only Owner. Nothing
          # grants the human anything there - not the subscription's Owner role, which
          # stops at the subscription, and not the G0 bootstrap, which runs before the
          # group exists. So the sponsor cannot list the assignments deployed into their
          # own estate, cannot audit what the deployer did, and cannot perform the G3
          # deletions that CLAUDE.md reserves for a human (F55, and the half of it F57
          # left open by fixing only the Verifier).
          #
          # That is not a missing convenience. An estate whose owner can only watch an
          # agent operate it is demonstrating the opposite of what this repo argues.
          #
          # Reader, deliberately. The sponsor gets sight of everything and authority over
          # nothing, because widening to Owner here would let a workflow hand a principal
          # full control of a tenant object - and the whole point of G3 is that a human
          # decides that, in the portal, on purpose. A sponsor who needs to delete the
          # group elevates through Entra (`Access management for Azure resources`) as a
          # deliberate, logged act.
          #
          # Optional by design: an unset variable skips the grant with a notice, so a
          # stranger cloning this repo is never blocked by an object id that means
          # nothing in their tenant. Set it to YOUR object id:
          #   az ad signed-in-user show --query id -o tsv
          #   gh variable set MLS_SPONSOR_OBJECT_ID --env demo --body "<that id>"
          if [ -z "${SPONSOR_OBJECT_ID}" ]; then
            echo "::notice title=Sponsor read access not configured::MLS_SPONSOR_OBJECT_ID is unset on the demo environment, so no human was granted read access to ${MG_NAME}. The deployer remains its only principal. See docs/runbooks/layers/L02.md."
            exit 0
          fi
          scope="/providers/Microsoft.Management/managementGroups/${MG_NAME}"
          if az role assignment list --scope "${scope}" --assignee "${SPONSOR_OBJECT_ID}"                --query "[?roleDefinitionName=='Reader'] | length(@)" -o tsv | grep -qv '^0$'; then
            echo "Sponsor already holds Reader on ${MG_NAME}."
          else
            az role assignment create --assignee-object-id "${SPONSOR_OBJECT_ID}"               --assignee-principal-type User --role Reader --scope "${scope}"
            echo "::notice title=Sponsor granted Reader::The human sponsor can now read ${MG_NAME} and everything L2 deploys into it."
          fi

      - name: Clear the modify-policy Tag Contributor grants so the deploy can recreate them
        env:
          MG_NAME: ${{ steps.names.outputs.management-group }}
        run: |
          set -euo pipefail
          # L2 IS NOT IDEMPOTENT WITHOUT THIS, and that is an AVM defect, not a config one.
          #
          # avm/ptn/authorization/policy-assignment:0.5.3 (the newest published version)
          # generates a NEW GUID for the Tag Contributor grant on every run. Azure keys a
          # role assignment on (scope, principal, role), so the second run is refused:
          #
          #   RoleAssignmentExists: The role assignment already exists. The ID of the
          #   existing role assignment is 346a8f81ef665af79185bcdf4b4be449
          #
          # - and that ID is the grant the PREVIOUS run made, for a live, correctly-named
          # identity. So the layer deploys once and fails on every replay, which is exactly
          # what a kill/rebuild estate cannot afford. Pinning our own deterministic name
          # would not help: the conflict is the triple, not the name.
          #
          # Deleting first is therefore the only convergent order. Scope is narrow by
          # construction - Tag Contributor at this management group is granted by nothing
          # except the six inherit-* modify policies below, and the deploy in the next step
          # recreates all six. The gap is seconds, and policy remediation does not run
          # during a deploy.
          ids=$(az role assignment list --scope "/providers/Microsoft.Management/managementGroups/${MG_NAME}"             --query "[?roleDefinitionName=='Tag Contributor'].id" -o tsv 2>/dev/null || true)
          if [ -z "${ids}" ]; then
            echo "No Tag Contributor grants to clear."
          else
            echo "${ids}" | while read -r id; do
              [ -z "${id}" ] && continue
              echo "::notice title=Clearing modify-policy grant::${id##*/} - recreated by the deploy in this same run."
              az role assignment delete --ids "${id}" || true
            done
          fi
          remaining=$(az role assignment list --scope "/providers/Microsoft.Management/managementGroups/${MG_NAME}"             --query "length([?roleDefinitionName=='Tag Contributor'])" -o tsv 2>/dev/null || echo 0)
          if [ "${remaining}" != "0" ]; then
            echo "::error title=Tag Contributor grants remain::${remaining} left; the deploy below would fail with RoleAssignmentExists."
            exit 1
          fi

      - name: Resolve every built-in policy definition the template pins
        run: |
          set -euo pipefail
          # WHAT-IF DOES NOT RESOLVE POLICY DEFINITION IDS. main.bicep pins seven built-in
          # GUIDs; one of them was fabricated - the right shape, the right first four
          # segments, a made-up last one - and three green `az deployment mg what-if` runs
          # passed it before the first real deploy failed two minutes in, inside four
          # levels of nested ARM error. This resolves each one first, in seconds, and names
          # the offender (F52).
          fail=0
          check() {
            if ! az policy definition show --name "$1" --query id -o tsv >/dev/null 2>&1; then
              echo "::error title=Policy definition not found::$1 ($2) does not resolve. main.bicep pins it; Azure does not have it."
              fail=1
            fi
          }
          check 96670d01-0a4d-4649-9c89-2d3abc0a5025 'Require a tag on resource groups'
          check 8ce3da23-7156-49e4-b145-24f95f9dcb46 'Require a tag and its value on resource groups'
          check ea3f2387-9b95-492a-a190-fcdc54f7b070 'Inherit a tag from the resource group if missing'
          check e56962a6-4747-49cd-b67b-bf8b01975c4c 'Allowed locations'
          check e765b5de-1225-4ba3-bd56-1ac6695af988 'Allowed locations for resource groups'
          if ! az policy set-definition show --name 179d1daa-458f-4e47-8086-2a68d0d6c38f --query id -o tsv >/dev/null 2>&1; then
            echo "::error title=Initiative not found::179d1daa-458f-4e47-8086-2a68d0d6c38f (NIST SP 800-53 Rev. 5) does not resolve."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "All seven built-in definitions resolve."
          exit "$fail"

      - name: What-if the landing zone
        env:
          MG_NAME: ${{ steps.names.outputs.management-group }}
        run: |
          set -euo pipefail
          # Targets MG <prefix>, never the tenant root. The step above already made
          # the only two root-scope writes L2 needs (create the MG, place the sub),
          # and Azure makes an MG's creator its Owner -- so the deployer owns this
          # scope and needs no tenant-root RBAC at all. See F47.
          az deployment mg what-if \
            --management-group-id "${MG_NAME}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/bicep/landing-zone/main.bicep \
            --parameters infra/bicep/landing-zone/demo.bicepparam \
            --name "l2-landing-zone-${GITHUB_RUN_ID}" \
            | tee what-if-l2.txt
          echo "Target management group: ${MG_NAME}"

      - name: Deploy the landing zone
        if: ${{ !inputs.dry_run }}
        env:
          MG_NAME: ${{ steps.names.outputs.management-group }}
        run: |
          set -euo pipefail
          # Deployed AT management group <prefix> (see the what-if step's note), which
          # infra/bicep/landing-zone/main.bicep declares as its own target scope.
          az deployment mg create \
            --management-group-id "${MG_NAME}" \
            --location "${AZURE_LOCATION}" \
            --template-file infra/bicep/landing-zone/main.bicep \
            --parameters infra/bicep/landing-zone/demo.bicepparam \
            --name "l2-landing-zone-${GITHUB_RUN_ID}" \
            --output json > l2-outputs.json
          {
            echo "### L2 deployment outputs"
            echo '```json'
            jq '.properties.outputs // {}' l2-outputs.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Negative canary — untagged RG must be denied by policy
        if: ${{ !inputs.dry_run }}
        env:
          CANARY_RG: ${{ steps.names.outputs.prefix }}-rg-canary-untagged
        run: |
          set -euo pipefail
          # L02 playbook: the write attempt lives with the deployer; the Verifier
          # confirms the denial independently from the Activity Log (V2.2).
          if az group create --name "${CANARY_RG}" --location "${AZURE_LOCATION}" >canary.log 2>&1; then
            echo "::error title=Tag deny policy did not fire::${CANARY_RG} was created without tags. Deleting the canary; L2 has FAILED its negative test."
            az group delete --name "${CANARY_RG}" --yes --no-wait || true
            exit 1
          fi
          if grep -q 'RequestDisallowedByPolicy' canary.log; then
            echo "Tag deny policy fired as expected (RequestDisallowedByPolicy)."
          else
            echo "::error title=Canary failed for the wrong reason::Expected RequestDisallowedByPolicy."
            cat canary.log
            exit 1
          fi

      - name: Upload L2 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-02-landing-zone
          path: |
            what-if-l2.txt
            l2-outputs.json
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify L2 (mls-verifier)
    needs: [preflight, deploy]
    if: ${{ needs.preflight.outputs.configured == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: verify
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      # V2.3 waits out the NIST assignment's 30-minute compliance-scan window, so
      # this job is allowed to be slow; nothing else in the estate waits on it.
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Verifier identity not configured
        if: ${{ needs.preflight.outputs.verifier != 'true' }}
        run: |
          set -euo pipefail
          echo "::notice title=L2 not independently verified::AZURE_VERIFIER_CLIENT_ID is not set on the demo environment, so there is no read-only identity to run verification/layer-02-audit.ps1 as. CLAUDE.md forbids running audits as the deployer SP, so the audit was skipped rather than run under the wrong credential."

      - name: Azure login (OIDC, mls-verifier — Reader only)
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Every value is passed explicitly rather than left to the script's
      # defaults: those defaults hardcode the company prefix (`mls`, `mls-rg-
      # canary-untagged`), and CLAUDE.md puts the prefix in naming.bicep alone.
      # The canary RG name here is character-for-character the one the deploy
      # job's negative test attempted, which is what V2.2 looks for in the
      # Activity Log.
      - name: Run verification/layer-02-audit.ps1
        id: audit
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: ./.github/actions/layer-audit
        with:
          layer: '02'
          args: |
            -SubscriptionId
            ${{ vars.AZURE_SUBSCRIPTION_ID }}
            -ManagementGroupName
            ${{ steps.names.outputs.management-group }}
            -CanaryResourceGroupName
            ${{ steps.names.outputs.prefix }}-rg-canary-untagged

            ${{ inputs.only_criterion && '-OnlyCriterion' || '' }}
            ${{ inputs.only_criterion }}
      - name: Upload audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-02-audit-report
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30
