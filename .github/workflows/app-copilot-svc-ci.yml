name: app-copilot-svc-ci

# =============================================================================
# Path-filtered CI for apps/copilot-svc (L8).
# Playbook: docs/runbooks/layers/L08.md
# build -> test (tool mocks + schema-validation guard) -> mock eval
#       -> container build -> Trivy (fail on CRITICAL) -> GHCR push
#       -> deploy to ACA via OIDC (guarded on the demo environment).
#
# ---------------------------------------------------------------------------
# OPEN ITEM P-7 — the Docker build context is the REPO ROOT. copilot-svc depends
# on the sibling package apps/shared/spec-renderer through a relative `file:`
# specifier, and its Dockerfile copies `apps/shared/spec-renderer/dist` straight
# out of the context. That dist/ is gitignored build output, so the image job
# MUST run `npm run build:renderer` before `docker build` — an app-directory
# context (or a build without that step) cannot work.
#
# OPEN ITEM P-1 — target port. The image serves on 8080 (Node, PORT=8080 in the
# Dockerfile) but infra/bicep/apps/demo.bicepparam still defaults the container
# app's target port to the placeholder 80. Set COPILOT_SVC_PORT=8080 in the
# `demo` GitHub environment once the first real image publishes.
# ---------------------------------------------------------------------------
#
# ANTHROPIC_API_KEY never appears here: the service resolves it at runtime from
# the L6 Key Vault reference, and with no key present it runs in mock mode.
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - apps/copilot-svc/**
      - apps/shared/**
      - package.json
      - package-lock.json
      - .github/workflows/app-copilot-svc-ci.yml
  pull_request:
    branches: [main]
    paths:
      - apps/copilot-svc/**
      - apps/shared/**
      - package.json
      - package-lock.json
      - .github/workflows/app-copilot-svc-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-copilot-svc-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/copilot-svc
  APP_SLUG: copilot-svc
  WORKSPACE: apps/copilot-svc

jobs:
  preflight:
    name: preflight (demo environment guard)
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: copilot-svc deploy

  build-test:
    name: build, test and mock eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build @mls/spec-renderer (output contract, spec.schema.json)
        run: npm run build:renderer

      - name: Typecheck and build copilot-svc
        run: |
          set -euo pipefail
          npm run typecheck --workspace "${WORKSPACE}"
          npm run build --workspace "${WORKSPACE}"

      - name: Unit tests (tool allowlist + validation gate)
        run: npm run test --workspace "${WORKSPACE}"

      - name: Golden-question eval (mock mode — no API key, no spend)
        run: npm run eval --workspace "${WORKSPACE}"

      - name: Upload eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: copilot-eval-results
          path: apps/copilot-svc/evals/eval-results.json
          if-no-files-found: warn
          retention-days: 14

  image:
    name: container build, scan and push
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build the renderer into the build context (P-7)
        run: |
          set -euo pipefail
          npm ci
          npm run build:renderer
          test -d apps/shared/spec-renderer/dist

      - name: Compute the GHCR reference
        id: tag
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          registry="ghcr.io/$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')/${APP_SLUG}"
          tag="sha-${GITHUB_SHA:0:7}"
          {
            echo "registry=${registry}"
            echo "tag=${tag}"
            echo "image=${registry}:${tag}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (context = repo root, open item P-7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=copilot-svc
          cache-to: type=gha,mode=max,scope=copilot-svc

      - name: Trivy gate — fail the build on CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy SARIF for the Security tab (non-blocking)
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-copilot-svc.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload the Trivy SARIF
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('trivy-copilot-svc.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-copilot-svc.sarif
          category: trivy-copilot-svc

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.registry }}:latest
          cache-from: type=gha,scope=copilot-svc
          cache-to: type=gha,mode=max,scope=copilot-svc

  deploy:
    name: deploy to Container Apps
    needs: [preflight, image]
    if: ${{ needs.preflight.outputs.configured == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the new image onto the container app
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.names.outputs.ca-copilot }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          # The ANTHROPIC_API_KEY env var on this app is a Key Vault reference
          # wired by infra/bicep/apps/main.bicep — never set here, never logged.
          az containerapp update \
            --resource-group "${RG_APPS}" \
            --name "${APP_NAME}" \
            --image "${IMAGE}" \
            --min-replicas 0 \
            --output none
          echo "Deployed ${IMAGE} to ${APP_NAME}."

      - name: Check the ingress target port (open item P-1)
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.names.outputs.ca-copilot }}
          CONFIGURED_PORT: ${{ vars.COPILOT_SVC_PORT }}
        run: |
          set -euo pipefail
          current="$(az containerapp show -g "${RG_APPS}" -n "${APP_NAME}" \
            --query properties.configuration.ingress.targetPort -o tsv)"
          echo "Current ingress target port: ${current}"
          if [ "${current}" = "80" ] && [ -z "${CONFIGURED_PORT}" ]; then
            echo "::warning title=P-1 open — target port still 80::${APP_NAME} serves a real image on 8080 but ingress still targets the placeholder port 80. Set COPILOT_SVC_PORT=8080 in the demo environment and re-run layer-07-apps.yml. Ingress was deliberately NOT mutated here."
          fi

      - name: Deployment summary
        env:
          APP_NAME: ${{ steps.names.outputs.ca-copilot }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          {
            echo "### copilot-svc deployed"
            echo
            echo "- container app: \`${APP_NAME}\` (internal ingress by default)"
            echo "- image: \`${IMAGE}\`"
            echo
            echo "The live golden-question eval against the deployed service is L8's"
            echo "own step; this pipeline runs the mock-mode eval only (no spend)."
          } >> "${GITHUB_STEP_SUMMARY}"
