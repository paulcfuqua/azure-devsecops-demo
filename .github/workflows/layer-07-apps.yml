name: layer-07-apps

# =============================================================================
# L7 — Apps layer: the three container apps in mls-rg-apps.
# Playbook: docs/runbooks/layers/L07.md   Template: infra/bicep/apps/main.bicep
#
# Relationship to the per-app CI workflows:
#   * app-<name>-ci.yml builds, scans and pushes each image and then rolls it onto
#     an EXISTING container app (`az containerapp update`). That is the day-to-day
#     deploy path (L07 playbook step 1).
#   * THIS workflow is the declarative one: it creates/converges the three apps
#     from Bicep, and is what `infra-up.yml` replays on a rebuild (playbook step 2).
#
# ---------------------------------------------------------------------------
# OPEN ITEM P-1 — container target ports
#
# infra/bicep/apps/demo.bicepparam defaults every target port to **80**, which
# matches the `containerapps-helloworld` placeholder image, NOT the real apps.
# The real images listen on **8080** (see the EXPOSE lines in
# apps/launch-ops/Dockerfile, apps/control-tower/Dockerfile and
# apps/mcp-tools/Dockerfile — nginx and Node both bind 8080).
#
# When the first real images publish to GHCR, set these in the `demo` GitHub
# environment and the whole estate repoints with no code change:
#     LAUNCH_OPS_PORT=8080  CONTROL_TOWER_PORT=8080  MCP_TOOLS_PORT=8080
# Until then the fallback below stays 80 so the placeholder image keeps working.
# This is open item P-1 out of Phase P; it closes at L7 image wiring.
# ---------------------------------------------------------------------------
# =============================================================================

on:
  workflow_call:
    inputs:
      location:
        description: Azure region for the apps deployment.
        type: string
        required: false
        default: ''
      dry_run:
        description: Run `az deployment group what-if` only; make no writes.
        type: boolean
        required: false
        default: false
      image_tag:
        description: >-
          GHCR tag to deploy for all five apps. Defaults to `latest`, which is what
          the per-app CI workflows publish. Set it to the empty string to deploy the
          `containerapps-helloworld` placeholder instead - a deliberate choice, not
          the default, because a placeholder estate reports success while serving
          none of the demo (F88).
        type: string
        required: false
        default: latest
      canary_pr:
        description: >-
          Canary PR number for V7.4. The L7 lead opens it (the Verifier never writes to
          the repo); empty falls back to the MLS_L7_CANARY_PR demo variable.
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      location:
        description: Azure region for the apps deployment.
        type: string
        required: false
        default: ''
      dry_run:
        description: Run `az deployment group what-if` only; make no writes.
        type: boolean
        required: false
        default: false
      image_tag:
        description: >-
          GHCR tag to deploy for all five apps. Defaults to `latest`, which is what
          the per-app CI workflows publish. Set it to the empty string to deploy the
          `containerapps-helloworld` placeholder instead - a deliberate choice, not
          the default, because a placeholder estate reports success while serving
          none of the demo (F88).
        type: string
        required: false
        default: latest
      canary_pr:
        description: >-
          Canary PR number for V7.4 (empty falls back to the MLS_L7_CANARY_PR demo variable).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (demo environment guard)
    runs-on: ubuntu-latest
    # Bounded: reads repository variables and nothing else. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 10
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      verifier: ${{ steps.verifier.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L7 apps
      - id: verifier
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L7 verification (mls-verifier)

  deploy:
    name: deploy L7 apps
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    env:
      # Consumed by infra/bicep/apps/demo.bicepparam via readEnvironmentVariable().
      # vars.AZURE_LOCATION is the single source of truth for the estate's region.
      # It is resolved HERE, not in infra-up.yml, because a reusable-workflow caller
      # job cannot declare `environment:` and therefore cannot see an environment
      # variable at all - which is why every layer used to carry `default: eastus`
      # instead. An explicit `location` input still overrides, for a one-off (F53).
      AZURE_LOCATION: ${{ inputs.location || vars.AZURE_LOCATION }}
      # THE TARGET PORTS ARE NOT DECLARED HERE. They are derived from the image
      # decision by the "Resolve GHCR image references" step below and written to
      # GITHUB_ENV, because THE PORT IS NOT INDEPENDENT OF THE IMAGE: the real
      # images listen on 8080 (verified EXPOSE in all five app Dockerfiles) and
      # `containerapps-helloworld` listens on 80. Two knobs that must agree, with
      # separate defaults that did not, is what F88 was. This closes open item P-1.
      #
      # A `vars.<APP>_PORT` override still wins; the step reads those itself, from
      # its own step-level `env:`. Declaring them at job level as well would put a
      # job-level `env:` and a GITHUB_ENV write of the same name in the same job,
      # and nothing should depend on which of those two wins (the F36 rule, applied
      # to the Easy Auth client IDs a few lines below for the same reason).
      #
      # mcp-tools ingress is external unconditionally (Copilot Studio connects
      # server-to-server from Microsoft's cloud), so there is no ingress toggle.
      # data-api cloud mode. Without the Fabric SQL analytics endpoint the app
      # provisions in LOCAL mode, which answers 503 on every table route because
      # data/generated is not baked into the image — the template says so in its
      # dataApiBackendModeResolved output rather than crash-looping the revision.
      # MLS_SQL_ENDPOINT is the same demo variable L5 and L8 read.
      MLS_FABRIC_SQL_ENDPOINT: ${{ vars.MLS_SQL_ENDPOINT }}
      MLS_FABRIC_DATABASE: ${{ vars.MLS_LAKEHOUSE_NAME || 'mls_operations' }}
      MLS_GITHUB_REPO: ${{ github.repository }}
      # The three human-facing apps' Easy Auth client IDs (MLS_LAUNCH_OPS_CLIENT_ID,
      # MLS_CONTROL_TOWER_CLIENT_ID, MLS_COMPLIANCE_CLIENT_ID) are deliberately
      # NOT set here. They are RESOLVED FROM ENTRA by the "Resolve the Easy Auth
      # client IDs" step below and written to GITHUB_ENV under exactly the names
      # infra/bicep/apps/demo.bicepparam reads (F36). Declaring them at job level
      # as well would put a job-level `env:` and a GITHUB_ENV write of the same
      # name in the same job, and nothing here should depend on which of those
      # two wins. The step reads the GitHub variables itself, as OPTIONAL
      # overrides, from its own step-level `env:`.
      #
      # An UNDEFINED GitHub variable expands to the EMPTY STRING, not to nothing,
      # so readEnvironmentVariable in demo.bicepparam sees a variable that IS set
      # and never returns its 'unset' default (F26). main.bicep fails closed on
      # both spellings: no client ID means INTERNAL ingress and no authConfig.
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Resolve GHCR image references
        id: images
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPO: ${{ github.repository }}
          # Optional deliberate overrides, read here rather than at job level (F36).
          LAUNCH_OPS_PORT_OVERRIDE: ${{ vars.LAUNCH_OPS_PORT }}
          CONTROL_TOWER_PORT_OVERRIDE: ${{ vars.CONTROL_TOWER_PORT }}
          MCP_TOOLS_PORT_OVERRIDE: ${{ vars.MCP_TOOLS_PORT }}
          DATA_API_PORT_OVERRIDE: ${{ vars.DATA_API_PORT }}
          COMPLIANCE_PORT_OVERRIDE: ${{ vars.COMPLIANCE_PORT }}
        run: |
          set -euo pipefail
          # ghcr.io/<owner>/<repo>/<app>:<tag> - free anonymous pull on a public
          # repo, so there is no ACR resource and no registry credential.
          #
          # THIS STEP DECIDES THE IMAGE AND THE PORT TOGETHER, because they are one
          # decision wearing two names. Deploying the real images on port 80, or the
          # placeholder on 8080, produces five container apps that provision fine and
          # answer nothing - which is exactly what F88 was: L7 reported success while
          # every app served `containerapps-helloworld`, and V7.1, V7.3 and V7.5 all
          # failed downstream of that one fact.
          if [ -z "${IMAGE_TAG}" ]; then
            echo "::warning title=Deploying placeholder images::image_tag is empty, so all five apps deploy the containerapps-helloworld placeholder on port 80. The estate will provision and serve NONE of the demo, and V7.1/V7.3/V7.5 will fail - correctly."
            port=80
          else
            registry="ghcr.io/$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')"
            {
              echo "LAUNCH_OPS_IMAGE=${registry}/launch-ops:${IMAGE_TAG}"
              echo "CONTROL_TOWER_IMAGE=${registry}/control-tower:${IMAGE_TAG}"
              echo "MCP_TOOLS_IMAGE=${registry}/mcp-tools:${IMAGE_TAG}"
              echo "DATA_API_IMAGE=${registry}/data-api:${IMAGE_TAG}"
              echo "COMPLIANCE_IMAGE=${registry}/compliance:${IMAGE_TAG}"
            } >> "${GITHUB_ENV}"
            # Every app Dockerfile EXPOSEs 8080 (nginx listens 8080 on the three
            # static frontends; Node binds it on data-api and mcp-tools). Verified
            # against the Dockerfiles rather than remembered - CLAUDE.md's rule for
            # a constant that names something in another system.
            port=8080
            echo "resolved=true" >> "${GITHUB_OUTPUT}"
          fi

          # A deliberate per-app override still wins over the derived value.
          {
            echo "LAUNCH_OPS_PORT=${LAUNCH_OPS_PORT_OVERRIDE:-${port}}"
            echo "CONTROL_TOWER_PORT=${CONTROL_TOWER_PORT_OVERRIDE:-${port}}"
            echo "MCP_TOOLS_PORT=${MCP_TOOLS_PORT_OVERRIDE:-${port}}"
            echo "DATA_API_PORT=${DATA_API_PORT_OVERRIDE:-${port}}"
            echo "COMPLIANCE_PORT=${COMPLIANCE_PORT_OVERRIDE:-${port}}"
          } >> "${GITHUB_ENV}"
          echo "Image tag: ${IMAGE_TAG:-<placeholder>}; target port: ${port}"

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------------------------------------
      # F36 — the Easy Auth client IDs resolve themselves.
      #
      # F25 made all three dashboards login-gated and F26 made that gate real,
      # but between them they left the estate UNDEPLOYABLE out of the box: the
      # step that used to stand at the top of this job refused the entire L7
      # deploy unless an adopter had hand-set MLS_LAUNCH_OPS_CLIENT_ID,
      # MLS_CONTROL_TOWER_CLIENT_ID and MLS_COMPLIANCE_CLIENT_ID first. Secure,
      # but not deployable — and those two were never actually in tension: L3
      # (infra/entra/apply-entra.ps1) already CREATES all four app registrations
      # from infra/entra/manifest.json, as this same identity, so the client IDs
      # are discoverable rather than something a human has to copy out of the
      # portal into a GitHub variable.
      #
      # So, per app: honour an explicitly-set variable when there is one
      # (bring-your-own registration stays supported), otherwise look the
      # registration up BY ITS MANIFEST DISPLAY NAME. The names are read from
      # infra/entra/manifest.json and never written as string literals here —
      # the company prefix is naming.bicep's to own (CLAUDE.md).
      #
      # THREE OUTCOMES, AND TWO OF THEM ARE NOT ERRORS:
      #   * resolved   -> the app deploys EXTERNAL, behind an Entra sign-in.
      #   * not found  -> NOT an error. main.bicep's ingressExternal is literally
      #                   the same expression as "is a client ID configured", so
      #                   the app still deploys — INTERNAL to the Container Apps
      #                   environment, unreachable from the internet, with no
      #                   authConfig to be missing. That is a documented state,
      #                   not a failure, and this step says so loudly: a
      #                   ::warning naming the apps, plus a step-summary block
      #                   naming each one, its state, and the command that fixes
      #                   it. A missing client ID can cost you a demo you cannot
      #                   reach; it can never cost you an open dashboard.
      #   * az failed, or MORE THAN ONE registration matched -> an ERROR, exit 1.
      #     "the CLI was throttled" and "L3 has not run yet" must never look the
      #     same — that conflation is F20's original defect and this repo has
      #     fixed it twice — and gating a dashboard against the WRONG tenant
      #     identity is worse than not publishing it, which is the same refusal
      #     the F24 step below makes on an ambiguous identity match.
      #
      # Reading the registrations needs Application.ReadWrite.OwnedBy, which
      # scripts/bootstrap/01-root-oidc.ps1 grants mls-github-deployer (reduced
      # from .All by F8) and which covers exactly the apps this identity created.
      # ---------------------------------------------------------------------
      - name: Resolve the Easy Auth client IDs from their Entra app registrations (F36)
        id: easy_auth
        shell: pwsh
        env:
          # OPTIONAL OVERRIDES, not requirements. Set one to bring your own app
          # registration; leave it unset and L3's is used. NOT secrets — an
          # OAuth client ID is a public identifier, the same trust class as
          # AZURE_CLIENT_ID (CLAUDE.md hard rule 5), and no client secret is
          # configured for the Easy Auth provider anywhere.
          MLS_LAUNCH_OPS_CLIENT_ID: ${{ vars.MLS_LAUNCH_OPS_CLIENT_ID }}
          MLS_CONTROL_TOWER_CLIENT_ID: ${{ vars.MLS_CONTROL_TOWER_CLIENT_ID }}
          MLS_COMPLIANCE_CLIENT_ID: ${{ vars.MLS_COMPLIANCE_CLIENT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'

          # az failures do not throw in pwsh ($PSNativeCommandUseErrorActionPreference
          # defaults to $false), so every call is checked explicitly - the same
          # shape as the F20 and F24 grant steps further down this job.
          function Assert-AzSucceeded {
            param([Parameter(Mandatory)][string]$What)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Azure CLI call failed::$What returned exit code $LASTEXITCODE. This is NOT the same as 'the app registration does not exist yet' - it is a CLI, auth or Graph-permission failure, and no client ID could be resolved. mls-github-deployer holds Application.ReadWrite.OwnedBy, which can read the registrations it created at L3; if that consent is missing, set MLS_LAUNCH_OPS_CLIENT_ID / MLS_CONTROL_TOWER_CLIENT_ID / MLS_COMPLIANCE_CLIENT_ID on the demo environment as an override and re-run."
              exit 1
            }
          }

          $manifest = Get-Content -LiteralPath 'infra/entra/manifest.json' -Raw | ConvertFrom-Json

          # appKey, not a display-name literal: the manifest owns the names.
          $targets = @(
            @{ Key = 'launch-ops'; Variable = 'MLS_LAUNCH_OPS_CLIENT_ID'; Output = 'launch-ops-app-id' }
            @{ Key = 'control-tower'; Variable = 'MLS_CONTROL_TOWER_CLIENT_ID'; Output = 'control-tower-app-id' }
            @{ Key = 'compliance'; Variable = 'MLS_COMPLIANCE_CLIENT_ID'; Output = 'compliance-app-id' }
          )

          $rows = [System.Collections.Generic.List[string]]::new()
          $unpublished = [System.Collections.Generic.List[object]]::new()

          foreach ($target in $targets) {
            $declared = @($manifest.appRegistrations | Where-Object { $_.appKey -eq $target.Key })
            if ($declared.Count -ne 1) {
              Write-Host "::error title=Manifest does not declare exactly one app registration for '$($target.Key)'::infra/entra/manifest.json has $($declared.Count) appRegistrations entries with appKey '$($target.Key)'; expected exactly one. Fix the manifest - guessing which registration gates a dashboard is the failure this refuses to make."
              exit 1
            }
            $displayName = [string]$declared[0].displayName

            $clientId = ''
            $state = ''
            $override = [Environment]::GetEnvironmentVariable($target.Variable)
            if ($override -and $override.Trim() -and $override.Trim() -ne 'unset') {
              $clientId = $override.Trim()
              $state = "supplied by the $($target.Variable) variable (override)"
            }
            else {
              # --display-name filters server-side, but az has spelled that filter
              # both 'eq' and 'startswith' across versions, so the exact name is
              # re-asserted in the query: a registration merely PREFIXED with this
              # name is a different app registration.
              # The OUTER @() is load-bearing: `@(...) | Where-Object` hands back a
              # bare STRING when exactly one item survives the filter, and $matched[0]
              # on a string is its first CHARACTER, not the appId. One matching
              # registration is the normal case, so without this the happy path
              # gates every dashboard against a one-letter client ID.
              $matched = @(
                @(
                  az ad app list --display-name $displayName --query "[?displayName=='$displayName'].appId" -o tsv
                ) | Where-Object { $_ -and $_.Trim() }
              )
              Assert-AzSucceeded -What "az ad app list --display-name $displayName"

              if ($matched.Count -gt 1) {
                Write-Host "::error title=Ambiguous app registration::Found $($matched.Count) app registrations named '$displayName'. Refusing to gate a dashboard against an arbitrary one - the wrong client ID authenticates against the wrong tenant identity. Delete the duplicate, or set $($target.Variable) explicitly to the one you mean."
                exit 1
              }
              if ($matched.Count -eq 1) {
                $clientId = ([string]$matched[0]).Trim()
                $state = 'resolved from Entra'
              }
              else {
                $state = "NOT FOUND - no app registration named $displayName in this tenant"
                $unpublished.Add([pscustomobject]@{ DisplayName = $displayName; Variable = $target.Variable })
              }
            }

            if ($clientId) {
              Write-Host "$displayName -> $clientId ($state)."
              $rows.Add("| $displayName | $state | **external**, Entra sign-in required |")
            }
            else {
              Write-Host "$displayName -> no client ID ($state)."
              $rows.Add("| $displayName | $state | **internal only** - deployed, not publicly reachable |")
            }

            # Written under the exact names demo.bicepparam's readEnvironmentVariable
            # calls read. An app with no client ID gets the EMPTY STRING, which
            # main.bicep's isEntraClientIdConfigured() treats as not-configured
            # exactly like the 'unset' sentinel (F26) - so it fails closed either way.
            "$($target.Variable)=$clientId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "$($target.Output)=$clientId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add('### Easy Auth - which dashboards this run publishes')
          $summary.Add('')
          $summary.Add('| App registration | Client ID | Ingress |')
          $summary.Add('|---|---|---|')
          foreach ($row in $rows) { $summary.Add($row) }

          if ($unpublished.Count -gt 0) {
            $names = ($unpublished | ForEach-Object { $_.DisplayName }) -join ', '
            $variables = ($unpublished | ForEach-Object { $_.Variable }) -join ', '
            Write-Host "::warning title=Some dashboards are not publicly reachable::$($unpublished.Count) of $($targets.Count) Easy Auth client IDs could not be resolved ($names). Those apps still DEPLOY, but with internal ingress and no Easy Auth, so they are not reachable from the internet - that is the fail-closed behaviour, not a failure. Fix: run L3 (gh workflow run layer-03-entra.yml), which creates every app registration in infra/entra/manifest.json, then re-run this workflow. Or set $variables on the demo environment to bring your own registrations."
            $summary.Add('')
            $summary.Add("**$($unpublished.Count) of $($targets.Count) dashboards deployed INTERNAL to the Container Apps environment and are NOT reachable from the internet.** This is not an error: infra/bicep/apps/main.bicep ties each app's ingressExternal to the same expression as its Easy Auth config, so an app with no client ID is never published anonymously.")
            $summary.Add('')
            $summary.Add('Fix it with one command - L3 creates every app registration declared in infra/entra/manifest.json:')
            $summary.Add('')
            $summary.Add('```bash')
            $summary.Add('gh workflow run layer-03-entra.yml')
            $summary.Add('```')
            $summary.Add('')
            $summary.Add("Then re-run this workflow: it resolves the client IDs itself and registers each app's redirect URI. To bring your own registrations instead, set $variables on the demo environment (variables, not secrets).")
          }

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ---------------------------------------------------------------------
      # V7.1's content-hash marker. The criterion binds "endpoint is up" to
      # "endpoint serves the audited build", so it needs the digest of the image
      # each app is actually running — and it refuses to pass on liveness alone.
      #
      # Two sources, in order:
      #   1. the registry, via `docker buildx imagetools inspect`. Anonymous pull
      #      on a public GHCR repo, so no credential and no image download — it
      #      reads the manifest only. This is the authoritative answer for the
      #      tag this run is about to deploy.
      #   2. whatever MLS_IMAGE_DIGEST is already stamped on the running app.
      #      That value was written by the per-app CI run that last rolled an
      #      image (app-*-ci.yml pins by digest and stamps it), so preserving it
      #      is what stops this declarative converge from wiping the record of a
      #      newer per-app deploy.
      # Neither available -> 'unset', and V7.1 says so instead of passing.
      # ---------------------------------------------------------------------
      - name: Resolve the image digest for each app
        id: digests
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          CA_LAUNCH_OPS: ${{ steps.names.outputs.ca-launch-ops }}
          CA_CONTROL_TOWER: ${{ steps.names.outputs.ca-control-tower }}
          CA_MCP: ${{ steps.names.outputs.ca-mcp }}
          CA_DATA_API: ${{ steps.names.outputs.ca-data-api }}
          CA_COMPLIANCE: ${{ steps.names.outputs.ca-compliance }}
        run: |
          set -euo pipefail

          from_registry() {
            docker buildx imagetools inspect "$1" --format '{{ .Manifest.Digest }}' 2>/dev/null || true
          }

          from_container_app() {
            az containerapp show --resource-group "${RG_APPS}" --name "$1" \
              --query "properties.template.containers[0].env[?name=='MLS_IMAGE_DIGEST'].value | [0]" \
              -o tsv 2>/dev/null || true
          }

          resolve() {
            local image="$1" app_name="$2" digest_var="$3" digest=""
            if [ -n "${image}" ]; then
              digest="$(from_registry "${image}")"
            fi
            if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
              digest="$(from_container_app "${app_name}")"
            fi
            if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
              digest="unset"
              echo "::warning title=No image digest for ${app_name}::Neither the registry nor the running container app could supply an image digest, so MLS_IMAGE_DIGEST will be 'unset' and L7 V7.1 will report that the health payload does not carry the deployed digest. That is the honest outcome, not a pass."
            fi
            echo "${digest_var}=${digest}" >> "${GITHUB_ENV}"
            echo "${app_name}: ${digest}"
          }

          # The *_IMAGE variables were written to GITHUB_ENV by the previous step,
          # so they are readable here; they are absent when no image_tag was given.
          resolve "${LAUNCH_OPS_IMAGE:-}" "${CA_LAUNCH_OPS}" LAUNCH_OPS_IMAGE_DIGEST
          resolve "${CONTROL_TOWER_IMAGE:-}" "${CA_CONTROL_TOWER}" CONTROL_TOWER_IMAGE_DIGEST
          resolve "${MCP_TOOLS_IMAGE:-}" "${CA_MCP}" MCP_TOOLS_IMAGE_DIGEST
          resolve "${DATA_API_IMAGE:-}" "${CA_DATA_API}" DATA_API_IMAGE_DIGEST
          resolve "${COMPLIANCE_IMAGE:-}" "${CA_COMPLIANCE}" COMPLIANCE_IMAGE_DIGEST

      - name: What-if the apps deployment
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # In a plan run L6 only what-ifs, so the resource group L7 what-ifs AGAINST does
          # not exist yet. That is the layering, not a defect -- but failing on it made
          # `up.ps1 -DryRun` incapable of ever exiting 0, which is a plan whose exit code
          # carries no information. Dry-run ONLY: outside a plan run a missing resource
          # group means L6 did not deliver, and that must still fail loudly (F51).
          if ! az group show --name "${RG_APPS}" >/dev/null 2>&1; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice title=L7 what-if skipped::${RG_APPS} does not exist yet - L6 planned it but a dry run creates nothing. There is no deployed state to what-if against."
              echo "L7 what-if skipped: ${RG_APPS} does not exist (dry run; L6 planned it without creating it)." | tee what-if-l7.txt
              exit 0
            fi
            echo "::error title=Resource group missing::${RG_APPS} does not exist, and this is not a dry run. L6 must create it before L7 runs."
            exit 1
          fi
          az deployment group what-if \
            --resource-group "${RG_APPS}" \
            --template-file infra/bicep/apps/main.bicep \
            --parameters infra/bicep/apps/demo.bicepparam \
            --name "l7-apps-${GITHUB_RUN_ID}" \
            | tee what-if-l7.txt

      - name: Deploy the apps
        if: ${{ !inputs.dry_run }}
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${RG_APPS}" \
            --template-file infra/bicep/apps/main.bicep \
            --parameters infra/bicep/apps/demo.bicepparam \
            --name "l7-apps-${GITHUB_RUN_ID}" \
            --output json > l7-outputs.json
          jq '.properties.outputs' l7-outputs.json > l7-manifest.json

          data_api_mode="$(jq -r '.dataApiBackendModeResolved.value // "unknown"' l7-manifest.json)"
          # F4 (compliance/findings/2026-08-26-prepublication-review.md#f4,
          # Task 8): the full manifest carries container app resource IDs (each
          # embedding the subscription ID) and data-api's internal-only origin
          # (F1/Task 6 made data-api ingressExternal:false — no legitimate
          # caller is outside the CAE, so its FQDN has no business in a public
          # job summary either). l7-manifest.json itself stays on the runner;
          # only a curated, non-sensitive subset goes into the summary, and
          # none of it is uploaded as an artifact.
          {
            echo "### L7 app endpoints (selected non-sensitive keys)"
            echo
            echo '```json'
            jq '{
              containerAppNames: .containerAppNames.value,
              dataApiBackendModeResolved: .dataApiBackendModeResolved.value,
              imageDigests: .imageDigests.value,
              launchOpsFqdn: .launchOpsFqdn.value,
              controlTowerFqdn: .controlTowerFqdn.value,
              mcpToolsFqdn: .mcpToolsFqdn.value,
              mcpToolsEndpoint: .mcpToolsEndpoint.value,
              complianceAppName: .complianceAppName.value,
              complianceFqdn: .complianceFqdn.value
            }' l7-manifest.json
            echo '```'
            echo
            echo "Target ports in effect — launch-ops: ${LAUNCH_OPS_PORT}, control-tower: ${CONTROL_TOWER_PORT}, mcp-tools: ${MCP_TOOLS_PORT}, data-api: ${DATA_API_PORT}, compliance: ${COMPLIANCE_PORT}."
            if [ "${LAUNCH_OPS_PORT}" = "80" ]; then
              echo
              echo "> **P-1 open:** ports are still on the placeholder 80. Set LAUNCH_OPS_PORT / CONTROL_TOWER_PORT / MCP_TOOLS_PORT / DATA_API_PORT / COMPLIANCE_PORT to 8080 in the demo environment once real images are published."
            fi
            echo
            echo "data-api backend mode: \`${data_api_mode}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${data_api_mode}" != "cloud" ]; then
            echo "::warning title=data-api is not in cloud mode::The template resolved MLS_DATA_BACKENDS='${data_api_mode}' because MLS_SQL_ENDPOINT is not set on the demo environment. LOCAL mode reads data/generated, which is not in the image, so every /api/tables route will answer 503 and both dashboards will render empty. Set MLS_SQL_ENDPOINT to the lakehouse SQL analytics endpoint (the L5 lakehouse metadata's sqlEndpointProperties.connectionString) and re-run."
          fi

      # ---------------------------------------------------------------------
      # The V7.1 deploy manifest, in the exact shape the audit reads:
      #   {"apps":[{"name":"<container app>","imageDigest":"<sha256:...>"}]}
      #
      # Built from the deployment's own outputs (containerAppNames + imageDigests)
      # rather than reconstructed from workflow variables, so the manifest records
      # what ARM actually accepted. Without it Test-PublicEndpoint returns a FINAL
      # failure — "Refusing to pass on liveness alone" — however healthy the apps
      # are, because a 200 from an app serving last week's image is not what the
      # criterion asks about.
      # ---------------------------------------------------------------------
      - name: Write the V7.1 deploy manifest for the Verifier
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          jq '.containerAppNames.value as $names
              | .imageDigests.value as $digests
              | { apps: [ $names
                          | to_entries[]
                          | { name: .value, imageDigest: ($digests[.key] // "unset") } ] }' \
            l7-manifest.json > l7-verifier-manifest.json

          # An empty apps array means the outputs did not carry the two objects
          # this reads, and V7.1 would then fail with "no imageDigest in the deploy
          # manifest" for every app — a pipeline defect wearing an estate defect's
          # clothes. Fail here, where the cause is visible.
          if [ "$(jq '.apps | length' l7-verifier-manifest.json)" = "0" ]; then
            echo "::error title=Empty V7.1 deploy manifest::The L7 deployment outputs carried no containerAppNames/imageDigests, so the Verifier has nothing to bind endpoints to builds with."
            exit 1
          fi

      - name: Upload the V7.1 deploy manifest
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-07-deploy-manifest
          path: l7-verifier-manifest.json
          if-no-files-found: warn
          retention-days: 30

      # ---------------------------------------------------------------------
      # F20 (compliance/findings/2026-08-26-prepublication-review.md#f20): L6's
      # single `seed.ps1 -Target sql` pass (layer-06-platform.yml) runs before
      # this layer creates the data-api identity, so
      # data/seed/sql/900-contained-users.sql's CREATE USER / ALTER ROLE
      # statements can't resolve the Entra principal yet and are guarded to log
      # "pending L7" rather than abort the rest of L6's schema seed (see that
      # file's header). Re-running the SQL seed now that the identity exists —
      # created by the "Deploy the apps" step above — is what actually
      # completes the grant.
      #
      # PLACEMENT AND FAILURE POSTURE (Task 22 review, Important #1). This step
      # deliberately runs AFTER the V7.1 manifest is written and uploaded, and
      # carries continue-on-error. Both halves matter and neither alone is
      # enough:
      #   * Ordering — the manifest steps are gated `if: !inputs.dry_run` with
      #     no always(), so a hard failure HERE, earlier in the job, would skip
      #     them and the Verifier would have no manifest to bind endpoints to
      #     builds with.
      #   * continue-on-error — the `verify` job needs `deploy` to SUCCEED
      #     (needs: [preflight, deploy]), so moving this step later without it
      #     would still red the job and still cost the layer its Verifier
      #     sign-off, with L8 gated on L7 behind that.
      # This is an IDEMPOTENT REMEDIATION step: a PSGallery hiccup installing
      # SqlServer, a throttled token mint, or a transient SQL blip must not fail
      # a deployment that otherwise fully succeeded. Failures are annotated as
      # errors and written to the step summary so they are visible rather than
      # silent, and the Verifier audit is the real backstop — a grant that never
      # landed shows up as data-api failing its SQL routes.
      #
      # -SchemaOnly (not a plain re-invocation, and not -Force): a plain
      # `-Target sql` re-run DOES reach Install-SeedSchema (it applies the DDL
      # unconditionally, before the row-count check), but Assert-SqlSeedPrerequisite
      # also requires data/generated/ to be complete, and this job has no Python
      # toolchain to build it — so a plain re-run would throw before the grant
      # ever applied. -SchemaOnly skips dataset generation and that check
      # entirely: it applies data/seed/sql/*.sql (every file there is guarded —
      # IF NOT EXISTS / sys.database_principals — so this is a no-op on replay)
      # and touches no table data: no row-count probe, no wipe, no reload. That
      # is also why this is not `-Force`: -Force means wipe-and-reload, which
      # would re-load all ten operational tables against Azure SQL serverless
      # for one idempotent grant — unnecessary auto-resume and runtime against
      # the sponsor's 30-day credit.
      #
      # The server/database are resolved directly from Azure (mls-github-deployer
      # is already the server's Entra admin, from L6) rather than by plumbing
      # L6's deployment outputs across a workflow boundary — same reasoning as
      # the verify job's Log Analytics customer-id lookup below. An ABSENT
      # server is a skip, not a failure (a standalone L7 dispatch ahead of L6
      # has nothing to grant against yet); a FAILED Azure CLI call is an error,
      # because "the CLI was throttled" and "L6 has not run" must not look the
      # same — that is how F20 would silently recur.
      - name: Apply the SQL contained-database user now that the identity exists (F20)
        id: f20_grant
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        shell: pwsh
        env:
          RG_PLATFORM: ${{ steps.names.outputs.rg-platform }}
        run: |
          $ErrorActionPreference = 'Stop'

          # az failures do not throw in pwsh ($PSNativeCommandUseErrorActionPreference
          # defaults to $false), so every call is checked explicitly.
          function Assert-AzSucceeded {
            param([Parameter(Mandatory)][string]$What)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Azure CLI call failed::$What returned exit code $LASTEXITCODE. This is NOT the same as 'L6 has not deployed yet' - it is a CLI, auth or throttling failure, and the F20 grant pass did not run. Re-run this workflow, or apply the grant by hand: data/seed/seed.ps1 -Target sql -SchemaOnly."
              exit 1
            }
          }

          $serverName = az sql server list --resource-group $env:RG_PLATFORM --query '[0].name' -o tsv
          Assert-AzSucceeded -What 'az sql server list'
          if (-not $serverName) {
            Write-Host "::warning title=No Azure SQL server found::Could not find an Azure SQL logical server in $env:RG_PLATFORM. Skipping the F20 post-L7 grant pass (data/seed/sql/900-contained-users.sql) - L6 has probably not deployed yet on a standalone L7 run. A standard infra-up.yml pass runs L6 first and will not hit this."
            exit 0
          }

          $sqlFqdn = az sql server show --resource-group $env:RG_PLATFORM --name $serverName --query fullyQualifiedDomainName -o tsv
          Assert-AzSucceeded -What 'az sql server show'

          # Every non-master database, not "| [0]". Picking the first would land
          # the grant on an arbitrary database the moment this estate ever holds
          # more than one, silently and with no way to tell from the log.
          # The OUTER @() is load-bearing, and its absence was a live defect until
          # F36: `@(...) | Where-Object` returns a bare STRING when exactly one
          # item survives, and $dbNames[0] on a string is its first CHARACTER. The
          # single-database case is the normal one, so the grant was being aimed at
          # a one-letter database name on every ordinary run.
          $dbNames = @(
            @(
              az sql db list --resource-group $env:RG_PLATFORM --server $serverName --query "[?name!='master'].name" -o tsv
            ) | Where-Object { $_ -and $_.Trim() }
          )
          Assert-AzSucceeded -What 'az sql db list'

          if ($dbNames.Count -eq 0 -or -not $sqlFqdn) {
            Write-Host "::warning title=Azure SQL database not found::Found server $serverName in $env:RG_PLATFORM but no non-master database. Skipping the F20 post-L7 grant pass."
            exit 0
          }
          if ($dbNames.Count -gt 1) {
            Write-Host "::error title=Ambiguous Azure SQL database::Found $($dbNames.Count) non-master databases on $serverName ($($dbNames -join ', ')). This step refuses to guess which one data-api reads. Grant explicitly instead: data/seed/seed.ps1 -Target sql -SchemaOnly -SqlDatabase <name>."
            exit 1
          }
          $sqlDb = $dbNames[0]

          # SqlServer 22+ is required for Invoke-Sqlcmd -AccessToken (Entra-only
          # auth is enforced on the server; no SQL password exists to fall back
          # on - CLAUDE.md hard rule 5). Same module L6 installs for the same reason.
          Install-Module SqlServer -Force -Scope CurrentUser -MinimumVersion 22.0.0 -AllowClobber

          $sqlToken = az account get-access-token --resource https://database.windows.net --query accessToken -o tsv
          Assert-AzSucceeded -What 'az account get-access-token'
          if (-not $sqlToken) {
            Write-Host '::error title=Token acquisition failed::Could not mint an Azure SQL access token for the F20 grant pass.'
            exit 1
          }

          ./data/seed/seed.ps1 `
            -Target sql `
            -SchemaOnly `
            -SqlServerInstance $sqlFqdn `
            -SqlDatabase $sqlDb `
            -SqlAccessToken $sqlToken `
            -Confirm:$false

          Write-Host "F20: contained-database user grant pass applied against $sqlFqdn/$sqlDb."

      # Surfaces the step above when it fails. continue-on-error keeps the job
      # green on purpose, which also makes a failure easy to scroll past; this
      # puts it in the run summary where the sponsor actually looks.
      - name: Report a failed F20 grant pass
        if: ${{ !inputs.dry_run && steps.f20_grant.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### F20 grant pass did not complete"
            echo
            echo "The post-L7 contained-database user grant did not apply. The deployment itself succeeded and this does not block the Verifier, but \`data-api\` will fail its SQL routes until the grant lands."
            echo
            # shellcheck disable=SC2016  # backticks are markdown code-span syntax; no expansion wanted
            echo 'Apply it by hand: `data/seed/seed.ps1 -Target sql -SchemaOnly -SqlServerInstance <fqdn> -SqlDatabase <db> -SqlAccessToken <token>`'
          } >> "${GITHUB_STEP_SUMMARY}"

      # ---------------------------------------------------------------------
      # F24 (compliance/findings/2026-08-26-prepublication-review.md#f24): the
      # data-api half of F13's workload RBAC. infra/fabric/provision-workspace.ps1
      # has carried a -DataApiPrincipalId parameter since Task 12, but nothing ever
      # passed it: the script's own comment said "a caller (today, none - this is
      # the capability, not yet the wiring) passes it AFTER L7", and the only
      # caller, layer-05-fabric.yml, structurally cannot - L5 runs before L7, so
      # the identity does not exist yet. That is the identical ordering problem
      # F20 describes for the SQL grant, and this step is its Fabric twin.
      #
      # Without it, data-api in cloud mode (which G0 item C9 selects by setting
      # fabricSqlEndpoint) reaches the Fabric SQL analytics endpoint holding no
      # workspace role at all and 403s on every lakehouse read - the "dated
      # failure" F13 itself warns about.
      #
      # Placement and failure posture are deliberately identical to the F20 step
      # above, and for the same two reasons: it runs AFTER the V7.1 manifest is
      # written and uploaded (those steps carry no always(), so a hard failure
      # here would skip them), and it carries continue-on-error because `verify`
      # needs `deploy` to SUCCEED - an idempotent remediation step must not fail a
      # deployment that otherwise worked. Failures are annotated and summarised
      # rather than swallowed.
      #
      # Skipped, not failed, when FABRIC_CAPACITY_ID is unset: L5 has not run, so
      # there is no workspace to grant against. A FAILED az call is a different
      # thing and is treated as an error - "the CLI was throttled" and "L5 has not
      # run" must not look the same, which is how F20 recurred once already.
      - name: Grant data-api the Fabric workspace Viewer role now that the identity exists (F24)
        id: f24_grant
        if: ${{ !inputs.dry_run && vars.FABRIC_CAPACITY_ID != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          FABRIC_CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-AzSucceeded {
            param([Parameter(Mandatory)][string]$What)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Azure CLI call failed::$What returned exit code $LASTEXITCODE. This is NOT the same as 'the identity does not exist yet' - it is a CLI, auth or throttling failure, and the F24 Fabric grant did not run."
              exit 1
            }
          }

          # Resolved by shape rather than by a hardcoded name: naming.bicep owns the
          # prefix and env (CLAUDE.md - never hardcode 'mls' outside naming.bicep),
          # so this asks the resource group what data-api identity it holds.
          $ids = @(
            az identity list --resource-group $env:RG_APPS --query "[?contains(name, 'data-api')].{name:name, principalId:principalId}" -o json |
              ConvertFrom-Json
          )
          Assert-AzSucceeded -What 'az identity list'

          if ($ids.Count -eq 0) {
            Write-Host "::warning title=data-api identity not found::No user-assigned identity matching 'data-api' in $env:RG_APPS. Skipping the F24 Fabric workspace grant."
            exit 0
          }
          if ($ids.Count -gt 1) {
            # Same refusal the G3 teardowns make on an ambiguous match: granting a
            # workspace role to an arbitrary identity is worse than not granting one.
            Write-Host "::error title=Ambiguous data-api identity::Found $($ids.Count) identities matching 'data-api' in $env:RG_APPS ($(($ids | ForEach-Object { $_.name }) -join ', ')). Refusing to grant the Fabric workspace role to an arbitrary one."
            exit 1
          }

          $principalId = $ids[0].principalId
          Write-Host "Resolved data-api identity '$($ids[0].name)' -> principal $principalId."

          # The Fabric roleAssignments API wants the identity's PRINCIPAL (object)
          # id, which is what `az identity show/list` returns as principalId - not
          # the clientId the container app consumes.
          $token = az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv
          Assert-AzSucceeded -What 'az account get-access-token (Fabric)'
          if ([string]::IsNullOrWhiteSpace($token)) {
            Write-Host '::error title=Fabric token acquisition failed::Could not mint a Fabric API token for the F24 grant.'
            exit 1
          }

          # Reuses the script rather than re-implementing the grant: it already
          # checks Get-FabricWorkspaceRoleAssignment before POSTing, so a replay is
          # a no-op.
          #
          # KNOWN SIDE EFFECT, stated rather than buried: provision-workspace.ps1 is
          # create-if-absent for the workspace and lakehouse as well as the grant. On
          # the normal path this is inert - infra-up.yml runs L5 first, so both
          # already exist and the script reuses them. But a STANDALONE layer-07
          # dispatch, on a tenant where FABRIC_CAPACITY_ID is set and L5 has never
          # run, will create the 'mls-operations' workspace and lakehouse from here.
          # They are the same artifacts L5 would have created, so this is recoverable
          # rather than divergent, but L7 provisioning L5's artifacts is surprising
          # and is called out in docs/runbooks/layers/L07.md.
          ./infra/fabric/provision-workspace.ps1 `
            -Token $token `
            -CapacityId $env:FABRIC_CAPACITY_ID `
            -DataApiPrincipalId $principalId `
            -Confirm:$false

          Write-Host "F24: data-api holds the Fabric workspace Viewer role."

      - name: Report a failed F24 grant pass
        if: ${{ !inputs.dry_run && steps.f24_grant.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### F24 Fabric grant did not complete"
            echo
            echo "The post-L7 Fabric workspace Viewer grant for \`data-api\` did not apply. The deployment itself succeeded and this does not block the Verifier, but \`data-api\` in cloud mode will 403 on every lakehouse read until the grant lands."
            echo
            # shellcheck disable=SC2016  # backticks are markdown code-span syntax; no expansion wanted
            echo 'Apply it by hand: `infra/fabric/provision-workspace.ps1 -Token <fabric-token> -CapacityId <id> -DataApiPrincipalId <principalId>`'
          } >> "${GITHUB_STEP_SUMMARY}"


      # ---------------------------------------------------------------------
      # F19 (compliance/findings/2026-08-26-prepublication-review.md#f19): the
      # cost-ingest Function's Fabric workspace grant — the write half of the
      # FinOps leg, and the last of F13's seven workload grants to land.
      #
      # WHY AN L6-CREATED IDENTITY IS GRANTED FROM THE L7 WORKFLOW. The identity
      # is provisioned by infra/bicep/platform/main.bicep at L6, so the obvious
      # home for this is layer-06-platform.yml. It cannot be: infra-up.yml runs L5
      # and L6 IN PARALLEL, so at L6 time the Fabric workspace may not exist yet,
      # and provision-workspace.ps1 is create-if-absent — calling it from L6 would
      # race L5 to create the same workspace. L7 needs L6 and, on the normal path,
      # follows L5, which makes it the first point in the graph where both the
      # identity and the workspace exist. That is the same ordering argument the
      # F20 and F24 steps above make for their own grants, one layer over.
      #
      # NOT VIEWER. This is the only workspace grant in the estate that is not
      # read-only: the Function writes cost_daily into OneLake, and Contributor is
      # the lowest of Fabric's four workspace roles that can write. The full
      # argument lives at the grant itself, in infra/fabric/provision-workspace.ps1's
      # grant table, and is asserted by role string (not by comment) in
      # infra/fabric/tests/provision-workspace.Tests.ps1.
      #
      # Placement and failure posture are identical to the F20/F24 steps: after
      # the V7.1 manifest is written AND uploaded, and continue-on-error, because
      # `verify` needs `deploy` to succeed and an idempotent remediation step must
      # not cost the layer its sign-off.
      # ---------------------------------------------------------------------
      - name: Grant cost-ingest the Fabric workspace Contributor role now that the identity exists (F19)
        id: f19_grant
        if: ${{ !inputs.dry_run && vars.FABRIC_CAPACITY_ID != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          RG_OPS: ${{ steps.names.outputs.rg-ops }}
          FABRIC_CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-AzSucceeded {
            param([Parameter(Mandatory)][string]$What)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Azure CLI call failed::$What returned exit code $LASTEXITCODE. This is NOT the same as 'the identity does not exist yet' - it is a CLI, auth or throttling failure, and the F19 Fabric grant did not run."
              exit 1
            }
          }

          # mls-rg-ops, not mls-rg-apps: the cost-ingest identity is an L6 resource
          # that lives next to the cost-export storage it reads. Resolved by shape
          # rather than by a hardcoded name, so naming.bicep keeps owning the
          # prefix and env (CLAUDE.md).
          $ids = @(
            az identity list --resource-group $env:RG_OPS --query "[?contains(name, 'cost-ingest')].{name:name, principalId:principalId}" -o json |
              ConvertFrom-Json
          )
          Assert-AzSucceeded -What 'az identity list'

          if ($ids.Count -eq 0) {
            Write-Host "::warning title=cost-ingest identity not found::No user-assigned identity matching 'cost-ingest' in $env:RG_OPS. Skipping the F19 Fabric workspace grant - L6 has probably not deployed yet on a standalone L7 run."
            exit 0
          }
          if ($ids.Count -gt 1) {
            Write-Host "::error title=Ambiguous cost-ingest identity::Found $($ids.Count) identities matching 'cost-ingest' in $env:RG_OPS ($(($ids | ForEach-Object { $_.name }) -join ', ')). Refusing to grant a WRITE role on the Fabric workspace to an arbitrary one."
            exit 1
          }

          # The Fabric roleAssignments API wants the identity's PRINCIPAL (object)
          # id, which is what `az identity list` returns as principalId - not the
          # clientId the Function App consumes as AZURE_CLIENT_ID.
          $principalId = $ids[0].principalId
          Write-Host "Resolved cost-ingest identity '$($ids[0].name)' -> principal $principalId."

          $token = az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv
          Assert-AzSucceeded -What 'az account get-access-token (Fabric)'
          if ([string]::IsNullOrWhiteSpace($token)) {
            Write-Host '::error title=Fabric token acquisition failed::Could not mint a Fabric API token for the F19 grant.'
            exit 1
          }

          # Same script, same create-if-absent semantics and the same known side
          # effect the F24 step documents: on a standalone L7 dispatch where L5 has
          # never run, this will create the workspace and lakehouse from here.
          ./infra/fabric/provision-workspace.ps1 `
            -Token $token `
            -CapacityId $env:FABRIC_CAPACITY_ID `
            -CostIngestPrincipalId $principalId `
            -Confirm:$false

          Write-Host "F19: cost-ingest holds the Fabric workspace Contributor role."

      - name: Report a failed F19 grant pass
        if: ${{ !inputs.dry_run && steps.f19_grant.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### F19 Fabric grant did not complete"
            echo
            echo "The post-L7 Fabric workspace Contributor grant for \`cost-ingest\` did not apply. The deployment itself succeeded and this does not block the Verifier, but the cost-ingest Function will 403 on every OneLake write until the grant lands, and \`cost_daily\` will hold only the L5 synthetic history."
            echo
            # shellcheck disable=SC2016  # backticks are markdown code-span syntax; no expansion wanted
            echo 'Apply it by hand: `infra/fabric/provision-workspace.ps1 -Token <fabric-token> -CapacityId <id> -CostIngestPrincipalId <principalId>`'
          } >> "${GITHUB_STEP_SUMMARY}"

      # ---------------------------------------------------------------------
      # F36, second half — the redirect-URI chicken-and-egg, closed here.
      #
      # Easy Auth's reply URL is https://<that app's own ingress FQDN>/.auth/login/aad/callback,
      # and the FQDN does not exist until the container app is deployed. That is
      # why docs/runbooks/layers/L03.md used to end with a manual "register the
      # apps here, run L7, then add the redirect URIs by hand" — an adopter's
      # first sign-in would otherwise fail AADSTS50011 (reply URL mismatch) on a
      # correctly deployed estate. The apps have just deployed and their FQDNs
      # are in l7-manifest.json, so this registers each one now.
      #
      # MERGE, NEVER OVERWRITE. `az ad app update --web-redirect-uris` REPLACES
      # the whole list, so writing only the URI this run computed would silently
      # drop every other one — including a still-working URI from a previous
      # environment whose FQDN changed on a kill/rebuild, leaving a dashboard
      # that 400s at login with nothing in the log to say why. Existing URIs are
      # read first and kept, and a URI that is already present is a no-op this
      # step says out loud rather than a redundant Graph write.
      #
      # Placement and failure posture are deliberately identical to the F20 and
      # F24 steps above, and for the same two reasons: it runs AFTER the V7.1
      # manifest is written and uploaded (those steps carry no always(), so a
      # hard failure here would skip them and the Verifier would have no
      # manifest), and it carries continue-on-error because `verify` needs
      # `deploy` to SUCCEED — an idempotent remediation must never fail a
      # deployment that otherwise worked. Failures are annotated and summarised
      # rather than swallowed.
      #
      # An app whose client ID did not resolve is SKIPPED, not failed: it
      # deployed with internal ingress and has no Easy Auth provider to give a
      # reply URL to, and the step above has already said so loudly.
      # ---------------------------------------------------------------------
      - name: Register each dashboard's Easy Auth redirect URI now that its FQDN exists (F36)
        id: redirect_uris
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        shell: pwsh
        env:
          LAUNCH_OPS_APP_ID: ${{ steps.easy_auth.outputs.launch-ops-app-id }}
          CONTROL_TOWER_APP_ID: ${{ steps.easy_auth.outputs.control-tower-app-id }}
          COMPLIANCE_APP_ID: ${{ steps.easy_auth.outputs.compliance-app-id }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-AzSucceeded {
            param([Parameter(Mandatory)][string]$What)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=Azure CLI call failed::$What returned exit code $LASTEXITCODE. The apps deployed; only the Easy Auth redirect URI registration did not. Sign-in will fail with AADSTS50011 until each app registration lists https://<that app's fqdn>/.auth/login/aad/callback."
              exit 1
            }
          }

          # The deployment's own outputs, not values reconstructed from workflow
          # variables: these are the FQDNs ARM actually assigned.
          $outputs = Get-Content -LiteralPath 'l7-manifest.json' -Raw | ConvertFrom-Json

          $targets = @(
            @{ Name = 'launch-ops'; AppId = $env:LAUNCH_OPS_APP_ID; Fqdn = $outputs.launchOpsFqdn.value }
            @{ Name = 'control-tower'; AppId = $env:CONTROL_TOWER_APP_ID; Fqdn = $outputs.controlTowerFqdn.value }
            @{ Name = 'compliance'; AppId = $env:COMPLIANCE_APP_ID; Fqdn = $outputs.complianceFqdn.value }
          )

          foreach ($target in $targets) {
            if ([string]::IsNullOrWhiteSpace($target.AppId)) {
              Write-Host "$($target.Name): no Entra client ID resolved, so it deployed with internal ingress and has no Easy Auth provider to give a reply URL to. Skipping."
              continue
            }
            if ([string]::IsNullOrWhiteSpace($target.Fqdn)) {
              Write-Host "::warning title=No ingress FQDN for $($target.Name)::The L7 deployment outputs carried no FQDN for this app, so its Easy Auth redirect URI could not be registered."
              continue
            }

            $redirectUri = "https://$($target.Fqdn)/.auth/login/aad/callback"

            $existingJson = (az ad app show --id $target.AppId --query 'web.redirectUris' -o json) -join "`n"
            Assert-AzSucceeded -What "az ad app show --id $($target.AppId)"

            $existing = @()
            if ($existingJson -and $existingJson.Trim() -and $existingJson.Trim() -ne 'null') {
              $existing = @(@($existingJson | ConvertFrom-Json) | Where-Object { $_ -and ([string]$_).Trim() })
            }

            if ($existing -contains $redirectUri) {
              Write-Host "$($target.Name): redirect URI already registered ($redirectUri). Nothing to do."
              continue
            }

            # MERGE: everything already registered stays, this run only ADDS.
            $merged = @($existing) + @($redirectUri)
            az ad app update --id $target.AppId --web-redirect-uris $merged | Out-Null
            Assert-AzSucceeded -What "az ad app update --id $($target.AppId)"
            Write-Host "$($target.Name): registered $redirectUri (the app now lists $($merged.Count) redirect URI(s))."
          }

      # Surfaces the step above when it fails. continue-on-error keeps the job
      # green on purpose, which also makes a failure easy to scroll past; this
      # puts it in the run summary where the sponsor actually looks - the same
      # companion the F20 and F24 steps carry.
      - name: Report a failed redirect-URI registration
        if: ${{ !inputs.dry_run && steps.redirect_uris.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Easy Auth redirect URIs were not registered"
            echo
            echo "The apps deployed and this does not block the Verifier, but signing in to a dashboard will fail with **AADSTS50011** (reply URL mismatch) until each app registration lists its own callback URL."
            echo
            # shellcheck disable=SC2016  # backticks are markdown code-span syntax; no expansion wanted
            echo 'Add it by hand, per app: `az ad app update --id <appId> --web-redirect-uris <every existing URI> https://<that app fqdn>/.auth/login/aad/callback` — list the EXISTING URIs too, because the flag replaces the whole list.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload L7 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-07-apps
          # l7-manifest.json is deliberately NOT here (F4, Task 8): it carries
          # container app resource IDs (each embedding the subscription ID)
          # and data-api's internal-only origin, and artifacts on a public
          # repo are downloadable without authentication.
          # l7-verifier-manifest.json is non-sensitive (app names and image
          # digests only) and stays — it is also uploaded separately as
          # layer-07-deploy-manifest for the verify job to download.
          path: |
            what-if-l7.txt
            l7-verifier-manifest.json
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify L7 (mls-verifier)
    needs: [preflight, deploy]
    if: ${{ needs.preflight.outputs.configured == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: verify
    # V7.5 observes 0 -> N -> 0 per app and waits 15 minutes before its phase-3
    # read, giving up at +30. Two apps, so the audit alone can run for an hour;
    # that wait is synchronous by design (kill-rebuild.md section 5 does not
    # exclude it) and it is the criterion, not overhead.
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    env:
      # Read token for V7.4's `gh pr view` / check-runs reads. The Verifier's own
      # least-privilege PAT when the human provisioned one; otherwise the
      # run-scoped GITHUB_TOKEN, which GitHub mints per run and stores nowhere —
      # so "CI holds no stored secret" still holds either way.
      MLS_VERIFIER_GH_TOKEN: ${{ secrets.MLS_VERIFIER_GH_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.MLS_VERIFIER_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Verifier identity not configured
        if: ${{ needs.preflight.outputs.verifier != 'true' }}
        run: |
          set -euo pipefail
          echo "::notice title=L7 not independently verified::AZURE_VERIFIER_CLIENT_ID is not set on the demo environment, so verification/layer-07-audit.ps1 was skipped rather than run as the deployer SP."

      # V7.2 shells out to `npm --prefix apps/shared/spec-renderer run
      # validate:golden` from the audited commit. Without the toolchain and the
      # workspace install that criterion fails on a missing binary rather than on
      # a bad fixture.
      - uses: actions/setup-node@v7
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies (V7.2 runs the golden-spec validator)
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        run: npm ci

      - name: Azure login (OIDC, mls-verifier — Reader only)
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download the V7.1 deploy manifest
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: layer-07-deploy-manifest
          path: l7-manifest

      # V7.3 needs the Log Analytics workspace CUSTOMER id (a GUID), which is an
      # L6 output. Rather than plumb the L6 deployment outputs across a workflow
      # boundary, the Verifier reads it from ARM under its own Reader credential —
      # the same identity that then runs the KQL query.
      - name: Resolve the Log Analytics customer id
        id: law
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        env:
          RG_PLATFORM: ${{ steps.names.outputs.rg-platform }}
          LAW_NAME: ${{ steps.names.outputs.law }}
        run: |
          set -euo pipefail
          customer_id="$(az monitor log-analytics workspace show \
            --resource-group "${RG_PLATFORM}" --workspace-name "${LAW_NAME}" \
            --query customerId -o tsv 2>/dev/null || true)"
          if [ -z "${customer_id}" ]; then
            echo "::warning title=Log Analytics workspace not readable::Could not resolve the customer id for ${LAW_NAME} in ${RG_PLATFORM}. V7.3 will report that no workspace id was available."
          fi
          echo "customer-id=${customer_id}" >> "${GITHUB_OUTPUT}"

      # -AppName is deliberately left at the script's default: `pwsh -File`
      # cannot bind a string[] (a comma-joined value arrives as ONE element and a
      # space-separated one silently drops the tail), and the default already
      # names both frontends. The Ask tab is not part of any L7 criterion.
      - name: Run verification/layer-07-audit.ps1
        id: audit
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: ./.github/actions/layer-audit
        with:
          layer: '07'
          args: |
            -ResourceGroupName
            ${{ steps.names.outputs.rg-apps }}
            -DeployManifestPath
            l7-manifest/l7-verifier-manifest.json
            -Repository
            ${{ github.repository }}
            ${{ steps.law.outputs.customer-id && '-LogAnalyticsWorkspaceId' || '' }}
            ${{ steps.law.outputs.customer-id }}
            ${{ (inputs.canary_pr || vars.MLS_L7_CANARY_PR) && '-CanaryPrNumber' || '' }}
            ${{ inputs.canary_pr || vars.MLS_L7_CANARY_PR }}

      - name: Upload audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-07-audit-report
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30
