name: infra-down

# =============================================================================
# RG-scoped teardown of the demo estate. `scripts/down.ps1` is the local wrapper.
# Runbook: docs/runbooks/kill-rebuild.md § 2 ("down.ps1 — semantics").
#
# ---------------------------------------------------------------------------
# GATE-FREE BY DESIGN — and there is no confirmation input on purpose.
#
# CLAUDE.md hard rule 2: "RG-scoped teardown of demo resources is gate-free by
# design." kill-rebuild.md § 2: "Idempotent, order-safe, no confirmation prompt."
# The whole demo rests on being able to destroy the estate on a whim, so adding
# friction here would break the showpiece, not protect it. Money is disposable;
# identity is not — and this workflow cannot reach identity.
#
# THE LINE THIS WORKFLOW NEVER CROSSES (kill-rebuild.md § 1). Nothing below
# touches, and no code path here can reach:
#   * Entra users / groups / CA policies / app registrations (L3)
#   * Purview labels and their GUIDs (L4)
#   * the Fabric workspace SHELL `mls-operations` and its role assignments
#   * the Fabric capacity itself, MG `mls`, policy + NIST assignments, the budget
#   * the OIDC federation on mls-github-deployer, mls-verifier, this repo
# All of those are G3 and live in separate scripts (infra/*/teardown.ps1).
#
# Order (kill-rebuild.md § 2): Fabric items -> capacity pause -> cost-export
# definition -> four parallel RG deletes. Each stage runs even if an earlier one
# stumbles (`!cancelled()`), because a half-finished teardown that strands a
# billable RG is worse than a noisy one — the stage that failed still fails the
# run, so nothing is hidden.
#
# Stage 1 is `infra/fabric/teardown-items.ps1`, which deletes every ITEM in the
# workspace — the lakehouse, its Delta tables, and (since 2026-08-24) the Fabric
# data agent, which is a workspace item too. It is called through a Test-Path
# guard on purpose: see the note on that step.
#
# The `cost-export` stage removes the subscription-scope daily export that feeds
# `apps/cost-ingest`. Both the export definition and the Function die here — the
# Function with `mls-rg-platform`, the definition by name — so nothing is left
# pointing at deleted storage, and `infra-up` recreates both on replay.
#
# PRE-G0 GUARD: same as infra-up — before the `demo` environment variables exist
# every job skips and the run is green.
# ---------------------------------------------------------------------------
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      skip_fabric:
        description: 'Skip the Fabric item delete + capacity pause (RG deletes only)'
        type: boolean
        default: false
      hard_delete:
        description: >-
          Purge Fabric workspace items instead of tombstoning them. Needs the workspace
          ADMIN role, so it is off by default — a teardown must not fail on a permission
          it does not strictly need. Use it if a rebuild ever hits the workspace item cap.
        type: boolean
        default: false

      only_criterion:
        description: >-
          Verify only these criteria, e.g. `V11.2` or `V11.1,V11.3`. Everything else
          reports SKIP and the audit exits 3 - a DIAGNOSTIC, never a sign-off. Re-testing
          one criterion should not cost a whole audit's wall clock (P-10). Leave empty for
          a verdict.
        type: string
        required: false
        default: ''
permissions:
  contents: read

concurrency:
  group: mls-demo-estate
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight (demo environment guard)
    runs-on: ubuntu-latest
    # Bounded: reads repository variables and nothing else. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 10
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      missing: ${{ steps.guard.outputs.missing }}
      verifier: ${{ steps.verifier.outputs.configured }}
      # No `tenant-audits` output: it is decided inside the `verify` job now, which is
      # the only job that can see the certificate it depends on (F170, above).
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: infra-down (estate teardown)

      # The down-state audit is the cycle's honesty checkpoint (L11.md deploy
      # step 2), so it needs the read-only identity like every other audit.
      - id: verifier
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: post-down verification (mls-verifier)

      # THE TENANT-AUDIT GUARD IS NOT HERE ANY MORE, AND THAT IS THE FIX (F170).
      #
      # It used to live in this job, which declares `environment: demo`, and it read
      # `secrets.MLS_VERIFIER_CERT_BASE64` — a secret that lives on the `verify`
      # environment, not `demo`. An absent GitHub secret is the EMPTY STRING, not an
      # error, so the guard reported "not configured" on every single run, the audit was
      # always invoked with `-SkipChildAudit`, and V11.2 recorded SKIP every time while
      # this workflow reported green and L11's scorecard row read "verified".
      #
      # Measured 2026-09-03 on run 33705808526:
      #     [PASS] V11.1  All RGs absent post-down
      #     [SKIP] V11.2  Tenant objects intact (L3/L4 audits still pass)
      #            observed: child audits skipped by -SkipChildAudit
      #
      # So the one criterion that proves a teardown did NOT cross the G3 tenant-object
      # line has never had evidence. That is F123's class (a secret that cannot be seen
      # by the job that reads it) and F125's (a guard whose "skip when unconfigured"
      # meant "skip always"), and it is worse here than in either: this criterion is the
      # kill/rebuild cycle's honesty checkpoint.
      #
      # The guard now runs INSIDE the `verify` job, which declares `environment: verify`
      # and can therefore see both the certificate AND every variable the child audits
      # need (MLS_TENANT_DOMAIN, MLS_VERIFIER_APP_ID and AZURE_VERIFIER_CLIENT_ID are all
      # present on that environment — checked, not assumed). Deciding it in the job that
      # consumes it also removes the cross-job hop that hid the mismatch.

  fabric:
    name: Fabric items + capacity pause
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' && !inputs.skip_fabric }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    env:
      FABRIC_CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete workspace items (workspace shell and roles survive)
        shell: pwsh
        env:
          HARD_DELETE: ${{ inputs.hard_delete }}
        run: |
          $ErrorActionPreference = 'Stop'
          # kill-rebuild.md § 2 step 1. The Test-Path guard stays even though the
          # script now exists: this workflow must stay green on a partial checkout
          # or a branch where the file has not merged yet, and a teardown that
          # cannot delete items is a NOTICE (OneLake storage pennies, visible to
          # verification/layer-11-audit.ps1's down-state check) rather than a
          # reason to strand four billable resource groups.
          $script = 'infra/fabric/teardown-items.ps1'
          if (-not (Test-Path $script)) {
            Write-Host "::notice title=Fabric item teardown unavailable::$script does not exist on this ref; workspace items were NOT deleted. The RG deletes below still run."
            exit 0
          }
          $token = az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Could not obtain a Fabric API token.' }

          # -Confirm:$false because the whole cycle is gate-free by design.
          # -HardDelete is opt-in: purging needs the workspace ADMIN role, and a
          # teardown that fails on a permission it does not strictly need is worse
          # than one that leaves a recoverable tombstone.
          $teardownArgs = @{ Token = $token }
          if ($env:HARD_DELETE -eq 'true') { $teardownArgs['HardDelete'] = $true }
          & $script @teardownArgs -Confirm:$false

      - name: Pause the Fabric capacity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          case "${FABRIC_CAPACITY_ID}" in
            /subscriptions/*)
              az resource invoke-action --ids "${FABRIC_CAPACITY_ID}" --action suspend
              echo "Paid capacity suspended (\$0 from here)."
              ;;
            *)
              echo "Trial capacity — pause is a no-op (\$0 either way)."
              ;;
          esac

  cost-export:
    name: remove the cost-export definition
    needs: [preflight, fabric]
    if: ${{ !cancelled() && needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete the subscription-scope daily export
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          set -euo pipefail
          # Removed so it never points at deleted storage (kill-rebuild.md § 1).
          # Idempotent: a missing export is a no-op, not an error.
          export_name="${PREFIX}-cost-daily"
          scope="/subscriptions/${AZURE_SUBSCRIPTION_ID}"
          if az costmanagement export show --name "${export_name}" --scope "${scope}" >/dev/null 2>&1; then
            az costmanagement export delete --name "${export_name}" --scope "${scope}" --yes
            echo "Deleted cost export ${export_name}."
          else
            echo "Cost export ${export_name} not present — nothing to delete."
          fi

  resource-groups:
    name: delete the four demo resource groups
    needs: [preflight, cost-export]
    if: ${{ !cancelled() && needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------------------------------------
      # F107 - PURGE THE WORKSPACE, DO NOT LET THE RG DELETE SOFT-DELETE IT.
      #
      # Log Analytics workspaces soft-delete for 14 days. `az group delete` does
      # NOT destroy the workspace inside it; it soft-deletes it. Recreating a
      # workspace with the same name in the same resource group then RECOVERS the
      # old one rather than creating a new one - and the recovered workspace sits
      # in a state ARM reports as `Succeeded` while the scheduled-query-rule
      # provider still refuses it:
      #
      #   l6-alert-kv   BadRequest: The workspace could not be found
      #   l6-alert-sql  BadRequest: The workspace could not be found
      #
      # Measured on 2026-09-01 rather than assumed. Forty minutes after the
      # rebuild recovered it, the workspace was STILL listed by
      # `list-deleted-workspaces` while simultaneously live, with a createdDate
      # PREDATING the teardown and its original customerId intact. That is not
      # propagation settling - it is a stable contradiction, so waiting it out
      # (the cheaper candidate fix) would have waited forever.
      #
      # So the teardown purges. `--force` removes the workspace WITHOUT the
      # recovery option, which is a real trade and worth stating: a 14-day undo
      # is forfeited. It is the right trade here because this estate's central
      # claim is that it can be destroyed and rebuilt from code - a recovery net
      # for telemetry that is entirely reproducible buys nothing, and costs the
      # rebuild. Anyone who wants the net back should keep the workspace outside
      # the four demo resource groups, not soften this step.
      #
      # Runs BEFORE the resource groups go, because the workspace has to still
      # exist to be purged. Failure is a WARNING, not a stop: a teardown that
      # refuses to proceed because an optional purge failed is worse than one
      # that leaves a soft-deleted workspace behind and says so.
      # ---------------------------------------------------------------------
      - name: Purge the Log Analytics workspace so the rebuild gets a new one (F107)
        env:
          RG_PLATFORM: ${{ steps.names.outputs.rg-platform }}
          LAW_NAME: ${{ steps.names.outputs.law }}
        run: |
          set -uo pipefail
          if ! az monitor log-analytics workspace show \
                 --resource-group "${RG_PLATFORM}" --workspace-name "${LAW_NAME}" >/dev/null 2>&1; then
            echo "${LAW_NAME} is not present in ${RG_PLATFORM}; nothing to purge."
            exit 0
          fi

          # Captured BEFORE the delete because it is the only value that can tell a
          # genuinely new workspace from a recovered one (F167). Printed for the operator
          # and the rebuild to compare against; see the post-condition block below.
          old_customer_id="$(az monitor log-analytics workspace show \
                               --resource-group "${RG_PLATFORM}" --workspace-name "${LAW_NAME}" \
                               --query customerId -o tsv 2>/dev/null || echo 'unknown')"
          echo "Pre-purge customerId: ${old_customer_id}"

          echo "Purging ${LAW_NAME} (--force: no 14-day recovery, so the rebuild creates a NEW workspace)."
          if az monitor log-analytics workspace delete \
               --resource-group "${RG_PLATFORM}" --workspace-name "${LAW_NAME}" --force --yes; then
            echo "Purged."
          else
            echo "::warning title=Workspace purge failed::Could not purge ${LAW_NAME}. The resource-group delete below will SOFT-delete it instead, and the next rebuild will recover it - at which point L6's alert rules fail with 'The workspace could not be found' (F107). Purge it by hand before rebuilding: az monitor log-analytics workspace delete -g ${RG_PLATFORM} -n ${LAW_NAME} --force --yes"
          fi

          # F167 - DO NOT ASSERT THE PURGE FROM `list-deleted-workspaces`. IT CANNOT SEE IT.
          #
          # This block used to read that list and, finding the workspace still in it, emit
          # "a same-name rebuild will RECOVER it and L6's alert rules will fail (F107)".
          # That warning was FALSE, and it was false on EVERY run: `--force` purges the
          # workspace but leaves a tombstone in the deleted list. Measured 2026-09-03 - the
          # tombstone for customerId 5c967cf4 was still listed while a NEW same-name
          # workspace (87f95e84) ran live in the same resource group, and both scheduled-
          # query alert rules - the exact things F107 broke - deployed clean.
          #
          # So the old check could only ever report the hazard as PRESENT, which is the
          # worse half of CLAUDE.md's rule: "an auditor that cannot see a control must not
          # be able to report it as PRESENT either." It cost real time on the run that
          # found it: it read as an F107 regression and nearly earned a hand-purge, which
          # would have made the run green and taught nothing.
          #
          # What DOES distinguish a new workspace from a recovered one is the LIVE
          # workspace's customerId - which is what F107's own entry recorded ("its original
          # customerId intact") and never encoded as a check. So assert the two things
          # observable from HERE, and hand the rebuild the value it needs to finish the job.
          if az monitor log-analytics workspace show \
               --resource-group "${RG_PLATFORM}" --workspace-name "${LAW_NAME}" >/dev/null 2>&1; then
            echo "::warning title=Workspace still live::${LAW_NAME} is still present in ${RG_PLATFORM} after the purge returned. The RG delete below will soft-delete it instead, and the rebuild may recover it (F107)."
          else
            echo "${LAW_NAME} is gone from ${RG_PLATFORM}."
          fi

          # The post-condition the rebuild must check. A tombstone in
          # list-deleted-workspaces is NOT evidence either way - only this value is.
          {
            echo "### Log Analytics workspace purged (F107)"
            echo
            echo "Pre-purge \`customerId\`: \`${old_customer_id}\`"
            echo
            echo "The rebuild must create a workspace with a DIFFERENT \`customerId\`."
            echo "A same value means the purge did not take and the rebuild RECOVERED the"
            echo "old workspace, at which point L6's alert rules fail with"
            echo "\`The workspace could not be found\`. A tombstone left in"
            echo "\`az monitor log-analytics workspace list-deleted-workspaces\` is expected"
            echo "after \`--force\` and is NOT evidence of a failed purge (F167)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete in parallel, then wait for the estate to drain
        timeout-minutes: 45
        env:
          RG_LIST: ${{ steps.names.outputs.rg-list }}
          PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          set -euo pipefail
          read -r -a rgs <<< "${RG_LIST}"

          # Empty or missing RGs no-op harmlessly: down is safe to re-run at any
          # time, from any state (kill-rebuild.md § 2 step 4).
          for rg in "${rgs[@]}"; do
            if az group exists --name "${rg}" | grep -q true; then
              echo "Deleting ${rg}"
              az group delete --name "${rg}" --yes --no-wait
            else
              echo "${rg} already absent."
            fi
          done

          echo "Waiting for deletes to drain..."
          deadline=$(( $(date +%s) + 2400 ))
          while true; do
            remaining=""
            for rg in "${rgs[@]}"; do
              if az group exists --name "${rg}" | grep -q true; then
                remaining="${remaining} ${rg}"
              fi
            done
            if [ -z "${remaining}" ]; then
              echo "All demo resource groups are gone."
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error title=RG delete stuck::Still present after 40 minutes:${remaining}. See kill-rebuild.md failure mode 2 (locks, Key Vault soft-delete, resources in Failed state)."
              exit 1
            fi
            echo "Still deleting:${remaining}"
            sleep 30
          done

          {
            echo "## Estate torn down"
            echo
            echo "Deleted: \`${RG_LIST}\`"
            echo
            echo "Persisted by design (G3 to touch): Entra objects, Purview labels,"
            echo "the Fabric workspace shell and capacity, MG \`${PREFIX}\` + policy"
            echo "assignments, the budget, the OIDC federation, and this repo."
            echo
            echo "Down-state audit: \`verification/layer-11-audit.ps1\` (down half),"
            echo "plus \`layer-03-audit.ps1\` and \`layer-04-audit.ps1\` which must"
            echo "still PASS — a regression there means the teardown crossed the line."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # THE DOWN-STATE AUDIT — "the cycle's honesty checkpoint" (L11.md deploy step 2:
  # it must PASS before up.ps1 starts). Two criteria are measurable in this phase:
  #
  #   V11.1  every mls-rg-* resource group absent      — the teardown worked
  #   V11.2  the L3 and L4 audits still PASS           — it did not go too far
  #
  # V11.3/V11.4/V11.5 are post-up criteria; the audit records them SKIP with that
  # reason rather than omitting the ids, so the down-state report still accounts
  # for all five.
  #
  # A regression in V11.2 means the teardown crossed the tenant-object line, which
  # is simultaneously a G3-boundary violation and a G4 event — so it fails this
  # run loudly rather than being left for someone to notice later.
  # ---------------------------------------------------------------------------
  verify:
    name: verify down-state (mls-verifier)
    needs: [preflight, fabric, cost-export, resource-groups]
    if: >-
      ${{ always()
          && needs.preflight.outputs.configured == 'true'
          && needs.preflight.outputs.verifier == 'true'
          && needs.resource-groups.result == 'success' }}
    runs-on: ubuntu-latest
    environment: verify
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Consumed by the CHILD L3/L4 audits, which layer-11-audit.ps1 launches in
      # their own pwsh processes with only -ReportRoot/-NoRetry. They inherit this
      # environment, and every input they need has an environment-variable
      # fallback — which is the only channel available across that boundary.
      MLS_REPOSITORY: ${{ github.repository }}
      MLS_TENANT_DOMAIN: ${{ vars.MLS_TENANT_DOMAIN || vars.ENTRA_DOMAIN }}
      TENANT_DOMAIN: ${{ vars.MLS_TENANT_DOMAIN || vars.ENTRA_DOMAIN }}
      MLS_VERIFIER_APP_ID: ${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
      MLS_ENTRA_MANIFEST: infra/entra/manifest.json
      MLS_LABEL_GUID_PATH: verification/reports/label-guids.json
      MLS_VERIFIER_GH_TOKEN: ${{ secrets.MLS_VERIFIER_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      # Decided HERE, not in preflight, because this job declares `environment: verify`
      # and is therefore the only one that can see MLS_VERIFIER_CERT_BASE64 at all (F170).
      # V11.2 re-executes the L3 and L4 audits to prove the teardown did not cross the
      # tenant-object line; those two need the tenant domain and the Security & Compliance
      # app-only certificate. Without them the audit still records SKIP rather than failing
      # a teardown that worked — but it now records SKIP because the certificate is
      # genuinely absent, not because the job was looking in the wrong environment.
      - id: tenant
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          additional: |
            MLS_TENANT_DOMAIN=${{ vars.MLS_TENANT_DOMAIN || vars.ENTRA_DOMAIN }}
            MLS_VERIFIER_APP_ID=${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
            MLS_VERIFIER_CERT_BASE64=${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
          layer: post-down tenant-object audits (V11.2 re-runs L3 + L4)

      - name: Azure login (OIDC, mls-verifier — Reader / Directory.Read.All)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install ExchangeOnlineManagement (pinned)
        if: ${{ steps.tenant.outputs.configured == 'true' }}
        uses: ./.github/actions/install-exo

      - name: Stage the mls-verifier certificate for the child L4 audit
        id: cert
        if: ${{ steps.tenant.outputs.configured == 'true' }}
        shell: pwsh
        env:
          MLS_VERIFIER_CERT_BASE64: ${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
        run: |
          # A FILE, NOT THE CERTIFICATE STORE. This used to import the PFX into
          # CurrentUser\My and hand Connect-IPPSSession a thumbprint, reasoning that
          # .NET implements that store on Linux. The store part was true and the
          # conclusion was not: `-CertificateThumbprint` is a Windows-only DYNAMIC
          # parameter of Connect-IPPSSession, so on ubuntu-latest the audit died at
          # parameter binding having never opened a connection, and nobody saw it for
          # the life of the project because this job had never once run (F170/F171/F172).
          #
          # `-CertificateFilePath` is added on every platform, and is what L4's apply
          # job - the one that genuinely works - has always used. The PFX therefore
          # stays on disk in RUNNER_TEMP until the audit has read it, and is removed
          # by the cleanup step below whatever the audit's verdict.
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mls-verifier.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MLS_VERIFIER_CERT_BASE64))
          "MLS_VERIFIER_CERT_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Staged the mls-verifier PFX at $pfxPath ($((Get-Item $pfxPath).Length) bytes)."

      - name: Tenant-object audits unavailable
        if: ${{ steps.tenant.outputs.configured != 'true' }}
        run: |
          set -euo pipefail
          echo "::warning title=V11.2 will record SKIP::MLS_TENANT_DOMAIN and/or the mls-verifier Security & Compliance certificate are not configured, so the L3 and L4 child audits cannot run and V11.2 has no evidence. The audit is invoked with -SkipChildAudit, which records SKIP with that reason — it does NOT pass. V11.1 (all resource groups absent) is still verified."

      - name: Run verification/layer-11-audit.ps1 (down phase)
        id: audit
        uses: ./.github/actions/layer-audit
        # The child L4 audit reads this; a path is not a secret and a password is, so
        # the path goes through GITHUB_ENV above and the password comes in here.
        env:
          MLS_VERIFIER_CERT_PASSWORD: ${{ secrets.MLS_VERIFIER_CERT_PASSWORD }}
        with:
          layer: '11'
          args: |
            -Phase
            Down
            -SubscriptionId
            ${{ vars.AZURE_SUBSCRIPTION_ID }}
            -ResourceGroupPrefix
            ${{ steps.names.outputs.prefix }}-rg-
            -Repository
            ${{ github.repository }}
            ${{ steps.tenant.outputs.configured == 'true' && '' || '-SkipChildAudit' }}

            ${{ inputs.only_criterion && '-OnlyCriterion' || '' }}
            ${{ inputs.only_criterion }}
      - name: Remove the staged certificate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mls-verifier.pfx'
          if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }

      - name: Upload the down-state audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-11-audit-report-down
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: run summary
    needs: [preflight, fabric, cost-export, resource-groups, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Bounded: collates results already produced. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 15
    steps:
      - name: Write the teardown result table
        env:
          CONFIGURED: ${{ needs.preflight.outputs.configured }}
          MISSING: ${{ needs.preflight.outputs.missing }}
          R_FABRIC: ${{ needs.fabric.result }}
          R_COST: ${{ needs.cost-export.result }}
          R_RG: ${{ needs.resource-groups.result }}
          R_VERIFY: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          {
            echo "## infra-down results"
            echo
            if [ "${CONFIGURED}" != "true" ]; then
              echo "**Pre-G0 no-op.** Missing demo environment variables: ${MISSING}"
              echo
              echo "There is no estate to tear down yet; nothing failed."
              echo
            fi
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Fabric items + capacity pause | ${R_FABRIC} |"
            echo "| Cost-export definition | ${R_COST} |"
            echo "| Resource group deletes | ${R_RG} |"
            echo "| Down-state audit (V11.1 + V11.2) | ${R_VERIFY} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail the run if any teardown stage failed
        env:
          RESULTS: ${{ needs.fabric.result }} ${{ needs.cost-export.result }} ${{ needs.resource-groups.result }} ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          case " ${RESULTS} " in
            *" failure "*)
              echo "::error title=Teardown incomplete or unverified::At least one stage failed. Re-running infra-down is safe and idempotent; a failed down-state audit is NOT — V11.2 failing means the teardown crossed the tenant-object line (G3 boundary + G4 event), so stop and escalate rather than replaying."
              exit 1
              ;;
          esac
          echo "Teardown clean."
