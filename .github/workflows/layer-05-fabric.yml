name: layer-05-fabric

# =============================================================================
# L5 — Fabric workspace `mls-operations`, lakehouse, generators, seeding.
# Playbook: docs/runbooks/layers/L05.md
# Assets:   infra/fabric/provision-workspace.ps1, data/generators (seed 20260822)
#
# Cost discipline (master plan L5 / CLAUDE.md gate G2):
#   * resuming a PAID F2 capacity is a spend increase and is G2-gated per resume;
#     on the 60-day trial capacity it is a no-op with a $0 delta. The resume step
#     states the delta in the run summary either way — the discipline is the point.
#   * the pause step runs with `if: always()`, so a failed seed can never leave a
#     paid capacity running.
#
# Pre-G0 guard: FABRIC_CAPACITY_ID joins the three identity variables, so the
# whole layer no-ops before G0.
# =============================================================================

on:
  workflow_call:
    inputs:
      location:
        description: Unused by L5 (Fabric is capacity-scoped); accepted for uniform layer calls.
        type: string
        required: false
        default: eastus
      dry_run:
        description: Run provision-workspace.ps1 with -WhatIf and skip the seed.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      location:
        description: Unused by L5 (Fabric is capacity-scoped).
        type: string
        required: false
        default: eastus
      dry_run:
        description: Run provision-workspace.ps1 with -WhatIf and skip the seed.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (demo environment guard)
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      verifier: ${{ steps.verifier.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          additional: |
            FABRIC_CAPACITY_ID=${{ vars.FABRIC_CAPACITY_ID }}
          layer: L5 Fabric
      # FABRIC_CAPACITY_ID is required by the audit too: V5.1 asserts the workspace
      # is bound to that capacity and V5.4 reads its state, and neither can be
      # guessed. Guarded here so a missing value skips with a NOTICE instead of
      # exiting 2.
      - id: verifier
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          additional: |
            FABRIC_CAPACITY_ID=${{ vars.FABRIC_CAPACITY_ID }}
          layer: L5 verification (mls-verifier)

  deploy:
    name: provision and seed the lakehouse
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      id-token: write
      contents: read
    env:
      FABRIC_CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # F21 (compliance/findings/2026-08-26-prepublication-review.md#f21): the L5
      # Verifier audit authenticates to the Fabric REST API as mls-verifier on the
      # assumption it already holds workspace Viewer. Nothing granted it. Fabric
      # workspace role assignments need the service principal's OBJECT ID, and only
      # the app/client ID (AZURE_VERIFIER_CLIENT_ID) is configured anywhere in this
      # estate, so resolve it here via Graph (the deployer already holds
      # Directory.Read.All) rather than adding a second verifier-identity variable.
      # Skipped, not failed, when the verifier is not configured at all (same
      # "unverified, not broken" shape as the verify job's own guard below) -
      # provision-workspace.ps1's -VerifierPrincipalId stays a no-op without it.
      - name: Resolve mls-verifier's Fabric workspace principal ID (F21)
        id: verifier_principal
        if: ${{ vars.AZURE_VERIFIER_CLIENT_ID != '' }}
        env:
          AZURE_VERIFIER_CLIENT_ID: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
        run: |
          set -euo pipefail
          principal_id=$(az ad sp show --id "${AZURE_VERIFIER_CLIENT_ID}" --query id --output tsv)
          if [ -z "${principal_id}" ]; then
            echo "::error title=mls-verifier service principal not found::az ad sp show returned no object ID for AZURE_VERIFIER_CLIENT_ID; the Fabric workspace Viewer grant (F21) cannot proceed."
            exit 1
          fi
          echo "principal-id=${principal_id}" >> "${GITHUB_OUTPUT}"

      - name: Resume the Fabric capacity (G2 statement)
        id: resume
        run: |
          set -euo pipefail
          case "${FABRIC_CAPACITY_ID}" in
            /subscriptions/*)
              echo 'Paid capacity detected — resuming (G2: ~0.36 USD/hr for the seed window).'
              az resource invoke-action --ids "${FABRIC_CAPACITY_ID}" --action resume
              echo "paid=true" >> "${GITHUB_OUTPUT}"
              {
                echo '### L5 capacity resume (G2)'
                echo
                echo '- capacity: **paid F2**'
                echo '- stated delta: ~0.36 USD/hour for the resume window (seed + eval)'
                echo '- the pause step runs unconditionally, even on a failed seed'
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo 'Trial capacity (no ARM resource id) — resume is a no-op.'
              echo "paid=false" >> "${GITHUB_OUTPUT}"
              {
                echo '### L5 capacity resume (G2)'
                echo
                echo '- capacity: **trial**'
                echo '- stated delta: **0 USD**'
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
          esac

      - name: Provision workspace and lakehouse
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Empty when the previous step was skipped (verifier not configured) -
          # provision-workspace.ps1's -VerifierPrincipalId is a no-op on an empty
          # string, same shape as -DataApiPrincipalId before L7 exists.
          VERIFIER_PRINCIPAL_ID: ${{ steps.verifier_principal.outputs.principal-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Could not obtain a Fabric API token.' }
          $provisionArgs = @{
            Token      = $token
            CapacityId = $env:FABRIC_CAPACITY_ID
          }
          if (-not [string]::IsNullOrWhiteSpace($env:VERIFIER_PRINCIPAL_ID)) {
            $provisionArgs['VerifierPrincipalId'] = $env:VERIFIER_PRINCIPAL_ID
          }
          if ($env:DRY_RUN -eq 'true') {
            ./infra/fabric/provision-workspace.ps1 @provisionArgs -WhatIf *>&1 | Tee-Object -FilePath fabric-plan.txt
          }
          else {
            ./infra/fabric/provision-workspace.ps1 @provisionArgs -Confirm:$false *>&1 | Tee-Object -FilePath fabric-apply.txt
          }

      - name: Generate the synthetic dataset (seed 20260822)
        if: ${{ !inputs.dry_run }}
        working-directory: data
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r generators/requirements.txt
          python -m generators build
          python -m generators summary | tee ../generator-summary.txt

      - name: Load the 10 Delta tables
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # data/seed/seed.ps1 needs TWO tokens with DIFFERENT audiences: the
          # Fabric control plane (item + Load Table APIs) and OneLake's data
          # plane, which is storage-scoped. Passing one where the other is
          # expected returns an opaque 401, so both are minted explicitly here.
          $fabricToken = az account get-access-token `
            --resource https://api.fabric.microsoft.com --query accessToken -o tsv
          $oneLakeToken = az account get-access-token `
            --resource https://storage.azure.com --query accessToken -o tsv

          if (-not $fabricToken -or -not $oneLakeToken) {
            Write-Host '::error title=Token acquisition failed::Could not mint the Fabric and/or OneLake tokens; the seed cannot run.'
            exit 1
          }

          ./data/seed/seed.ps1 `
            -Target lakehouse `
            -Token $fabricToken `
            -OneLakeToken $oneLakeToken `
            -Confirm:$false

      - name: Pause the Fabric capacity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # Unconditional: a failed seed must never leave a paid capacity running.
          case "${FABRIC_CAPACITY_ID}" in
            /subscriptions/*)
              az resource invoke-action --ids "${FABRIC_CAPACITY_ID}" --action suspend
              echo "Paid capacity suspended."
              ;;
            *)
              echo "Trial capacity — pause is a no-op (\$0 either way)."
              ;;
          esac

      - name: Upload L5 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: layer-05-fabric
          path: |
            fabric-plan.txt
            fabric-apply.txt
            generator-summary.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify L5 (mls-verifier)
    needs: [preflight, deploy]
    if: ${{ needs.preflight.outputs.configured == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: verify
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      # V5.3 asserts the ten row counts against the deterministic seed. The audit
      # falls back to this path when -ExpectedCountPath is absent; passing it
      # explicitly keeps the report's Preflight table honest about which fixture
      # was read.
      MLS_EXPECTED_COUNTS: data/generators/tests/expected_counts.json
    steps:
      - uses: actions/checkout@v7

      - name: Verifier identity not configured
        if: ${{ needs.preflight.outputs.verifier != 'true' }}
        run: |
          set -euo pipefail
          echo "::notice title=L5 not independently verified::AZURE_VERIFIER_CLIENT_ID and/or FABRIC_CAPACITY_ID is absent from the demo environment, so verification/layer-05-audit.ps1 was skipped."

      - name: Azure login (OIDC, mls-verifier — Reader + workspace Viewer)
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # V5.3 queries the lakehouse SQL analytics endpoint through Invoke-Sqlcmd.
      # Without the module the criterion fails with "'Invoke-Sqlcmd' is not
      # available on this machine" — a runner gap reported as an estate defect,
      # which is exactly the confusion this whole change removes. 22+ is the
      # minimum that supports -AccessToken (Entra-only auth, no SQL password).
      - name: Install SqlServer (V5.3 queries the SQL analytics endpoint)
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module SqlServer -Force -Scope CurrentUser -MinimumVersion 22.0.0 -AllowClobber

      # -FabricToken is deliberately NOT passed: the audit mints its own Fabric
      # token from the mls-verifier login above, so no bearer token ever appears
      # in a process argument list. -SqlEndpoint is an override for the case where
      # the lakehouse metadata does not carry sqlEndpointProperties yet (the
      # endpoint syncs a few minutes behind lakehouse creation); when the demo
      # variable is unset both lines drop out and the audit resolves it from the
      # V5.1 evidence.
      - name: Run verification/layer-05-audit.ps1
        id: audit
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: ./.github/actions/layer-audit
        with:
          layer: '05'
          args: |
            -FabricCapacityId
            ${{ vars.FABRIC_CAPACITY_ID }}
            -ExpectedCountPath
            data/generators/tests/expected_counts.json
            ${{ vars.MLS_SQL_ENDPOINT && '-SqlEndpoint' || '' }}
            ${{ vars.MLS_SQL_ENDPOINT }}

      - name: Upload audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: layer-05-audit-report
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30
