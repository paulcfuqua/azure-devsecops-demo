name: compliance

# =============================================================================
# Collects the NIST SP 800-171 compliance state and commits it, so
# `git log compliance/state/` becomes the record of when the estate became
# compliant and when it regressed — a question most GRC tooling cannot answer.
#
# Design: docs/superpowers/specs/2026-08-26-compliance-platform-design.md §3.3.
# Runner:  compliance/Invoke-MlsCompliance.ps1.
#
# NO TENANT DEPENDENCY. Nothing in this estate has been deployed. The runner is
# read-only, needs no credential, and produces a complete artifact today from the
# catalog, the assessment register and the working tree alone — every other
# collector returns empty, which is the normal case rather than an error path.
# There is therefore no pre-G0 guard on this workflow: it is green from the first
# push, and the pre-deployment board is what makes the post-deployment board mean
# something.
#
# ---------------------------------------------------------------------------
# WHY TWO JOBS
#
# `collect` runs the code. `commit` holds `contents: write`. They are separate
# on purpose, and the split is the lesson from the prior remediation plan's
# Task 5: a job that can push to the default branch must not also resolve and
# execute third-party code, because a compromised or typo-squatted dependency
# then inherits a write token. So `commit` installs NOTHING — no npm ci, no
# Install-Module, no marketplace action beyond the pinned checkout and artifact
# download — and does nothing but move already-produced JSON into place and
# commit it. `collect` does all the work and holds only `contents: read`.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    # A push that changes ONLY the state artifact must not recompute the state
    # artifact. Regenerating a file BECAUSE it changed is circular, and here the
    # circle closes into a loop that does not terminate.
    #
    # Why it did not loop before, and does now. The commit job used to push
    # straight to main with GITHUB_TOKEN, and "events triggered by the
    # GITHUB_TOKEN will not create a new workflow run" -- GitHub's own recursion
    # guard, which the step below still names as the thing it relies on. Branch
    # protection ended that route: the direct push is refused and the artifact
    # arrives by pull request instead. Merging a pull request is a HUMAN push,
    # and human pushes do trigger workflows.
    #
    # So without this filter: merge the state PR -> compliance re-runs -> the
    # artifact's own `commit` field is now the merge SHA, so it differs from
    # what was just merged -> commit, direct push refused, new branch, new PR.
    # One more every time someone merges the last one.
    #
    # The nightly cron is unaffected and is what keeps the artifact fresh; this
    # filter only stops the state artifact from being its own trigger.
    paths-ignore:
      - compliance/state/**
  schedule:
    # 02:17 UTC nightly. Off the hour deliberately: the top of the hour is when
    # GitHub's scheduler is most contended and a run is most likely to be delayed.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialised, never cancelled: two runs racing to commit the same dated artifact
# would push over each other, and a cancelled run could leave a half-written
# state file in the artifact store.
concurrency:
  group: compliance-state
  cancel-in-progress: false

jobs:
  collect:
    name: collect compliance state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Collect the state artifact
        id: collect
        shell: pwsh
        env:
          # The sha this job actually checked out, so the artifact stamps the code it
          # describes rather than whatever HEAD happens to be when it is committed.
          MLS_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $state = ./compliance/Invoke-MlsCompliance.ps1 -OutputRoot compliance/state -Commit $env:MLS_COMMIT -PassThru
          # Name the dated file this run produced, so the upload carries only it rather
          # than every previously committed artifact sitting in the same directory.
          $dated = ($state.collectedAt -split 'T')[0]
          "dated-file=compliance/state/state-$dated.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sanity-check the artifact before anything is allowed to commit it
        run: |
          set -euo pipefail
          # A short or malformed artifact must fail here, in the unprivileged job,
          # rather than being committed and rendered as a board with holes in it.
          test -s compliance/state/state-latest.json
          controls="$(jq '.controls | length' compliance/state/state-latest.json)"
          echo "requirements rendered: ${controls}"
          if [ "${controls}" -ne 110 ]; then
            echo "::error title=Incomplete compliance state::Expected 110 requirements, found ${controls}."
            exit 1
          fi
          # No blended percentage, ever (spec section 3.4). Checked on the emitted bytes,
          # not only in Pester, so a future change to the runner cannot ship one quietly.
          # Matches a JSON KEY named like a score, never prose: the pattern requires the
          # word to fill a quoted token that is immediately followed by a colon, so the
          # artifact's own "there is deliberately no percentage" notes do not trip it.
          if grep -Eiq '"[A-Za-z]*(percent|ratio|score|pct)[A-Za-z]*"[[:space:]]*:' \
              compliance/state/state-latest.json; then
            echo "::error title=Score field in compliance state::The artifact carries a percentage, ratio or score field. The board reports counts by status and provenance only."
            exit 1
          fi
          if [ -L compliance/state/state-latest.json ]; then
            echo "::error title=state-latest.json is a link::It must be a real file copy: this repo is authored on Windows and collected on Linux."
            exit 1
          fi
          {
            echo "### Compliance state"
            echo
            echo "| status | count |"
            echo "|---|---|"
            jq -r '.summary.byStatus | to_entries[] | "| \(.key) | \(.value) |"' compliance/state/state-latest.json
            echo
            echo "| provenance | count |"
            echo "|---|---|"
            jq -r '.summary.byProvenance | to_entries[] | "| \(.key) | \(.value) |"' compliance/state/state-latest.json
            echo
            echo "Counts only — there is deliberately no blended percentage."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7
        with:
          name: compliance-state
          # Only what this run produced. Uploading compliance/state/ wholesale would
          # carry every previously committed dated artifact along with it, growing the
          # per-run artifact by ~130 KB a day forever.
          path: |
            compliance/state/state-latest.json
            ${{ steps.collect.outputs.dated-file }}
          if-no-files-found: error
          retention-days: 30

  commit:
    name: commit the dated artifact
    needs: collect
    runs-on: ubuntu-latest
    # The only job with a write token, and the only job that installs nothing.
    permissions:
      contents: write
      # The PR fallback below needs this; the direct-push path does not.
      pull-requests: write
    # workflow_dispatch can be fired from any ref; the state artifact belongs on the
    # default branch and nowhere else.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # fetch-depth: 0 because the push-retry below rebases, and `git pull --rebase`
      # on the default shallow clone is the fragile half of that retry.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: compliance-state
          path: compliance/state

      # A push made with GITHUB_TOKEN does not trigger workflows, so this commit cannot
      # re-trigger the `push` job above. That is GitHub's own recursion guard, relied on
      # here deliberately rather than worked around with a [skip ci] marker.
      - name: Commit the artifact if it changed
        env:
          MLS_COMMIT: ${{ github.sha }}
          # Needed only by the PR fallback below; gh reads it from the environment.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compliance/state
          if git diff --cached --quiet; then
            echo 'compliance state unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m "verify(compliance): state at ${MLS_COMMIT}" \
            -m 'Emitted by .github/workflows/compliance.yml. Counts by status and provenance; deliberately no blended percentage.'
          # Push direct to main, with a branch+PR fallback.
          #
          # This repo's own L1 target is branch protection with required checks on main
          # (.github/README.md), and repo-static currently reports that very control as a
          # GAP at 3.4.5. The day it lands, a direct push from GITHUB_TOKEN is rejected -
          # the rebase would no-op, the retry would fail, and the nightly run would be red
          # every night. Every other write-token workflow here (self-heal.yml) lands
          # changes by PR and auto-merge for exactly that reason.
          #
          # So: try the direct push, because it is cheaper and makes no PR noise while
          # main is unprotected. If it is refused, fall back to a branch and a PR rather
          # than failing. Either way the artifact lands; only the route changes.
          #
          # Serialised by the workflow concurrency group, but a push can still lose a race
          # with a human merge landing between checkout and push - hence the rebase.
          if git push; then
            echo 'Artifact pushed directly to main.'
            exit 0
          fi

          echo 'Direct push refused; rebasing and retrying once.'
          git pull --rebase origin main
          if git push; then
            echo 'Artifact pushed to main after rebase.'
            exit 0
          fi

          echo '::notice title=Falling back to a pull request::Direct push to main was refused (branch protection is the expected cause). Opening a PR instead.'

          # ONE branch, force-updated - not one per commit.
          #
          # This was `compliance-state/${MLS_COMMIT}`, which looks unique and is not: the
          # nightly schedule runs against whatever `main` is, so an unchanged `main` produces
          # the SAME branch name with DIFFERENT content the next night. The second push was
          # refused non-fast-forward, `set -e` killed the step, and the job went red - while
          # 23 branches accumulated that nobody could turn into pull requests, because
          # opening one needs an Actions setting this repo deliberately leaves off (F65).
          #
          # A single branch that the nightly overwrites has neither problem: one open PR that
          # updates in place, and nothing to accumulate. --force-with-lease rather than
          # --force so a human editing that branch is never silently clobbered.
          branch='compliance-state'
          git switch -c "${branch}"
          git push --force-with-lease --set-upstream origin "${branch}"
          # The branch is pushed, so the artifact is safe either way. Opening the PR
          # is best-effort on purpose: creating one requires the repository setting
          # "Allow GitHub Actions to create and approve pull requests", and that single
          # toggle also grants APPROVAL. A workflow able to approve its own pull request
          # defeats the review requirement this fallback exists to respect, so the
          # setting stays off and this step degrades to telling a human where to click.
          # Observed on the first public run: the branch pushed, `gh pr create` returned
          # "GitHub Actions is not permitted to create or approve pull requests", and the
          # job failed for a reason nobody needed to act on urgently.
          # An open PR from a reused branch is the NORMAL state now, not an error: the push
          # above has already updated it in place.
          existing=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "${existing}" ]; then
            echo "::notice title=Compliance state updated on an open pull request::Pushed to ${branch}; pull request #${existing} now carries the state at ${MLS_COMMIT}."
            exit 0
          fi

          if gh pr create --base main --head "${branch}"               --title 'verify(compliance): nightly state artifact'               --body 'Automated compliance state artifact, force-updated by .github/workflows/compliance.yml on every run. Counts by status and provenance; deliberately no blended percentage.'; then
            echo 'Pull request opened.'
            exit 0
          fi

          echo "::warning title=Compliance state is on a branch, awaiting a pull request::The artifact was committed and pushed to ${branch}, but this workflow cannot open the pull request: creating one needs 'Allow GitHub Actions to create and approve pull requests', which also grants approval and is deliberately disabled. Open it by hand - nothing is lost."
          {
            echo "### Compliance state pushed to a branch"
            echo
            echo "Branch: \`${branch}\`"
            echo
            echo "Open the pull request: <https://github.com/${GITHUB_REPOSITORY}/pull/new/${branch}>"
            echo
            echo "This is not a failure. Direct pushes to \`main\` are refused by branch protection, which is working as intended, and this workflow will not enable the Actions setting that would let it open the PR itself, because the same setting also lets a workflow approve one."
          } >> "${GITHUB_STEP_SUMMARY}"
