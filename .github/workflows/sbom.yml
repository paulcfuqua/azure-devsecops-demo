name: sbom

# =============================================================================
# SPDX SBOMs via Syft — L9 DevSecOps chain.
# Playbook: docs/runbooks/layers/L09.md (V9.3 expects one `*.spdx.json` per app
# attached to the release, SPDX-valid, package list non-empty).
#
# Triggers:
#   * push to main / manual  -> SBOMs uploaded as run artifacts (always available)
#   * release published      -> the same SBOMs are ALSO attached as release assets
#
# Syft is version-pinned (L09 failure mode 4: pin the generator and the validator
# together, and upgrade both deliberately in one PR), and anchore/sbom-action is
# SHA-pinned rather than floating on @v0 (F33).
#
# ---------------------------------------------------------------------------
# WHY TWO JOBS (F30)
#
# `generate` runs the code. `attach` holds `contents: write`. This is the rule
# compliance.yml documents in its own "WHY TWO JOBS" block and this workflow
# used to break: one job held `contents: write` AND ran `npm ci` plus
# `npm ci --prefix apps/vuln-lab` — installing packages with KNOWN CVEs and
# executing their `postinstall` scripts — AND a third-party action, with
# actions/checkout's `persist-credentials` defaulted true, so `GITHUB_TOKEN`
# sat in `.git/config` for any of that code to read.
#
# So `attach` installs NOTHING: no npm, no third-party action beyond checkout
# and the artifact download, no repository code. It downloads the documents
# `generate` produced and calls `gh release upload`. `generate` holds only
# `contents: read` and checks out with `persist-credentials: false`, so the
# token is not on disk while untrusted dependency code runs.
#
# No tenant dependency — this workflow is live from Phase P and needs no pre-G0
# guard.
# =============================================================================

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: >-
          Release to attach the SBOMs to. Set by layer-09-devsecops.yml, which creates the
          release first and then calls this workflow: V9.3 reads
          `gh release view <tag> --json assets` and needs one `*.spdx.json` per app there,
          so the layer run has to produce release assets, not only run artifacts. Empty
          keeps the old behaviour (artifacts only).
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

# `github.workflow` is the CALLER's workflow name when this runs via workflow_call, so an
# L9 layer run and an ordinary push-triggered SBOM run land in different concurrency
# groups. Without that they share one group and cancel each other, which would take the
# L9 run's SBOM job out from under V9.3.
concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: generate SPDX SBOMs
    runs-on: ubuntu-latest
    # READ ONLY. This job resolves and executes third-party dependency code
    # (npm ci, including apps/vuln-lab's deliberately vulnerable tree and its
    # postinstall scripts) and runs a third-party action. It must never hold a
    # write token — see WHY TWO JOBS above.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace-root
            path: .
          - name: launch-ops
            path: apps/launch-ops
          - name: control-tower
            path: apps/control-tower
          # copilot-svc was deleted by the 2026-08-24 Copilot Studio amendment (the
          # Anthropic tool-use service became a Copilot Studio agent plus the MCP tool
          # server). The matrix still named it, so a scan of apps/copilot-svc produced no
          # document and the sanity check failed on a path that has not existed for a
          # while — harmless while nothing depended on this workflow, fatal the moment
          # layer-09-devsecops.yml started calling it for V9.3.
          - name: mcp-tools
            path: apps/mcp-tools
          - name: data-api
            path: apps/data-api
          - name: directline-token
            path: apps/directline-token
          - name: cost-ingest
            path: apps/cost-ingest
          - name: spec-renderer
            path: apps/shared/spec-renderer
          - name: vuln-lab
            path: apps/vuln-lab
    steps:
      - uses: actions/checkout@v7
        with:
          # Keeps GITHUB_TOKEN out of .git/config while npm ci below executes
          # third-party install scripts. Nothing in this job pushes.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies so the SBOM sees the resolved tree
        run: |
          set -euo pipefail
          # A manifest-only scan lists direct deps; an installed tree gives Syft the
          # full transitive closure, which is what an SBOM is for.
          npm ci
          npm ci --prefix apps/vuln-lab

      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ matrix.path }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Sanity-check the document
        run: |
          set -euo pipefail
          file="sbom-${{ matrix.name }}.spdx.json"
          test -s "${file}"
          jq -e '.spdxVersion and .creationInfo and (.packages | length > 0)' "${file}" >/dev/null
          packages="$(jq '.packages | length' "${file}")"
          echo "${file}: ${packages} packages, $(jq -r .spdxVersion "${file}")"
          {
            echo "- \`${file}\` — ${packages} packages, $(jq -r .spdxVersion "${file}")"
          } >> "${GITHUB_STEP_SUMMARY}"

  attach:
    name: attach the SBOMs to the release
    needs: generate
    runs-on: ubuntu-latest
    # A release event carries its own tag; a workflow_call from the L9 layer run
    # names the release it just created. Nothing to attach to otherwise.
    if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
    # The only job with a write token, and the only job that installs nothing:
    # no npm, no third-party action, no repository code. It moves already-produced
    # documents onto a release and stops.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # anchore/sbom-action uploads one artifact per matrix entry, named by
          # its `artifact-name`. A glob pattern collects all of them into one
          # directory without this job needing to know the matrix.
          pattern: sbom-*.spdx.json
          path: sboms
          merge-multiple: true

      - name: Upload every SBOM as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          # gh needs the repository when the workspace is not a git checkout,
          # and this job deliberately does not check the repository out.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sboms/*.spdx.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=No SBOMs to attach::The generate job produced no *.spdx.json artifacts."
            exit 1
          fi
          gh release upload "${TAG}" "${files[@]}" --clobber
          {
            echo "### SBOMs attached to \`${TAG}\`"
            for file in "${files[@]}"; do
              echo "- \`$(basename "${file}")\`"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
