name: infra-up

# =============================================================================
# Layer-ordered full instantiation of the Meridian Launch Systems demo estate.
# Master plan: docs/superpowers/plans/2026-08-22-g1-master-plan.md
# Operational runbook: docs/runbooks/kill-rebuild.md § 4 (replay order) and § 5
# (the <180-minute clock, raised from 60 on 2026-09-22). `scripts/up.ps1` is the local
# wrapper over this file.
#
# Replay graph — L5 and L6 run in PARALLEL, which is what buys the margin in the
# <180-minute critical path (kill-rebuild.md § 5):
#
#   oidc-login
#     └─ L2 landing zone  ~1-2m   (idempotent no-op on a standard rebuild)
#          └─ L3 Entra    ~1-2m   (create-if-absent, no-ops in seconds)
#               └─ L4 labels ~1m  (create-if-absent, GUIDs preserved)
#                    ├─ L5 Fabric + seed  ~20-25m ─┬───────────┐  (parallel)
#                    └─ L6 platform Bicep ~12-18m ─┴─ L7 apps ─┴─ L8 copilot ~10-14m
#                                                    ~10-15m        └─ summary
#
# L7 depends on L6 only (it needs the ACA environment, not the lakehouse), so a
# slow L5 leg never serializes the app deploy.
#
# L8 is the one leg that needs BOTH: the ACA environment L7 deploys onto (the MCP
# tool server, and the agent repoint that follows the environment's new domain
# suffix) and the lakehouse L5 seeds (the golden-question eval). That is exactly
# kill-rebuild.md § 4 leg 6 — "legs 5–6 need 4b (ACA env), and leg 6's eval needs
# 4a (lakehouse)" — so it hangs off layer-05 AND layer-07 rather than riding a
# per-app CI path. Skipped upstreams are tolerated (see the `if:` conditions), so
# a selective replay of `l8` alone still runs.
#
# WHERE THE FINOPS LEG LIVES. `apps/cost-ingest` (Cost Management daily export →
# storage → Function → lakehouse `cost_daily`) is an L6 resource and deploys inside
# layer-06-platform.yml alongside the export wiring it consumes. It gets no job of
# its own here: it has no independent dependency and giving it one would put a
# Function deploy on the critical path for no benefit.
#
# THAT SENTENCE WAS FALSE UNTIL 2026-08-28, and its falseness was finding F19
# (compliance/findings/2026-08-26-prepublication-review.md#f19): apps/cost-ingest
# appeared in no Bicep anywhere, so there was no Function App, no identity, and
# no way to make the one workload RBAC grant F13 still had open. It is true now,
# and specifically: infra/bicep/platform/main.bicep provisions the Function App on
# a Flex Consumption plan with a user-assigned identity, its runtime storage, the
# container-scoped Storage Blob Data Reader grant and the Event Grid system topic;
# layer-06-platform.yml publishes the code and creates the blob-created event
# subscription; and layer-07-apps.yml grants the identity its Fabric workspace
# role, from L7 because L5 and L6 run in parallel here and only L7 can assume both
# the workspace and the identity exist. Idle cost is unchanged (~$0): Flex
# Consumption bills execution time and the plan carries no always-ready instances.
#
# ---------------------------------------------------------------------------
# PRE-G0 GUARD
# Every Azure-facing job hangs off `preflight`, which reads the `demo` GitHub
# environment. Before G0 those variables do not exist, `preflight` reports
# configured=false, and every deploy job is skipped — the run is GREEN and this
# file is safe to push before the tenant exists (Phase P Track G).
# No tenant/subscription/client ID is ever committed (CLAUDE.md hard rule 5).
# ---------------------------------------------------------------------------
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = layer-ordered instantiation; oidc-smoke = run only the oidc-login job (L1 V1.1)'
        type: choice
        options:
          - full
          - oidc-smoke
        default: full
      layers:
        description: "Layers to run: 'all', 'none', or a comma list of l2..l8 (e.g. l5,l6)"
        type: string
        default: all
      location:
        description: Azure region for every layer deployment
        type: string
        default: ''
      dry_run:
        description: 'Plan only — what-if / -WhatIf everywhere, no writes'
        type: boolean
        default: false
      image_tag:
        description: >-
          GHCR tag for the L7 apps deployment. Defaults to `latest`, what the per-app
          CI workflows publish. Empty deploys the containerapps-helloworld placeholder
          instead, which provisions cleanly and serves none of the demo (F88).
        type: string
        default: latest
      only_criterion:
        description: >-
          Verify only these criteria in the L11 up-phase proof, e.g. `V11.4` or
          `V11.1,V11.4`. Everything else reports SKIP and the audit exits 3 - a DIAGNOSTIC,
          never a sign-off (P-10). Applies only when l11_up_audit is on.
        type: string
        required: false
        default: ''
      l11_up_audit:
        description: >-
          Run the L11 UP-phase rebuild proof after every layer completes (V11.2 tenant
          objects intact, V11.3 layer audits green, V11.4 wall clock, V11.5 idle cost).
          OFF by default: a normal bring-up is not a rebuild proof, and the criterion that
          matters most - wall clock under 180 minutes - is only meaningful when this run
          IS the rebuild half of a kill/reinstantiate cycle.
        type: boolean
        required: false
        default: false
      l11_child_audit_layers:
        description: >-
          Which layer audits V11.2/V11.3 re-execute, as a comma list (e.g. `2,3,4,6`), or
          `none` to suppress them. Empty means all of 1-10, which is the honest default and
          also the expensive one: each child audit runs with ITS OWN retry windows, and L7
          alone waits ~30 minutes for a real scale-in cycle. Narrowing the set narrows what
          V11.3 may claim, and the report says which layers were actually re-run.
        type: string
        required: false
        default: ''
      enable_fabric_data_agent:
        description: >-
          L8 only: also create the Fabric connected agent. OFF by default — it needs a
          PAID F2+ capacity (the trial capacity does not support Fabric AI experiences)
          and moving to paid F2 is a G2-gated spend increase. Tools-only via MCP is the
          trial-phase default and needs nothing here.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # infra-up and infra-down share one group: the estate is never built and torn
  # down at the same time.
  group: mls-demo-estate
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight (demo environment guard)
    runs-on: ubuntu-latest
    # Bounded: reads repository variables and nothing else. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 10
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      missing: ${{ steps.guard.outputs.missing }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          additional: |
            FABRIC_CAPACITY_ID=${{ vars.FABRIC_CAPACITY_ID }}
          layer: infra-up (full estate)

  plan:
    name: plan layer selection
    runs-on: ubuntu-latest
    # Bounded: a preview; it creates nothing. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 20
    outputs:
      l2: ${{ steps.select.outputs.l2 }}
      l3: ${{ steps.select.outputs.l3 }}
      l4: ${{ steps.select.outputs.l4 }}
      l5: ${{ steps.select.outputs.l5 }}
      l6: ${{ steps.select.outputs.l6 }}
      l7: ${{ steps.select.outputs.l7 }}
      l8: ${{ steps.select.outputs.l8 }}
    steps:
      - name: Resolve which layers this run replays
        id: select
        env:
          MODE: ${{ inputs.mode }}
          LAYERS: ${{ inputs.layers }}
        run: |
          set -euo pipefail
          selection="$(printf '%s' "${LAYERS}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          # oidc-smoke (L01 playbook step 4) runs the login job and nothing else.
          if [ "${MODE}" = "oidc-smoke" ]; then
            selection="none"
          fi
          [ -n "${selection}" ] || selection="all"
          for layer in l2 l3 l4 l5 l6 l7 l8; do
            case "${selection}" in
              none) enabled=false ;;
              all) enabled=true ;;
              *)
                if printf ',%s,' "${selection}" | grep -q ",${layer},"; then
                  enabled=true
                else
                  enabled=false
                fi
                ;;
            esac
            echo "${layer}=${enabled}" >> "${GITHUB_OUTPUT}"
          done
          echo "Selection: ${selection}"

  # The L11 wall clock (V11.4) starts at the invocation of the rebuild, not at the audit.
  # up.ps1 records it locally in verification/reports/up-clock.json; in CI the equivalent
  # instant is this run's own start, captured once here so every consumer reads one value.
  up-clock:
    name: record the rebuild start instant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      started: ${{ steps.clock.outputs.started }}
    steps:
      - id: clock
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

  oidc-login:
    # Job name is load-bearing: verification/layer-01-audit.ps1 selects the job
    # named "oidc-login" for V1.1 (docs/runbooks/layers/L01.md).
    name: oidc-login
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC, mls-github-deployer — zero stored cloud secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Assert the runner landed in the demo subscription
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          # V1.1: the run conclusion is the Verifier's independent signal, so this
          # assertion must fail the job when the OIDC round-trip lands elsewhere.
          actual="$(az account show --query id -o tsv)"
          if [ "${actual}" != "${EXPECTED_SUBSCRIPTION_ID}" ]; then
            echo "::error title=OIDC landed in the wrong subscription::az account show returned a subscription that is not the demo subscription."
            exit 1
          fi
          echo "OIDC round-trip verified against the demo subscription."
          {
            echo "### OIDC round-trip"
            echo
            echo "\`azure/login\` succeeded and \`az account show\` matched \`vars.AZURE_SUBSCRIPTION_ID\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Ensure every resource provider this estate uses is registered
        run: |
          set -euo pipefail
          # AN UNREGISTERED PROVIDER FAILS THE LAYER THAT FIRST TOUCHES IT, NOT BEFORE.
          #
          # L6 deployed Key Vault and Azure SQL cleanly and then died wiring the cost export:
          #   400 RP Not Registered. Register destination storage account subscription
          #       with Microsoft.CostManagementExports.
          # A sweep found two more waiting on the same shape - Microsoft.Security for L9's
          # Defender toggles and Microsoft.PowerPlatform for L8 - each of which would have
          # surfaced one layer and one run at a time, minutes into a deploy, in an error
          # naming a provider rather than the layer that needed it (F82).
          #
          # Registration is idempotent, subscription-scoped, free, and asynchronous. This does
          # not WAIT: a provider takes minutes to move Registering -> Registered, and blocking
          # every run on that would cost more than it saves. It kicks the registration off
          # early enough that the layer needing it, several minutes later, finds it done.
          #
          # A provider missing from this list is the finding, not a provider that fails to
          # register - so verification/tests/failure-classes.Tests.ps1 checks the list against
          # what the templates actually reference.
          for ns in \
            Microsoft.App \
            Microsoft.CostManagement \
            Microsoft.CostManagementExports \
            Microsoft.EventGrid \
            Microsoft.Insights \
            Microsoft.KeyVault \
            Microsoft.ManagedIdentity \
            Microsoft.OperationalInsights \
            Microsoft.PowerPlatform \
            Microsoft.Security \
            Microsoft.Sql \
            Microsoft.Storage \
            Microsoft.Web ; do
            state=$(az provider show -n "${ns}" --query registrationState -o tsv 2>/dev/null || echo 'Unknown')
            if [ "${state}" = "Registered" ]; then
              continue
            fi
            echo "::notice title=Registering ${ns}::state was ${state}; registration is asynchronous and this run does not wait for it."
            az provider register --namespace "${ns}" >/dev/null 2>&1 || \
              echo "::warning title=Could not register ${ns}::The deployer may lack permission. The layer that needs it will fail with 'RP Not Registered' until someone registers it."
          done

  layer-02:
    name: L2 landing zone
    needs: [preflight, plan, oidc-login]
    if: ${{ needs.preflight.outputs.configured == 'true' && needs.plan.outputs.l2 == 'true' }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/layer-02-landing-zone.yml
    with:
      location: ${{ inputs.location }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  layer-03:
    name: L3 Entra
    needs: [preflight, plan, layer-02]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.plan.outputs.l3 == 'true' && !contains(fromJSON('["failure","cancelled"]'), needs.layer-02.result) && !(needs.plan.outputs.l2 == 'true' && needs.layer-02.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/layer-03-entra.yml
    with:
      location: ${{ inputs.location }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  layer-04:
    name: L4 Purview labels
    needs: [preflight, plan, layer-03]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.plan.outputs.l4 == 'true' && !contains(fromJSON('["failure","cancelled"]'), needs.layer-03.result) && !(needs.plan.outputs.l3 == 'true' && needs.layer-03.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/layer-04-purview.yml
    with:
      location: ${{ inputs.location }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  layer-05:
    # Parallel with layer-06 — see the replay graph above.
    name: L5 Fabric + seed
    needs: [preflight, plan, layer-04]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.plan.outputs.l5 == 'true' && !contains(fromJSON('["failure","cancelled"]'), needs.layer-04.result) && !(needs.plan.outputs.l4 == 'true' && needs.layer-04.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/layer-05-fabric.yml
    with:
      location: ${{ inputs.location }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  layer-06:
    # Parallel with layer-05 — see the replay graph above.
    name: L6 platform
    needs: [preflight, plan, layer-04]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.plan.outputs.l6 == 'true' && !contains(fromJSON('["failure","cancelled"]'), needs.layer-04.result) && !(needs.plan.outputs.l4 == 'true' && needs.layer-04.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/layer-06-platform.yml
    with:
      location: ${{ inputs.location }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  layer-07:
    name: L7 apps
    needs: [preflight, plan, layer-06]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.plan.outputs.l7 == 'true' && !contains(fromJSON('["failure","cancelled"]'), needs.layer-06.result) && !(needs.plan.outputs.l6 == 'true' && needs.layer-06.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/layer-07-apps.yml
    with:
      location: ${{ inputs.location }}
      dry_run: ${{ inputs.dry_run }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

  layer-08:
    # The only leg that needs BOTH parallel branches: L7's ACA environment (the MCP
    # tool server the agent attaches to, and the repoint that follows the
    # environment's regenerated domain suffix) and L5's seeded lakehouse (the
    # golden-question eval). kill-rebuild.md § 4 leg 6.
    #
    # `always()` plus the explicit failure/cancelled tests, rather than a plain
    # `needs:`, so that a SKIPPED upstream is tolerated: `layers: l8` on its own is a
    # legitimate selective replay (repoint the surviving agent after someone rebuilt
    # only the apps), and it must not be blocked by L5/L7 having been deselected.
    name: L8 Copilot Studio
    needs: [preflight, plan, layer-05, layer-07]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.plan.outputs.l8 == 'true' && !contains(fromJSON('["failure","cancelled"]'), needs.layer-05.result) && !(needs.plan.outputs.l5 == 'true' && needs.layer-05.result == 'skipped') && !contains(fromJSON('["failure","cancelled"]'), needs.layer-07.result) && !(needs.plan.outputs.l7 == 'true' && needs.layer-07.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/layer-08-copilot-studio.yml
    with:
      location: ${{ inputs.location }}
      dry_run: ${{ inputs.dry_run }}
      enable_fabric_data_agent: ${{ inputs.enable_fabric_data_agent }}
    secrets: inherit

  # ---------------------------------------------------------------------
  # L11 UP-PHASE PROOF. infra-down.yml runs the DOWN half (V11.1 + V11.2) and
  # nothing ran the UP half, so verification/layer-11-audit.ps1 -Phase Up had no
  # caller anywhere in CI: the layer shipped a verification script the pipeline
  # could not invoke. A triplet whose third leg is unreachable is two legs.
  #
  # Gated OFF by default. A routine bring-up is not a rebuild proof, and V11.4
  # measures wall clock from the rebuild's start - a number that only means
  # something when this run is the up half of a kill/reinstantiate cycle.
  # ---------------------------------------------------------------------
  layer-11-up:
    name: L11 rebuild proof (up phase)
    needs: [preflight, plan, up-clock, layer-02, layer-03, layer-04, layer-05, layer-06, layer-07, layer-08]
    if: ${{ always() && inputs.l11_up_audit && needs.preflight.outputs.configured == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Bounded, and generously: V11.3 re-executes child audits that carry their own
    # retry windows. Narrow l11_child_audit_layers rather than raising this (F81).
    timeout-minutes: 180
    environment: verify
    permissions:
      id-token: write
      contents: read
    # CONSUMED BY THE CHILD AUDITS, AND THE ONLY CHANNEL THAT REACHES THEM.
    #
    # layer-11-audit.ps1 launches layer-01..10-audit.ps1 in their own pwsh processes with
    # only -ReportRoot/-NoRetry. Every input they need therefore has to arrive through the
    # inherited ENVIRONMENT; there is no other route across a process boundary.
    #
    # infra-down.yml's verify job has carried exactly this block, with exactly this
    # reasoning written above it, since F170. It never reached this job - so on the
    # 2026-09-21 rebuild every child audit exited 2 ("could not start: Required input
    # 'Repository'/'SubscriptionId'/'Domain'/'Organization' was not supplied") and V11.2 and
    # V11.3 reported the rebuild as failed. The estate was fine: L1-L7's OWN audits had all
    # passed minutes earlier in the same run, and the identical V11.2 had passed in the down
    # phase two hours before, because that job could see these values and this one could not.
    #
    # That is why V11.3 "has never reported at all" - not bad luck, a structural inability
    # to start. A fix applied to one of two callers is half a fix (F124's class: a value
    # that exists, is spelled correctly, and cannot be SEEN by the thing that reads it).
    #
    # FABRIC_CAPACITY_ID is the one addition over the down block: the down phase re-runs
    # only L3/L4, the up phase re-runs L1-L10, and L5's audit requires it.
    #
    # THE SECOND PASS, 2026-09-25 (run 36095279150). With the block above in place every
    # child STARTED - and then L1, L5, L6, L7, L8, L9 and L10 still could not observe,
    # because a started audit needs what its own verify job hands it, not just enough to
    # get past preflight. Each addition below names the criterion that was blind without
    # it; each mirrors the per-layer verify job it was copied from. What cannot be had in
    # this run (L9's run id / release tag / ZAP run, L10's self-heal `readable` output, a
    # canary PR when MLS_L7_CANARY_PR is unset) is left absent on purpose: the child reports
    # that criterion UNOBSERVABLE, and V11.3 reports the layer as unobservable, never green.
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # V1.3 sweeps the tree for this value, like verify-l1.yml's job does.
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      FABRIC_CAPACITY_ID: ${{ vars.FABRIC_CAPACITY_ID }}
      MLS_REPOSITORY: ${{ github.repository }}
      MLS_TENANT_DOMAIN: ${{ vars.MLS_TENANT_DOMAIN || vars.ENTRA_DOMAIN }}
      TENANT_DOMAIN: ${{ vars.MLS_TENANT_DOMAIN || vars.ENTRA_DOMAIN }}
      MLS_VERIFIER_APP_ID: ${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
      MLS_ENTRA_MANIFEST: infra/entra/manifest.json
      MLS_LABEL_GUID_PATH: verification/reports/label-guids.json
      MLS_VERIFIER_GH_TOKEN: ${{ secrets.MLS_VERIFIER_GH_TOKEN || github.token }}
      # gh reads GH_TOKEN, not MLS_VERIFIER_GH_TOKEN. Without this every GitHub read in L1
      # (V1.1, V1.2), L9 (V9.1) and L10 exited 4 "set the GH_TOKEN environment variable",
      # and V11.4's second clock read "not available". MlsAudit's Invoke-MlsGh now falls
      # back to MLS_VERIFIER_GH_TOKEN as well; this keeps the job correct on its own.
      GH_TOKEN: ${{ secrets.MLS_VERIFIER_GH_TOKEN || github.token }}
      # V1.2's optional admin-read token, exactly as verify-l1.yml passes it. Unset, V1.2
      # records SKIP naming what it could not see.
      MLS_REPO_SETTINGS_TOKEN: ${{ secrets.MLS_REPO_SETTINGS_TOKEN }}
      # L5 V5.2/V5.3/V5.5/V5.6 and L8 V8.2 read the lakehouse SQL analytics endpoint.
      MLS_SQL_ENDPOINT: ${{ vars.MLS_SQL_ENDPOINT }}
      # L6 V6.3's 24 h cost-export deadline runs from L6 completion; without it a
      # not-yet-arrived export is recorded FAIL rather than PENDING.
      MLS_L6_COMPLETED_AT: ${{ needs.layer-06.outputs.completed-at }}
      # L7 V7.4's canary PR, the same fallback layer-07-apps.yml's verify job uses.
      MLS_L7_CANARY_PR: ${{ vars.MLS_L7_CANARY_PR }}
      # L8 V8.1's Power Platform environment, as layer-08-copilot-studio.yml passes it.
      MLS_POWER_PLATFORM_ENV_URL: ${{ vars.MLS_POWER_PLATFORM_ENV_URL || vars.POWERPLATFORM_ENVIRONMENT_URL }}
      # STAGING THE PFX IS HALF OF IT. The 2026-09-21 L11 up-phase run staged the
      # certificate successfully and L4 still could not start:
      #
      #   layer-04-audit could not start: The certificate data cannot be read with the
      #   provided password, the password may be incorrect.
      #
      # infra-down.yml and layer-04-purview.yml both pass this alongside the file; the env
      # block added here in #302 did not. A file without its password is a credential that
      # exists, is spelled correctly, and cannot be USED by the thing that reads it - F124's
      # class one more time, and the criterion said so precisely enough to find it in one
      # line rather than one run.
      MLS_VERIFIER_CERT_PASSWORD: ${{ secrets.MLS_VERIFIER_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-verifier — Reader only)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # V11.3 re-runs L4, whose criteria need a read-only Security & Compliance session as
      # mls-verifier. S&C PowerShell has no federated path, so the X.509 certificate is the
      # only unattended option (CLAUDE.md rule 5). Decided HERE rather than in preflight
      # because this job declares `environment: verify` and is the only one that can see
      # the secret at all (F170). Absent, L4 records SKIP for the S&C criteria and still
      # STARTS - which is the difference this whole change is about.
      - id: tenant
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          additional: |
            MLS_TENANT_DOMAIN=${{ vars.MLS_TENANT_DOMAIN || vars.ENTRA_DOMAIN }}
            MLS_VERIFIER_APP_ID=${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
            MLS_VERIFIER_CERT_BASE64=${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
          layer: post-up tenant-object audits (V11.2/V11.3 re-run L3 + L4)

      - name: Install ExchangeOnlineManagement (pinned)
        if: ${{ steps.tenant.outputs.configured == 'true' }}
        uses: ./.github/actions/install-exo

      # A FILE, NOT THE CERTIFICATE STORE: -CertificateThumbprint is a Windows-only dynamic
      # parameter of Connect-IPPSSession, so on ubuntu-latest an audit handed a thumbprint
      # dies at parameter binding having never opened a connection (F170/F175/F176).
      # -CertificateFilePath is added on every platform. The PFX stays in RUNNER_TEMP until
      # the child audit has read it and is removed below whatever the verdict.
      - name: Stage the mls-verifier certificate for the child L4 audit
        id: cert
        if: ${{ steps.tenant.outputs.configured == 'true' }}
        shell: pwsh
        env:
          MLS_VERIFIER_CERT_BASE64: ${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mls-verifier.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MLS_VERIFIER_CERT_BASE64))
          "MLS_VERIFIER_CERT_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Staged the mls-verifier PFX at $pfxPath ($((Get-Item $pfxPath).Length) bytes)."

      - name: Tenant-object audits unavailable
        if: ${{ steps.tenant.outputs.configured != 'true' }}
        run: |
          set -euo pipefail
          echo "::warning title=V11.2/V11.3 will record L4 as unobservable::MLS_TENANT_DOMAIN and/or the mls-verifier Security & Compliance certificate are not configured, so L4's S&C criteria cannot run. The child audit still STARTS and records SKIP with that reason - it does not pass, and it is not reported as a failed layer."

      - name: Stamp the completion instant
        id: done
        run: echo "completed=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      # -------------------------------------------------------------------------------
      # CHILD-AUDIT INPUTS. Everything from here to the audit step exists so the V11.3
      # children can OBSERVE, not merely start. Each mirrors the step in the per-layer
      # verify job that supplies the same input, and each runs AFTER the completion stamp
      # above so tooling installs do not count against the rebuild wall clock (V11.4).
      #
      # None of these fails the job. A step that cannot produce its input leaves it
      # absent, the child criterion that needed it reports UNOBSERVABLE, and V11.3 names
      # that layer as unobservable - which is the effect this job asserts instead of the
      # step's exit code (CLAUDE.md: a step allowed to fail is watched by its effect).
      # -------------------------------------------------------------------------------

      # L5 V5.2/V5.3/V5.5/V5.6 and L8 V8.2 query the lakehouse SQL analytics endpoint.
      # SqlServer 22+ is required for Invoke-Sqlcmd -AccessToken; identical to the install
      # in layer-05-fabric.yml's verify job. Without it the four L5 criteria threw
      # "'Invoke-Sqlcmd' is not available on this machine" (2026-09-25).
      - name: Install SqlServer (L5/L8 child criteria query the SQL analytics endpoint)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module SqlServer -Force -Scope CurrentUser -MinimumVersion 22.0.0 -AllowClobber

      # L7 V7.2 runs the renderer's golden-spec validator from the audited commit; without
      # the workspace install it failed ERR_MODULE_NOT_FOUND. Same as layer-07-apps.yml.
      - uses: actions/setup-node@v7
        continue-on-error: true
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies (L7 V7.2 runs the golden-spec validator)
        continue-on-error: true
        run: npm ci

      # L7 V7.1 binds "endpoint is up" to "serves the audited build" through the per-app
      # digests the L7 deploy in THIS run uploaded. Absent when L7 was not selected.
      - name: Download the L7 deploy manifest (V7.1)
        id: l7manifest
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: layer-07-deploy-manifest
          path: l7-manifest

      # L8 V8.2/V8.4/V8.5 read the agent eval artifact from THIS run's L8 eval job.
      # Absent whenever that job did not upload one, which is today's normal state.
      - name: Download the L8 agent eval artifact
        id: l8eval
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: layer-08-agent-eval
          path: l8-eval

      # Values that are derived from the rebuilt estate rather than stored, resolved as
      # mls-verifier exactly as the per-layer verify jobs do, and handed to the children
      # through GITHUB_ENV - the only channel that crosses into their processes.
      - name: Resolve child-audit inputs from this run and the rebuilt estate
        env:
          RG_PLATFORM: ${{ steps.names.outputs.rg-platform }}
          LAW_NAME: ${{ steps.names.outputs.law }}
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          CA_MCP: ${{ steps.names.outputs.ca-mcp }}
          MCP_OVERRIDE: ${{ vars.MLS_MCP_SERVER_URL }}
          # See layer-08-copilot-studio.yml: the variable is deliberately undefined and
          # '/mcp' is the path the server serves.
          ENDPOINT_PATH: ${{ vars.MCP_ENDPOINT_PATH || '/mcp' }}
        run: |
          set -uo pipefail
          resolved=()
          missing=()

          manifest="l7-manifest/l7-verifier-manifest.json"
          if [ -f "${manifest}" ]; then
            echo "MLS_L7_MANIFEST=${GITHUB_WORKSPACE}/${manifest}" >> "${GITHUB_ENV}"
            resolved+=("MLS_L7_MANIFEST (V7.1)")
          else
            missing+=("MLS_L7_MANIFEST (V7.1): no layer-07-deploy-manifest artifact in this run")
          fi

          eval_file="l8-eval/agent-eval-results.json"
          if [ -f "${eval_file}" ]; then
            echo "MLS_EVAL_RESULTS=${GITHUB_WORKSPACE}/${eval_file}" >> "${GITHUB_ENV}"
            resolved+=("MLS_EVAL_RESULTS (V8.2/V8.4/V8.5)")
          else
            missing+=("MLS_EVAL_RESULTS (V8.2/V8.4/V8.5): no layer-08-agent-eval artifact in this run")
          fi

          # L7 V7.3 needs the Log Analytics CUSTOMER id - read from ARM as the Verifier,
          # the same way layer-07-apps.yml's verify job resolves it.
          customer_id="$(az monitor log-analytics workspace show \
            --resource-group "${RG_PLATFORM}" --workspace-name "${LAW_NAME}" \
            --query customerId -o tsv 2>/dev/null || true)"
          if [ -n "${customer_id}" ]; then
            echo "MLS_LAW_CUSTOMER_ID=${customer_id}" >> "${GITHUB_ENV}"
            resolved+=("MLS_LAW_CUSTOMER_ID (V7.3)")
          else
            missing+=("MLS_LAW_CUSTOMER_ID (V7.3): ${LAW_NAME} in ${RG_PLATFORM} not readable")
          fi

          # L8 V8.3/V8.6/V8.7/V8.8 ask the DEPLOYED MCP server. Derived from ARM so a
          # rebuilt Container Apps environment (new domain suffix) cannot leave the child
          # pointing at a dead FQDN - which is the whole point of a rebuild proof.
          url="${MCP_OVERRIDE}"
          if [ -z "${url}" ]; then
            fqdn="$(az containerapp show --resource-group "${RG_APPS}" --name "${CA_MCP}" \
              --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
            if [ -n "${fqdn}" ]; then url="https://${fqdn}${ENDPOINT_PATH}"; fi
          fi
          if [ -n "${url}" ]; then
            echo "MLS_MCP_SERVER_URL=${url}" >> "${GITHUB_ENV}"
            resolved+=("MLS_MCP_SERVER_URL (V8.3/V8.6-V8.8)")
          else
            missing+=("MLS_MCP_SERVER_URL (V8.3/V8.6-V8.8): no ingress FQDN for ${CA_MCP}")
          fi

          {
            echo "### L11 child-audit inputs"
            echo
            echo "Resolved: ${resolved[*]:-none}"
            echo
            echo "Absent (the child criterion reports UNOBSERVABLE, and V11.3 says so):"
            for item in "${missing[@]}"; do echo "- ${item}"; done
            echo "- MLS_L9_RUN_ID / MLS_L9_RELEASE_TAG / MLS_L9_ZAP_RUN_ID (V9.2-V9.4): layer-09-devsecops.yml is not part of infra-up, so this run has none"
            echo "- AlertSurfaceReadable (V10.3): an output of self-heal.yml's select job, which this run does not contain"
          } >> "${GITHUB_STEP_SUMMARY}"

      # L8 V8.6/V8.7 authenticate to the MCP server with mcp-auth-token. The grant in
      # infra/bicep/apps/main.bicep lets mls-verifier read that ONE secret; the value is
      # masked and passed by ENVIRONMENT, never as an argument. Same three-way handling as
      # layer-08-copilot-studio.yml: a value, a genuinely absent secret, and a refusal are
      # reported as three different things, and only the first feeds the child.
      - name: Read mcp-auth-token for the L8 child (Verifier, one secret only)
        env:
          KEY_VAULT_NAME: ${{ steps.names.outputs.key-vault }}
          SECRET_NAME: mcp-auth-token
        run: |
          set -uo pipefail
          stderr_file="$(mktemp)"
          token="$(az keyvault secret show --vault-name "${KEY_VAULT_NAME}" --name "${SECRET_NAME}" \
            --query value -o tsv 2>"${stderr_file}")"
          read_rc=$?
          read_err="$(cat "${stderr_file}")"
          rm -f "${stderr_file}"
          if [ "${read_rc}" -eq 0 ] && [ -n "${token}" ]; then
            echo "::add-mask::${token}"
            echo "MLS_MCP_AUTH_TOKEN=${token}" >> "${GITHUB_ENV}"
            echo "Read '${SECRET_NAME}' from ${KEY_VAULT_NAME} for the L8 child audit."
          elif printf '%s' "${read_err}" | grep -qiE 'SecretNotFound|was not found|not found in this key vault'; then
            echo "::warning title=No MCP auth token::${KEY_VAULT_NAME} holds no '${SECRET_NAME}'. The L8 child's V8.6/V8.7 will report SKIP."
          elif printf '%s' "${read_err}" | grep -qiE 'forbidden|authoriz|access denied|does not have secrets get'; then
            echo "::warning title=Cannot read the MCP auth token::UNOBSERVABLE, not absent: the Verifier was refused by ${KEY_VAULT_NAME}. The L8 child's V8.6/V8.7 will report SKIP."
          else
            echo "::warning title=MCP auth token read failed::Unclassified failure; claiming nothing about the secret. The L8 child's V8.6/V8.7 will report SKIP."
          fi

      - name: Resolve the child-audit selection
        id: children
        env:
          SELECTION: ${{ inputs.l11_child_audit_layers }}
        run: |
          set -euo pipefail
          # 'none' suppresses child audits entirely; the audit then records SKIP for the
          # criteria that depend on them rather than passing without evidence.
          if [ "${SELECTION}" = "none" ]; then
            echo "flag=-SkipChildAudit" >> "${GITHUB_OUTPUT}"
            echo "layers=" >> "${GITHUB_OUTPUT}"
          elif [ -n "${SELECTION}" ]; then
            echo "flag=-ChildAuditLayer" >> "${GITHUB_OUTPUT}"
            echo "layers=${SELECTION}" >> "${GITHUB_OUTPUT}"
          else
            echo "flag=" >> "${GITHUB_OUTPUT}"
            echo "layers=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run verification/layer-11-audit.ps1 (up phase)
        id: audit
        uses: ./.github/actions/layer-audit
        with:
          layer: '11'
          run-budget-minutes: '150'
          args: |
            -Phase
            Up
            -SubscriptionId
            ${{ vars.AZURE_SUBSCRIPTION_ID }}
            -ResourceGroupPrefix
            ${{ steps.names.outputs.prefix }}-rg-
            -Repository
            ${{ github.repository }}
            -UpStartUtc
            ${{ needs.up-clock.outputs.started }}
            -UpCompletedUtc
            ${{ steps.done.outputs.completed }}
            ${{ steps.children.outputs.flag }}
            ${{ steps.children.outputs.layers }}
            ${{ inputs.only_criterion && '-OnlyCriterion' || '' }}
            ${{ inputs.only_criterion }}

      - name: Remove the staged certificate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mls-verifier.pfx'
          if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }

      - name: Upload audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-11-audit-report-up
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: run summary
    needs: [preflight, plan, oidc-login, layer-02, layer-03, layer-04, layer-05, layer-06, layer-07, layer-08]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Bounded: collates results already produced. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 15
    steps:
      - name: Write the layer result table
        env:
          CONFIGURED: ${{ needs.preflight.outputs.configured }}
          MISSING: ${{ needs.preflight.outputs.missing }}
          R_OIDC: ${{ needs.oidc-login.result }}
          R_L2: ${{ needs.layer-02.result }}
          R_L3: ${{ needs.layer-03.result }}
          R_L4: ${{ needs.layer-04.result }}
          R_L5: ${{ needs.layer-05.result }}
          R_L6: ${{ needs.layer-06.result }}
          R_L7: ${{ needs.layer-07.result }}
          R_L8: ${{ needs.layer-08.result }}
        run: |
          set -euo pipefail
          {
            echo "## infra-up results"
            echo
            if [ "${CONFIGURED}" != "true" ]; then
              echo "**Pre-G0 no-op.** Missing demo environment variables: ${MISSING}"
              echo
              echo "Nothing was deployed and nothing failed. Complete G0"
              echo "(\`docs/runbooks/g0-bootstrap.md\`) then L1 step 1"
              echo "(\`docs/runbooks/layers/L01.md\`) to arm this workflow."
              echo
            fi
            echo "| Leg | Result |"
            echo "|---|---|"
            echo "| oidc-login (L1 V1.1) | ${R_OIDC} |"
            echo "| L2 landing zone | ${R_L2} |"
            echo "| L3 Entra | ${R_L3} |"
            echo "| L4 Purview labels | ${R_L4} |"
            echo "| L5 Fabric + seed | ${R_L5} |"
            echo "| L6 platform (+ cost-ingest FinOps leg) | ${R_L6} |"
            echo "| L7 apps | ${R_L7} |"
            echo "| L8 Copilot Studio | ${R_L8} |"
            echo
            echo "Verifier follow-up: \`verification/layer-01-audit.ps1\` … \`layer-08-audit.ps1\`,"
            echo "run as \`mls-verifier\`, reports committed to \`verification/reports/\`."
            echo
            echo "L10 is deliberately NOT in this path: \`apps/vuln-lab/reseed.ps1\` is"
            echo "demo-prep, run from the pre-demo checklist (kill-rebuild.md § 4)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail the run if any selected layer failed
        env:
          RESULTS: ${{ needs.oidc-login.result }} ${{ needs.layer-02.result }} ${{ needs.layer-03.result }} ${{ needs.layer-04.result }} ${{ needs.layer-05.result }} ${{ needs.layer-06.result }} ${{ needs.layer-07.result }} ${{ needs.layer-08.result }}
        run: |
          set -euo pipefail
          case " ${RESULTS} " in
            *" failure "*)
              echo "::error title=infra-up incomplete::At least one layer failed; see the table above."
              exit 1
              ;;
          esac
          echo "No layer reported failure."
