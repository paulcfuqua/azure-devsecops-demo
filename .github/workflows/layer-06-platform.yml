name: layer-06-platform

# =============================================================================
# L6 — Core platform: ACA environment, Log Analytics + App Insights, Key Vault,
#      serverless SQL, cost-export storage.
# Playbook: docs/runbooks/layers/L06.md   Template: infra/bicep/platform/main.bicep
#
# Subscription-scope deployment. The template creates all four demo resource
# groups, so this is the layer that makes `infra-down.yml`'s RG deletes meaningful.
#
# No LLM API key exists anywhere in this system (2026-08-24 amendment): runtime
# LLM work is a Copilot Studio agent, so CI holds no secret at all and this
# workflow writes nothing into Key Vault. The vault is provisioned empty here;
# the system's only stored secret — the Direct Line secret backing the control
# tower's Ask tab — is written at L8, when the agent's channel exists.
#
# Pre-G0 guard: all jobs gated on the `demo` environment variables.
# =============================================================================

on:
  workflow_call:
    inputs:
      location:
        description: Azure region for the platform deployment.
        type: string
        required: false
        default: eastus2
      dry_run:
        description: Run `az deployment sub what-if` only; make no writes.
        type: boolean
        required: false
        default: false
      verify_only:
        description: >-
          Skip the deploy and run only the L6 audit, with both async criteria enforced.
          This is how V6.3 (first cost export, <= 24 h) and V6.4 (SQL auto-pause, +75 min)
          are closed after the layer run recorded them PENDING.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      location:
        description: Azure region for the platform deployment.
        type: string
        required: false
        default: eastus2
      dry_run:
        description: Run `az deployment sub what-if` only; make no writes.
        type: boolean
        required: false
        default: false
      verify_only:
        description: >-
          Skip the deploy and run only the L6 audit, with both async criteria enforced
          (closes the PENDING V6.3 and V6.4 from an earlier run).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # The deployment history entry the L6 layer manifest lives in. L06.md's V6.1
  # query is `az deployment sub show --name layer-06 --query properties.outputs`
  # and verification/layer-06-audit.ps1 defaults -DeploymentName to exactly this,
  # so the name is part of the contract rather than a label. It is deliberately
  # STABLE, not run-scoped: a `verify_only` re-check hours later has to be able to
  # find the manifest without being told which run produced it.
  L6_DEPLOYMENT_NAME: layer-06

jobs:
  preflight:
    name: preflight (demo environment guard)
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      verifier: ${{ steps.verifier.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L6 platform
      - id: verifier
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L6 verification (mls-verifier)

  deploy:
    name: deploy L6 platform
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' && !inputs.verify_only }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      id-token: write
      contents: read
    outputs:
      # The layer manifest, handed to the verify job as explicit audit arguments.
      # Read back out of the deployment outputs rather than reconstructed here, so
      # what the audit checks is what Bicep declared (L06.md: "Expected values
      # resolve from the Bicep-declared manifest, never from a teammate's message").
      sql-database-id: ${{ steps.manifest.outputs.sql-database-id }}
      aca-environment-id: ${{ steps.manifest.outputs.aca-environment-id }}
      law-customer-id: ${{ steps.manifest.outputs.law-customer-id }}
      cost-export-account: ${{ steps.manifest.outputs.cost-export-account }}
      completed-at: ${{ steps.manifest.outputs.completed-at }}
      sql-last-touched: ${{ steps.seeded.outputs.sql-last-touched }}
    env:
      # Consumed by infra/bicep/platform/demo.bicepparam via readEnvironmentVariable().
      AZURE_LOCATION: ${{ inputs.location }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SQL_AAD_ADMIN_LOGIN: ${{ vars.SQL_AAD_ADMIN_LOGIN }}
      SQL_AAD_ADMIN_OBJECT_ID: ${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
      # Set to `recover` in the demo environment when replaying against a
      # soft-deleted vault (kill/rebuild — see the L6 playbook rollback note).
      KEY_VAULT_CREATE_MODE: ${{ vars.KEY_VAULT_CREATE_MODE }}
    steps:
      - uses: actions/checkout@v4

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if the platform deployment
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --location "${AZURE_LOCATION}" \
            --template-file infra/bicep/platform/main.bicep \
            --parameters infra/bicep/platform/demo.bicepparam \
            --name "${L6_DEPLOYMENT_NAME}" \
            | tee what-if-l6.txt

      - name: Deploy the platform
        id: manifest
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          az deployment sub create \
            --location "${AZURE_LOCATION}" \
            --template-file infra/bicep/platform/main.bicep \
            --parameters infra/bicep/platform/demo.bicepparam \
            --name "${L6_DEPLOYMENT_NAME}" \
            --output json > l6-outputs.json
          jq '.properties.outputs' l6-outputs.json > l6-manifest.json

          # The four names verification/layer-06-audit.ps1 resolves the manifest
          # by. They are emitted by infra/bicep/platform/main.bicep specifically
          # for this: before they existed the audit found nothing under any of
          # its accepted aliases and V6.1/V6.2/V6.3/V6.4 all failed with "no
          # <thing> available" — a FAIL manufactured by the pipeline. Failing
          # here instead is deliberate: a manifest the Verifier cannot read is a
          # broken layer, not a broken audit.
          missing=""
          for key in sqlDatabaseId containerAppEnvironmentId lawCustomerId costExportAccountName; do
            value="$(jq -r --arg k "${key}" '.[$k].value // ""' l6-manifest.json)"
            if [ -z "${value}" ]; then
              missing="${missing} ${key}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error title=L6 manifest incomplete::The layer-06 deployment outputs are missing:${missing}. verification/layer-06-audit.ps1 resolves every expected value from these, so the Verifier could not audit this layer."
            exit 1
          fi

          # Recorded BEFORE the seed so it is the deployment's own completion
          # time — V6.3's 24-hour cost-export window opens at L6 completion.
          {
            echo "sql-database-id=$(jq -r '.sqlDatabaseId.value' l6-manifest.json)"
            echo "aca-environment-id=$(jq -r '.containerAppEnvironmentId.value' l6-manifest.json)"
            echo "law-customer-id=$(jq -r '.lawCustomerId.value' l6-manifest.json)"
            echo "cost-export-account=$(jq -r '.costExportAccountName.value' l6-manifest.json)"
            echo "completed-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

          # F4 (compliance/findings/2026-08-26-prepublication-review.md#f4, Task 8):
          # the full manifest carries the subscription ID in every resource ID,
          # plus keyVaultUri, sqlServerFqdn and costExportStorageResourceId, and
          # job summaries on a public repo are readable without authentication.
          # l6-manifest.json itself stays on the runner for the later steps in
          # this job that need it; only a curated, non-sensitive subset below
          # goes into the summary, and none of it is uploaded as an artifact.
          {
            echo "### L6 deployment manifest (selected non-sensitive keys)"
            echo
            echo '```json'
            jq '{
              resourceGroupNames: .resourceGroupNames.value,
              sqlDatabaseName: .sqlDatabaseName.value,
              costExportAccountName: .costExportAccountName.value,
              containerAppsEnvironmentDefaultDomain: .containerAppsEnvironmentDefaultDomain.value
            }' l6-manifest.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Confirm the vault is provisioned and holds no LLM secret
        if: ${{ !inputs.dry_run }}
        env:
          KEY_VAULT_NAME: ${{ steps.names.outputs.key-vault }}
        run: |
          set -euo pipefail
          # Deliberately no secret write. Since the 2026-08-24 amendment there is
          # no LLM API key in this system, so L6 leaves the vault empty. The only
          # stored secret (the Direct Line secret) is written at L8 by
          # layer-08-copilot-studio.yml, once the agent's channel exists.
          az keyvault show --name "${KEY_VAULT_NAME}" --output none
          echo "Key Vault ${KEY_VAULT_NAME} provisioned; no secrets written at L6 by design."

      - name: Wire the Cost Management daily export
        if: ${{ !inputs.dry_run }}
        env:
          RG_OPS: ${{ steps.names.outputs.rg-ops }}
          PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          set -euo pipefail
          # Subscription-scope configuration, not a resource of the template
          # (L06 playbook step 3). Removed again by infra-down.yml so it never
          # points at deleted storage.
          storage_id="$(jq -r '.costExportStorageResourceId.value // empty' l6-manifest.json)"
          if [ -z "${storage_id}" ]; then
            echo "::notice title=Cost export not wired::costExportStorageResourceId was not in the deployment outputs."
            exit 0
          fi
          export_name="${PREFIX}-cost-daily"
          az costmanagement export create \
            --name "${export_name}" \
            --scope "/subscriptions/${AZURE_SUBSCRIPTION_ID}" \
            --storage-account-id "${storage_id}" \
            --storage-container costexports \
            --storage-directory "${RG_OPS}" \
            --timeframe MonthToDate \
            --type ActualCost \
            --recurrence Daily \
            --recurrence-period from="$(date -u +%Y-%m-%dT00:00:00Z)" to="$(date -u -d '+1 year' +%Y-%m-%dT00:00:00Z)" \
            --schedule-status Active \
            --output none
          echo "Cost Management daily export ${export_name} configured."

      - name: Wire the subscription Activity Log to Log Analytics
        if: ${{ !inputs.dry_run }}
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          set -euo pipefail
          # F9 (compliance/findings/2026-08-26-prepublication-review.md#f9,
          # Task 13): subscription-scope configuration, not a resource of the
          # template — same category as the cost-export wiring above.
          #
          # The task brief placed this in layer-02-landing-zone.yml, where the
          # finding's "Activity Log and Entra diagnostics via the L2/L3
          # workflows" fix text also puts it. It cannot live there on a FULL
          # run: infra-up.yml's layer graph has layer-06 needs: [..., layer-04],
          # which needs [..., layer-02] — so when L2 and L6 both run in the same
          # pass, L2 always precedes L6, and teardown deletes mls-rg-platform
          # (and the LAW inside it) every cycle, so a full pass never has the
          # LAW already present by the time L2 runs. (infra-up.yml also supports
          # a skip-tolerant selective replay — `layers: l6` alone, skipping L2 —
          # so "L2 always runs before the LAW exists" is not a universal
          # invariant, only a same-pass one; this step does not depend on that
          # distinction either way.) `az monitor diagnostic-settings
          # subscription create --workspace` resolves and validates that target
          # at request time, so a step placed in L2 would fail (or, written
          # defensively, would skip) on every same-pass invocation. Placed here
          # instead: this is the first point in the graph where
          # logAnalyticsWorkspaceResourceId is a real, deployed resource.
          # Idempotent upsert, like the cost export above — safe to re-run, and
          # re-points at the new LAW automatically on kill/rebuild.
          law_id="$(jq -r '.logAnalyticsWorkspaceResourceId.value // empty' l6-manifest.json)"
          if [ -z "${law_id}" ]; then
            echo "::notice title=Activity Log not wired::logAnalyticsWorkspaceResourceId was not in the deployment outputs."
            exit 0
          fi
          az monitor diagnostic-settings subscription create \
            --name "${PREFIX}-activity-law" \
            --workspace "${law_id}" \
            --location "${AZURE_LOCATION}" \
            --logs '[{"category":"Administrative","enabled":true},{"category":"Security","enabled":true},{"category":"ServiceHealth","enabled":true},{"category":"Alert","enabled":true},{"category":"Recommendation","enabled":true},{"category":"Policy","enabled":true},{"category":"Autoscale","enabled":true},{"category":"ResourceHealth","enabled":true}]' \
            --output none
          echo "Subscription Activity Log routed to ${law_id}."

      # F9 (compliance/findings/2026-08-26-prepublication-review.md#f9, Task
      # 13): Entra ID SignInLogs/AuditLogs diagnostic routing is deliberately
      # NOT a step in this workflow. It was implemented here once (Task 13's
      # fix round), then removed on further review: the only caller-side
      # requirement Microsoft documents for creating this tenant-scoped
      # setting is the Security Administrator (or Global Administrator) Entra
      # directory role, and mls-github-deployer must not hold it — Task 10
      # narrowed this exact SP from Application.ReadWrite.All to
      # .ReadWrite.OwnedBy specifically to shrink its tenant blast radius
      # (finding F8), and granting Security Administrator now would re-inflate
      # precisely what that task closed, for a one-time setting that never
      # needs to be replayed by the kill/rebuild loop. This is a G0 human
      # step instead — docs/runbooks/g0-bootstrap.md § C, item 12 — the same
      # treatment item 4 (the Fabric "service principals can use Fabric APIs"
      # toggle) already gets for a different tenant-level, portal/CLI,
      # one-time setting no pipeline identity should hold standing privilege
      # for. See that runbook item for the exact command; see
      # task-13-report.md's second fix round for the full reasoning.
      - name: Apply the SQL schema and seed the operational tables
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # SqlServer 22+ is required for Invoke-Sqlcmd -AccessToken, which is how
          # the loader authenticates: Entra-only auth is enforced on the server, so
          # no SQL password exists anywhere to fall back on (CLAUDE.md hard rule 5).
          Install-Module SqlServer -Force -Scope CurrentUser -MinimumVersion 22.0.0 -AllowClobber

          $outputs = Get-Content l6-manifest.json -Raw | ConvertFrom-Json
          $sqlFqdn = $outputs.sqlServerFqdn.value
          $sqlDb = $outputs.sqlDatabaseName.value

          if (-not $sqlFqdn -or -not $sqlDb) {
            Write-Host '::error title=SQL outputs missing::The L6 deployment manifest did not carry sqlServerFqdn / sqlDatabaseName, so the schema cannot be applied.'
            exit 1
          }

          $sqlToken = az account get-access-token `
            --resource https://database.windows.net --query accessToken -o tsv
          if (-not $sqlToken) {
            Write-Host '::error title=Token acquisition failed::Could not mint an Azure SQL access token.'
            exit 1
          }

          # Generators must run first: the loader reads data/generated/*.csv.
          Push-Location data
          python -m pip install --upgrade pip
          python -m pip install -r generators/requirements.txt
          python -m generators build
          Pop-Location

          ./data/seed/seed.ps1 `
            -Target sql `
            -SqlServerInstance $sqlFqdn `
            -SqlDatabase $sqlDb `
            -SqlAccessToken $sqlToken `
            -Confirm:$false

      # V6.4's 75-minute idle clock starts at "the last deployment touch of the
      # DB" (L06.md), which is the seed above and nothing later. Recorded here so
      # the audit can compute the deadline instead of assuming the window opened
      # the moment it happened to run — without this it either sleeps out the
      # whole window on the rebuild's critical path or fails a database that has
      # simply not been idle long enough yet. `always()` because a failed seed
      # still touched the database.
      - name: Record when the database was last touched (V6.4 window start)
        id: seeded
        if: ${{ always() && !inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "sql-last-touched=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Upload L6 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: layer-06-platform
          # l6-manifest.json is deliberately NOT here (F4, Task 8): it carries
          # the subscription ID in every resource ID plus keyVaultUri,
          # sqlServerFqdn and costExportStorageResourceId, and artifacts on a
          # public repo are downloadable without authentication.
          path: |
            what-if-l6.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify L6 (mls-verifier)
    needs: [preflight, deploy]
    # `always()` plus the explicit result test so `verify_only` (which skips the
    # deploy job entirely) still verifies. A FAILED deploy is excluded — there is
    # nothing to audit.
    if: >-
      ${{ always()
          && needs.preflight.outputs.configured == 'true'
          && !inputs.dry_run
          && !contains(fromJSON('["failure","cancelled"]'), needs.deploy.result) }}
    runs-on: ubuntu-latest
    environment: verify
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verifier identity not configured
        if: ${{ needs.preflight.outputs.verifier != 'true' }}
        run: |
          set -euo pipefail
          echo "::notice title=L6 not independently verified::AZURE_VERIFIER_CLIENT_ID is not set on the demo environment, so verification/layer-06-audit.ps1 was skipped rather than run as the deployer SP."

      - name: Azure login (OIDC, mls-verifier — Reader only)
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------------------------------------
      # INLINE RUN (the layer's own): the four manifest values come from the
      # deploy job's outputs, and the two async criteria are given their window
      # starts and a ZERO wait budget:
      #
      #   V6.3  first cost export, <= 24 h   -> PENDING with a deadline
      #   V6.4  SQL auto-pause,    +75 min   -> PENDING with a deadline
      #
      # Neither is softened: -SqlPauseWaitMinutes 0 means "evaluate once", and
      # the criterion still FAILs if the deadline has already passed. This is
      # what docs/runbooks/kill-rebuild.md section 5 requires when it excludes
      # both from the <60-minute clock — the alternative is 75 minutes of sleep
      # sitting on the rebuild's critical path, in front of L7 and L8.
      # ---------------------------------------------------------------------
      - name: Run verification/layer-06-audit.ps1 (layer run)
        id: audit
        if: ${{ needs.preflight.outputs.verifier == 'true' && !inputs.verify_only }}
        uses: ./.github/actions/layer-audit
        with:
          layer: '06'
          args: |
            -SubscriptionId
            ${{ vars.AZURE_SUBSCRIPTION_ID }}
            -DeploymentName
            ${{ env.L6_DEPLOYMENT_NAME }}
            -SqlDatabaseId
            ${{ needs.deploy.outputs.sql-database-id }}
            -ContainerAppEnvironmentId
            ${{ needs.deploy.outputs.aca-environment-id }}
            -LogAnalyticsWorkspaceId
            ${{ needs.deploy.outputs.law-customer-id }}
            -CostExportAccountName
            ${{ needs.deploy.outputs.cost-export-account }}
            -LayerCompletedUtc
            ${{ needs.deploy.outputs.completed-at }}
            -SqlLastTouchedUtc
            ${{ needs.deploy.outputs.sql-last-touched }}
            -SqlPauseWaitMinutes
            0

      # ---------------------------------------------------------------------
      # RE-CHECK RUN (`verify_only: true`, dispatched once the windows have
      # elapsed): no deploy, no window starts, no grace. -EnforceCostExport
      # turns V6.3's PENDING into a verdict, and omitting -SqlLastTouchedUtc
      # does the same for V6.4 — a database that is not Paused by now is the
      # idle-cost model being broken, which is what the criterion is for.
      # The manifest is resolved from the layer-06 deployment outputs, which is
      # why that deployment name is stable rather than run-scoped.
      # ---------------------------------------------------------------------
      - name: Run verification/layer-06-audit.ps1 (async re-check)
        id: recheck
        if: ${{ needs.preflight.outputs.verifier == 'true' && inputs.verify_only }}
        uses: ./.github/actions/layer-audit
        with:
          layer: '06'
          args: |
            -SubscriptionId
            ${{ vars.AZURE_SUBSCRIPTION_ID }}
            -DeploymentName
            ${{ env.L6_DEPLOYMENT_NAME }}
            -EnforceCostExport
            -SqlPauseWaitMinutes
            0

      - name: Restate what is still open
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "### L6 — two criteria are still open by design"
            echo
            echo "| Criterion | Window | Closes with |"
            echo "|---|---|---|"
            echo "| V6.3 first cost-export file | 24 h from L6 completion | \`gh workflow run layer-06-platform.yml -f verify_only=true\` |"
            echo "| V6.4 SQL auto-pause | +75 min from the seed | the same run |"
            echo
            echo "Both are recorded PENDING with their deadlines in the L6 report, not"
            echo "passed and not failed. \`kill-rebuild.md\` section 5 excludes both from"
            echo "the <60-minute rebuild clock; that exclusion is only honest if they are"
            echo "actually closed afterwards, so the re-check is not optional."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload audit report
        if: ${{ always() && (steps.audit.outputs.ran == 'true' || steps.recheck.outputs.ran == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: layer-06-audit-report-${{ inputs.verify_only && 'recheck' || 'layer' }}
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30
