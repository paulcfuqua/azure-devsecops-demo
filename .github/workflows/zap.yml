name: zap

# =============================================================================
# OWASP ZAP baseline scan against the staging URL — L9 DevSecOps chain.
# Playbook: docs/runbooks/layers/L09.md (V9.4: report artifact
# `zap-baseline-report` exists and contains zero High-risk alerts).
#
# THE TARGET IS DERIVED, NOT STORED (F144). `vars.STAGING_URL` held
# `mls-launch-ops-demo-ca.thankfulisland-7f9b1aba…` while the live app answered on
# `…happymeadow-9e15a087…`: a Container Apps environment domain is assigned at
# creation and changes on every rebuild, which is the one thing this demo exists
# to do. DNS did not resolve, the scan reached nothing, and the only reason that
# was not a silent pass is the empty-report gate below (F102's fix, working).
# This is F129's class and F90's before it — a rebuild-scoped hostname kept in a
# place a rebuild does not update — so the fix is the same: ask Azure.
#
# Order of precedence: an explicit `target_url` input beats everything (an
# operator scanning something specific), then the FQDN read from the live
# Container App, then `vars.STAGING_URL` as a last resort for a checkout with no
# Azure credentials. A stored value that disagrees with the live one is reported
# as stale rather than silently preferred or silently ignored.
#
# GUARDED: a staging URL only exists after L7 deploys the apps. With no Azure
# credentials, no `target_url` input and no `STAGING_URL`, this workflow reports a
# notice and exits green — it never fails for want of a tenant.
#
# The action itself is run with `fail_action: false` and the High-risk gate is
# applied here, so the report is always produced and archived even on a failing
# scan. An unreachable target produces an empty report, which this workflow
# treats as a FAILURE, not a pass (L09 V9.4 retry note).
#
# `fail_action: false` is necessary and NOT sufficient: it stops the action failing
# on the SCAN's findings, but the action can still fail on its own post-processing,
# and a failed step skips the gate that was supposed to judge the run (F102). When a
# workflow puts the verdict in a step of its own, every step before it has to be
# incapable of pre-empting that verdict.
#
# `allow_issue_writing: false`: the scan must not open GitHub issues. Findings
# ride the PR/report trail like every other check in this repo.
# =============================================================================

on:
  workflow_call:
    inputs:
      target_url:
        description: Staging URL to scan. Empty falls back to vars.STAGING_URL.
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging URL to scan. Empty falls back to vars.STAGING_URL.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  target:
    name: resolve the scan target
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      contents: read
      id-token: write
    outputs:
      # A JSON array of {name, url, classification}. The estate exposes six
      # internet-facing endpoints and this scanned exactly one of them (F155).
      targets: ${{ steps.resolve.outputs.targets }}
      ready: ${{ steps.resolve.outputs.ready }}
      summary: ${{ steps.resolve.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve estate naming
        id: naming
        uses: ./.github/actions/naming

      # Step-level `if:`, never job-level: a job-level condition is evaluated
      # BEFORE the environment resolves, so `vars.*` is always empty there and a
      # guard meaning "skip when unconfigured" means "skip always" (F125).
      - name: Azure login (OIDC, mls-github-deployer)
        id: login
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ENUMERATE THE SURFACE, DO NOT LIST IT (F155). This step used to name one
      # container app. The estate exposes SIX internet-facing endpoints - three
      # Easy Auth apps, the MCP server, and two Function Apps that answer 200 to
      # an anonymous caller with no platform auth at all. The Function Apps had
      # never been scanned and were not even in the register's own list of the
      # attack surface, because that list was written by hand.
      #
      # So ask Azure which things are externally reachable, every run. A surface
      # written down is a surface that goes stale the next time someone deploys.
      - name: Discover every externally reachable endpoint
        id: live
        if: ${{ steps.login.outcome == 'success' }}
        continue-on-error: true
        env:
          RG_APPS: ${{ steps.naming.outputs.rg-apps }}
        run: |
          set -uo pipefail
          hosts=""

          # Container Apps with EXTERNAL ingress. `external == true` is the
          # property that decides internet reachability; an internal-only app
          # (data-api) and one with no ingress at all (vuln-lab) are correctly
          # absent rather than filtered by name.
          while read -r name fqdn; do
            [ -z "${name}" ] && continue
            hosts="${hosts} ${name}=https://${fqdn}"
          done <<< "$(az containerapp list -g "${RG_APPS}" \
              --query "[?properties.configuration.ingress.external].[name,properties.configuration.ingress.fqdn]" \
              -o tsv 2>/dev/null || true)"

          # Function Apps. Public by default and easy to forget precisely because
          # they are not Container Apps - which is how two of them stayed off the
          # scan list entirely.
          while read -r name fqdn; do
            [ -z "${name}" ] && continue
            hosts="${hosts} ${name}=https://${fqdn}"
          done <<< "$(az functionapp list \
              --query "[?state=='Running'].[name,defaultHostName]" -o tsv 2>/dev/null || true)"

          echo "hosts=${hosts}" >> "${GITHUB_OUTPUT}"
          echo "Discovered:${hosts}"

      - name: Build the scan target list
        id: resolve
        env:
          INPUT_URL: ${{ inputs.target_url }}
          HOSTS: ${{ steps.live.outputs.hosts }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail

          # An explicit input still wins - an operator scanning one thing on
          # purpose. Otherwise scan everything the discovery step found.
          candidates=""
          if [ -n "${INPUT_URL}" ]; then
            candidates="operator-supplied=${INPUT_URL}"
          elif [ -n "${HOSTS}" ]; then
            candidates="${HOSTS}"
          elif [ -n "${STAGING_URL}" ]; then
            candidates="staging=${STAGING_URL}"
          fi

          if [ -z "${candidates}" ]; then
            {
              echo "ready=false"
              echo "targets=[]"
              echo "summary=no reachable endpoint"
            } >> "${GITHUB_OUTPUT}"
            echo "::notice title=Nothing to scan::No externally reachable endpoint, no target_url input and no STAGING_URL. ZAP is a post-L7 check; skipping cleanly."
            exit 0
          fi

          # CLASSIFY EACH TARGET BEFORE SCANNING IT (F152). An Easy Auth app
          # answers an anonymous request with a 302 to Entra and a zero-length
          # body; ZAP would report "0 High" about a login redirect. That is not a
          # security result, and the gate below refuses to record it as one.
          classify() {
            local code loc
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" || echo 000)"
            loc="$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 30 "$1" || true)"
            case "${loc}" in
              *login.microsoftonline.com*) echo "auth-wall" ;;
              *) if [ "${code}" = "000" ]; then echo "unreachable"; else echo "content"; fi ;;
            esac
          }

          json="["
          first=1
          scannable=0
          summary=""
          for entry in ${candidates}; do
            name="${entry%%=*}"
            url="${entry#*=}"
            case "${url}" in
              https://*) ;;
              *) echo "::warning title=Skipping non-https target::${name} -> ${url}"; continue ;;
            esac

            host="${url#https://}"; host="${host%%/*}"
            if ! getent hosts "${host}" >/dev/null 2>&1; then
              echo "::warning title=Target does not resolve::${name} (${host}) has no DNS record and cannot be scanned."
              summary="${summary} ${name}:unresolvable"
              continue
            fi

            class="$(classify "${url}")"
            summary="${summary} ${name}:${class}"
            echo "${name} -> ${url} [${class}]"

            # Only reachable content is worth a scan slot. An auth wall is
            # REPORTED, not scanned - scanning it produces a report about Entra.
            if [ "${class}" = "content" ]; then
              scannable=$((scannable + 1))
              [ "${first}" -eq 0 ] && json="${json},"
              json="${json}{\"name\":\"${name}\",\"url\":\"${url}\"}"
              first=0
            fi
          done
          json="${json}]"

          {
            echo "targets=${json}"
            echo "summary=${summary# }"
            echo "ready=$( [ "${scannable}" -gt 0 ] && echo true || echo false )"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## ZAP targets"
            echo
            echo "| Endpoint | Anonymous view |"
            echo "|---|---|"
            for pair in ${summary}; do
              echo "| ${pair%%:*} | ${pair#*:} |"
            done
            echo
            echo "Scanning ${scannable} endpoint(s). \`auth-wall\` entries are behind Easy Auth:"
            echo "an unauthenticated baseline cannot assess them, and a \"0 High\" over a login"
            echo "redirect would be a verdict this scan never earned (F152)."
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${scannable}" -eq 0 ]; then
            echo "::error title=Nothing reachable to scan::Every discovered endpoint is behind an auth wall or unresolvable. ZAP assessed nothing, which is UNOBSERVABLE rather than a pass (F152)."
            exit 1
          fi

  baseline:
    name: ZAP baseline (${{ matrix.target.name }})
    needs: target
    if: ${{ needs.target.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # fail-fast OFF: a run is an expensive observation and it returns everything
      # it saw. One endpoint's High-risk alert must not cancel the scan of five
      # others - that is how a diagnosis rate ends up equal to a deploy rate.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.target.outputs.targets) }}
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run the ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ matrix.target.url }}
          # -a includes alpha passive rules. `-J` is DELIBERATELY ABSENT (F102).
          #
          # This used to read '-a -J report.json', which looks harmless and is not:
          # the action already passes its own `-J report_json.json`, so ZAP received
          # -J twice, the second won, and the file the action then went looking for
          # had never been written:
          #
          #   zap-baseline.py -t <url> -J report_json.json ... -a -J report.json
          #   ##[error]File .../report_json.json does not exist
          #
          # The step failed, and because it failed, "Gate on High-risk alerts" below
          # was SKIPPED - the step that actually owns pass/fail for this workflow. So
          # a scan reporting FAIL-NEW: 0 (zero High, 59 passes) was recorded as a
          # failed security gate that never ran. `fail_action: false` was already set
          # with exactly the right intent; it cannot help when the action fails for a
          # reason of its own.
          #
          # Let the action write its own file, then normalise the name below.
          cmd_options: '-a'
          # The gate below owns pass/fail so the report is always archived.
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-scan-raw-${{ matrix.target.name }}

      # The action writes report_json.json; the artifact contract V9.4 reads is
      # report.json (layer-09-audit.ps1 Test-ZapReport). Renaming here keeps one
      # filename in the contract instead of teaching every consumer both.
      - name: Normalise the JSON report filename
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -s report_json.json ] && [ ! -s report.json ]; then
            cp report_json.json report.json
          fi
          ls -l report*.json report*.html report*.md 2>/dev/null || true

      - name: Publish the report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          # One per target; the merge job below combines them into the single
          # `zap-baseline-report` artifact V9.4 downloads by name, so the audit
          # contract is unchanged while the coverage goes from one endpoint to
          # every reachable one.
          name: zap-baseline-report-${{ matrix.target.name }}
          path: |
            report.json
            report_html.html
            report_md.md
          if-no-files-found: warn
          retention-days: 30

      # always(), because THIS step is the verdict. Without it, any earlier step that
      # fails - the action's own post-processing, an artifact upload hiccup - skips the
      # gate and the job reports a security failure that was never actually assessed
      # (F102). A workflow whose verdict lives in one step has to guarantee that step
      # runs; an unreachable target still fails here, on the gate's own terms, because
      # a missing report is treated as a FAILURE rather than a pass.
      - name: Gate on High-risk alerts
        if: ${{ always() }}
        env:
          TARGET_URL: ${{ matrix.target.url }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          set -euo pipefail
          if [ ! -s report.json ]; then
            echo "::error title=ZAP produced no report::The scan of ${TARGET_URL} produced no report.json. An unreachable target is a FAILURE, not a pass (L09 V9.4)."
            exit 1
          fi

          # URLs the scan actually touched. The target job has already refused to
          # queue anything that answers with a login redirect (F152), so a scan
          # that got here reached real content - this records HOW MUCH, because
          # three URLs means /, /robots.txt and /sitemap.xml: the crawler's own
          # guesses rather than the application.
          scanned_urls="$(jq '[.site[]?.alerts[]?.instances[]?.uri] | unique | length' report.json)"
          echo "${TARGET_NAME}: distinct URLs appearing in alerts: ${scanned_urls}"

          high="$(jq '[.site[]?.alerts[]? | select(.riskdesc | startswith("High"))] | length' report.json)"
          medium="$(jq '[.site[]?.alerts[]? | select(.riskdesc | startswith("Medium"))] | length' report.json)"
          low="$(jq '[.site[]?.alerts[]? | select(.riskdesc | startswith("Low"))] | length' report.json)"
          {
            echo "## ZAP baseline — ${TARGET_NAME}"
            echo
            echo "\`${TARGET_URL}\` · ${scanned_urls} distinct URL(s) reached"
            echo
            echo "| Risk | Alerts |"
            echo "|---|---|"
            echo "| High | ${high} |"
            echo "| Medium | ${medium} |"
            echo "| Low | ${low} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${high}" -gt 0 ]; then
            echo "::error title=ZAP High-risk alerts::${high} High-risk alerts against ${TARGET_URL}. Fix the finding (or rule-tune via a committed zap.conf with justification) — never by editing the report."
            jq -r '.site[]?.alerts[]? | select(.riskdesc | startswith("High")) | "- \(.alert) [\(.riskdesc)]"' report.json
            exit 1
          fi
          echo "Zero High-risk alerts."

  # ---------------------------------------------------------------------------
  # V9.4 downloads an artifact called `zap-baseline-report` and asserts zero
  # High-risk alerts in it. Rather than teach the audit about a matrix, merge the
  # per-target reports into that one name: the criterion is then asserting zero
  # High across EVERY reachable endpoint instead of across one, with no change to
  # the audit at all.
  #
  # `always()`, because a target that failed its own gate still produced a report
  # and the audit must see it. A merge that only runs on success would hide
  # exactly the findings worth having.
  # ---------------------------------------------------------------------------
  merge:
    name: merge the per-target reports
    needs: [target, baseline]
    if: ${{ always() && needs.target.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download every per-target report
        uses: actions/download-artifact@v8
        with:
          pattern: zap-baseline-report-*
          path: reports

      - name: Merge into the single artifact V9.4 reads
        run: |
          set -euo pipefail
          found="$(find reports -name report.json | wc -l)"
          echo "per-target reports found: ${found}"
          if [ "${found}" -eq 0 ]; then
            echo "::error title=No ZAP reports to merge::The matrix produced no report.json. An absent report is a FAILURE, not a pass (L09 V9.4)."
            exit 1
          fi

          # ZAP's report is { "@version": ..., "site": [ ... ] }. Merging is
          # concatenating the site arrays: each entry already carries its own
          # @name, so a reader can still tell the endpoints apart.
          #
          # Built into merged.json and moved, because the inputs are themselves
          # called report.json - writing the output into the same pipeline that
          # reads them is SC2094 and, worse than a lint, a real race.
          find reports -name report.json -print0 \
            | xargs -0 jq -s '{"@version": "merged", "@generated": (now | todate), site: (map(.site // []) | add)}' \
            > merged.json
          mv merged.json report.json

          sites="$(jq '[.site[]?."@name"] | length' report.json)"
          high="$(jq '[.site[]?.alerts[]? | select(.riskdesc | startswith("High"))] | length' report.json)"
          echo "merged ${found} report(s) covering ${sites} site(s); High-risk alerts: ${high}"
          jq -r '.site[]? | "  \(."@name")"' report.json

      - name: Publish the merged report artifact
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: report.json
          if-no-files-found: error
          retention-days: 30
