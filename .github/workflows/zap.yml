name: zap

# =============================================================================
# OWASP ZAP baseline scan against the staging URL — L9 DevSecOps chain.
# Playbook: docs/runbooks/layers/L09.md (V9.4: report artifact
# `zap-baseline-report` exists and contains zero High-risk alerts).
#
# THE TARGET IS DERIVED, NOT STORED (F144). `vars.STAGING_URL` held
# `mls-launch-ops-demo-ca.thankfulisland-7f9b1aba…` while the live app answered on
# `…happymeadow-9e15a087…`: a Container Apps environment domain is assigned at
# creation and changes on every rebuild, which is the one thing this demo exists
# to do. DNS did not resolve, the scan reached nothing, and the only reason that
# was not a silent pass is the empty-report gate below (F102's fix, working).
# This is F129's class and F90's before it — a rebuild-scoped hostname kept in a
# place a rebuild does not update — so the fix is the same: ask Azure.
#
# Order of precedence: an explicit `target_url` input beats everything (an
# operator scanning something specific), then the FQDN read from the live
# Container App, then `vars.STAGING_URL` as a last resort for a checkout with no
# Azure credentials. A stored value that disagrees with the live one is reported
# as stale rather than silently preferred or silently ignored.
#
# GUARDED: a staging URL only exists after L7 deploys the apps. With no Azure
# credentials, no `target_url` input and no `STAGING_URL`, this workflow reports a
# notice and exits green — it never fails for want of a tenant.
#
# The action itself is run with `fail_action: false` and the High-risk gate is
# applied here, so the report is always produced and archived even on a failing
# scan. An unreachable target produces an empty report, which this workflow
# treats as a FAILURE, not a pass (L09 V9.4 retry note).
#
# `fail_action: false` is necessary and NOT sufficient: it stops the action failing
# on the SCAN's findings, but the action can still fail on its own post-processing,
# and a failed step skips the gate that was supposed to judge the run (F102). When a
# workflow puts the verdict in a step of its own, every step before it has to be
# incapable of pre-empting that verdict.
#
# `allow_issue_writing: false`: the scan must not open GitHub issues. Findings
# ride the PR/report trail like every other check in this repo.
# =============================================================================

on:
  workflow_call:
    inputs:
      target_url:
        description: Staging URL to scan. Empty falls back to vars.STAGING_URL.
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging URL to scan. Empty falls back to vars.STAGING_URL.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: zap-baseline
  cancel-in-progress: false

jobs:
  target:
    name: resolve the scan target
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.resolve.outputs.url }}
      ready: ${{ steps.resolve.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve estate naming
        id: naming
        uses: ./.github/actions/naming

      # Step-level `if:`, never job-level: a job-level condition is evaluated
      # BEFORE the environment resolves, so `vars.*` is always empty there and a
      # guard meaning "skip when unconfigured" means "skip always" (F125).
      - name: Azure login (OIDC, mls-github-deployer)
        id: login
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the live ingress FQDN
        id: live
        if: ${{ steps.login.outcome == 'success' }}
        continue-on-error: true
        env:
          APP: ${{ steps.naming.outputs.ca-launch-ops }}
          RG: ${{ steps.naming.outputs.rg-apps }}
        run: |
          set -uo pipefail
          fqdn="$(az containerapp show -n "${APP}" -g "${RG}" \
                    --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || true)"
          echo "fqdn=${fqdn}" >> "${GITHUB_OUTPUT}"
          if [ -n "${fqdn}" ]; then
            echo "Live ingress: ${fqdn}"
          else
            echo "::notice title=No live ingress::${APP} in ${RG} reported no ingress FQDN."
          fi

      - name: Resolve target URL
        id: resolve
        env:
          INPUT_URL: ${{ inputs.target_url }}
          LIVE_FQDN: ${{ steps.live.outputs.fqdn }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          set -euo pipefail
          derived=""
          [ -n "${LIVE_FQDN}" ] && derived="https://${LIVE_FQDN}"

          # An explicit input wins; otherwise the live estate beats the stored value.
          url="${INPUT_URL:-${derived:-${STAGING_URL}}}"

          # A stored value that disagrees with the live one is a trap for the next
          # reader, not just for this run: say so where someone will see it.
          if [ -n "${derived}" ] && [ -n "${STAGING_URL}" ] && [ "${derived}" != "${STAGING_URL}" ]; then
            echo "::warning title=STAGING_URL is stale::The demo variable says ${STAGING_URL}; the live app answers on ${derived}. Scanning the live one. Update or delete the variable — a Container Apps environment domain changes on every rebuild (F144)."
          fi

          if [ -z "${url}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "url=" >> "${GITHUB_OUTPUT}"
            echo "::notice title=No staging URL::No live ingress, no target_url input and no STAGING_URL. ZAP is a post-L7 check; skipping cleanly."
            {
              echo "## ZAP baseline: skipped"
              echo
              echo "No staging URL yet. This is the expected state until L7 deploys"
              echo "launch-ops and the apps resource group has an ingress to read."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          case "${url}" in
            https://*) ;;
            *)
              echo "::error title=Invalid staging URL::The scan target must be an https:// URL."
              exit 1
              ;;
          esac

          # VERIFY THE TARGET CAN BE REACHED BEFORE DECLARING IT VALID (F135's rule,
          # F144's cost). Well-formed and resolvable are different properties, and
          # the old check asserted only the first: the failure surfaced as
          # `docker failed with exit code 3` deep inside the action, which names
          # the symptom and not the cause.
          host="${url#https://}"
          host="${host%%/*}"
          if ! getent hosts "${host}" >/dev/null 2>&1; then
            echo "::error title=Scan target does not resolve::${host} has no DNS record, so ZAP would scan nothing. An unreachable target is a FAILURE, not a pass (L09 V9.4). If this is a Container Apps FQDN from a previous estate, the environment domain changed on rebuild (F144)."
            exit 1
          fi

          echo "ready=true" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

  baseline:
    name: ZAP baseline scan
    needs: target
    if: ${{ needs.target.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run the ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.target.outputs.url }}
          # -a includes alpha passive rules. `-J` is DELIBERATELY ABSENT (F102).
          #
          # This used to read '-a -J report.json', which looks harmless and is not:
          # the action already passes its own `-J report_json.json`, so ZAP received
          # -J twice, the second won, and the file the action then went looking for
          # had never been written:
          #
          #   zap-baseline.py -t <url> -J report_json.json ... -a -J report.json
          #   ##[error]File .../report_json.json does not exist
          #
          # The step failed, and because it failed, "Gate on High-risk alerts" below
          # was SKIPPED - the step that actually owns pass/fail for this workflow. So
          # a scan reporting FAIL-NEW: 0 (zero High, 59 passes) was recorded as a
          # failed security gate that never ran. `fail_action: false` was already set
          # with exactly the right intent; it cannot help when the action fails for a
          # reason of its own.
          #
          # Let the action write its own file, then normalise the name below.
          cmd_options: '-a'
          # The gate below owns pass/fail so the report is always archived.
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-scan-raw

      # The action writes report_json.json; the artifact contract V9.4 reads is
      # report.json (layer-09-audit.ps1 Test-ZapReport). Renaming here keeps one
      # filename in the contract instead of teaching every consumer both.
      - name: Normalise the JSON report filename
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -s report_json.json ] && [ ! -s report.json ]; then
            cp report_json.json report.json
          fi
          ls -l report*.json report*.html report*.md 2>/dev/null || true

      - name: Publish the report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          # Artifact name is load-bearing: V9.4 downloads `zap-baseline-report`.
          name: zap-baseline-report
          path: |
            report.json
            report_html.html
            report_md.md
          if-no-files-found: warn
          retention-days: 30

      # always(), because THIS step is the verdict. Without it, any earlier step that
      # fails - the action's own post-processing, an artifact upload hiccup - skips the
      # gate and the job reports a security failure that was never actually assessed
      # (F102). A workflow whose verdict lives in one step has to guarantee that step
      # runs; an unreachable target still fails here, on the gate's own terms, because
      # a missing report is treated as a FAILURE rather than a pass.
      - name: Gate on High-risk alerts
        if: ${{ always() }}
        env:
          TARGET_URL: ${{ needs.target.outputs.url }}
        run: |
          set -euo pipefail
          if [ ! -s report.json ]; then
            echo "::error title=ZAP produced no report::The scan of ${TARGET_URL} produced no report.json. An unreachable target is a FAILURE, not a pass (L09 V9.4)."
            exit 1
          fi
          high="$(jq '[.site[]?.alerts[]? | select(.riskdesc | startswith("High"))] | length' report.json)"
          medium="$(jq '[.site[]?.alerts[]? | select(.riskdesc | startswith("Medium"))] | length' report.json)"
          low="$(jq '[.site[]?.alerts[]? | select(.riskdesc | startswith("Low"))] | length' report.json)"
          {
            echo "## ZAP baseline — ${TARGET_URL}"
            echo
            echo "| Risk | Alerts |"
            echo "|---|---|"
            echo "| High | ${high} |"
            echo "| Medium | ${medium} |"
            echo "| Low | ${low} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${high}" -gt 0 ]; then
            echo "::error title=ZAP High-risk alerts::${high} High-risk alerts against ${TARGET_URL}. Fix the finding (or rule-tune via a committed zap.conf with justification) — never by editing the report."
            jq -r '.site[]?.alerts[]? | select(.riskdesc | startswith("High")) | "- \(.alert) [\(.riskdesc)]"' report.json
            exit 1
          fi
          echo "Zero High-risk alerts."
