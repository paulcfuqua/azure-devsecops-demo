name: layer-04-purview

# =============================================================================
# L4 — Purview sensitivity labels (<prefix>-public / -internal / -confidential /
# -export-controlled; the prefix is naming.bicep's defaultCompanyPrefix — F32).
# Playbook: docs/runbooks/layers/L04.md   Assets: infra/purview/labels.ps1
#
# labels.ps1 never authenticates on its own: the caller must already hold a
# Security & Compliance PowerShell session (Connect-IPPSSession). S&C PowerShell
# has no OIDC/federated path, so unattended CI needs certificate-based app-only
# auth. This workflow therefore has TWO guards:
#
#   1. the standard `demo` environment guard (pre-G0 no-op), and
#   2. an S&C credential guard — when PURVIEW_APP_ID / PURVIEW_ORGANIZATION /
#      PURVIEW_CERT_BASE64 are absent the apply step skips with a notice and the
#      layer stays a human-run step under the sponsor's login, exactly as the
#      playbook's degrade path allows. It never fails the run.
#
# Labels persist across kill/rebuild by design; their teardown is G3.
# =============================================================================

on:
  workflow_call:
    inputs:
      location:
        description: Unused by L4 (labels are tenant-scoped); accepted for uniform layer calls.
        type: string
        required: false
        default: ''
      dry_run:
        description: Run labels.ps1 with -WhatIf only.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      location:
        description: Unused by L4 (labels are tenant-scoped).
        type: string
        required: false
        default: ''
      dry_run:
        description: Run labels.ps1 with -WhatIf only.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (demo environment + S&C credential guard)
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      verifier: ${{ steps.verifier.outputs.configured }}
      scc: ${{ steps.scc.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L4 Purview
      # The audit opens its OWN read-only Security & Compliance session as
      # mls-verifier (Exchange.ManageAsApp + View-Only Configuration), which is a
      # different credential from the deployer's app-only cert above. All three
      # inputs are required by Resolve-MlsInput, so guarding them here turns a
      # missing one into a named NOTICE instead of an exit-2 stack trace.
      - id: verifier
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          additional: |
            MLS_TENANT_DOMAIN=${{ vars.MLS_TENANT_DOMAIN || vars.PURVIEW_ORGANIZATION }}
            MLS_VERIFIER_APP_ID=${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
            MLS_VERIFIER_CERT_BASE64=${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
          layer: L4 verification (mls-verifier, Security & Compliance app-only)
      - name: Check Security & Compliance app-only credentials
        id: scc
        env:
          PURVIEW_APP_ID: ${{ vars.PURVIEW_APP_ID }}
          PURVIEW_ORGANIZATION: ${{ vars.PURVIEW_ORGANIZATION }}
          PURVIEW_CERT_BASE64: ${{ secrets.PURVIEW_CERT_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${PURVIEW_APP_ID}" ] && [ -n "${PURVIEW_ORGANIZATION}" ] && [ -n "${PURVIEW_CERT_BASE64}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=L4 runs under the human login::Security & Compliance app-only credentials are not configured (PURVIEW_APP_ID / PURVIEW_ORGANIZATION / PURVIEW_CERT_BASE64). labels.ps1 is a human-run step for this cycle; see docs/runbooks/layers/L04.md."
          fi

  apply:
    name: apply L4 label taxonomy
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' && needs.preflight.outputs.scc == 'true' }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install ExchangeOnlineManagement
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ExchangeOnlineManagement -Force -Scope CurrentUser -AllowClobber

      - name: Connect S&C PowerShell and apply the label taxonomy
        shell: pwsh
        env:
          PURVIEW_APP_ID: ${{ vars.PURVIEW_APP_ID }}
          PURVIEW_ORGANIZATION: ${{ vars.PURVIEW_ORGANIZATION }}
          PURVIEW_CERT_BASE64: ${{ secrets.PURVIEW_CERT_BASE64 }}
          PURVIEW_CERT_PASSWORD: ${{ secrets.PURVIEW_CERT_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'purview-app.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PURVIEW_CERT_BASE64))
          try {
            Import-Module ExchangeOnlineManagement
            $connect = @{
              AppId        = $env:PURVIEW_APP_ID
              Organization = $env:PURVIEW_ORGANIZATION
              ShowBanner   = $false
            }
            if ($env:PURVIEW_CERT_PASSWORD) {
              $connect['Certificate'] = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                $pfx, (ConvertTo-SecureString $env:PURVIEW_CERT_PASSWORD -AsPlainText -Force))
            }
            else {
              $connect['CertificateFilePath'] = $pfx
            }
            Connect-IPPSSession @connect
            if ($env:DRY_RUN -eq 'true') {
              ./infra/purview/labels.ps1 -WhatIf *>&1 | Tee-Object -FilePath purview-plan.txt
            }
            else {
              ./infra/purview/labels.ps1 -Confirm:$false *>&1 | Tee-Object -FilePath purview-apply.txt
            }
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            Disconnect-ExchangeOnline -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Upload the label transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-04-purview
          path: |
            purview-plan.txt
            purview-apply.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify L4 (mls-verifier)
    needs: [preflight, apply]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.apply.result != 'failure' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: verify
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verifier Security & Compliance credentials not configured
        if: ${{ needs.preflight.outputs.verifier != 'true' }}
        run: |
          set -euo pipefail
          echo "::notice title=L4 not independently verified::verification/layer-04-audit.ps1 needs its own read-only S&C session as mls-verifier and one of AZURE_VERIFIER_CLIENT_ID / MLS_TENANT_DOMAIN / MLS_VERIFIER_APP_ID / MLS_VERIFIER_CERT_BASE64 is absent. S&C PowerShell has no OIDC path, so certificate app-only auth is the only unattended option; without it the label audit stays a human-run step under the sponsor's login, exactly as the L04 playbook's degrade path allows. Nothing was verified and nothing was faked."

      - name: Azure login (OIDC, mls-verifier)
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Connect-IPPSSession -CertificateThumbprint resolves the certificate out of
      # the CurrentUser\My store, so the PFX has to be IN that store before the
      # audit runs. .NET implements that store on Linux too (it lives under
      # ~/.dotnet/corefx/cryptography/x509stores/my), which is why this uses the
      # X509Store API rather than Import-PfxCertificate — the latter is a
      # Windows-only cmdlet and does not exist on the runner. The thumbprint is
      # derived from the certificate itself so there is no fourth variable to keep
      # in step, and the PFX is removed from disk immediately.
      - name: Install the mls-verifier certificate and install ExchangeOnlineManagement
        id: cert
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        shell: pwsh
        env:
          MLS_VERIFIER_CERT_BASE64: ${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
          MLS_VERIFIER_CERT_PASSWORD: ${{ secrets.MLS_VERIFIER_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ExchangeOnlineManagement -Force -Scope CurrentUser -AllowClobber

          $pfxPath = Join-Path $env:RUNNER_TEMP 'mls-verifier.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MLS_VERIFIER_CERT_BASE64))
          try {
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor
                     [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            $certificate = if ($env:MLS_VERIFIER_CERT_PASSWORD) {
              [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                $pfxPath, (ConvertTo-SecureString $env:MLS_VERIFIER_CERT_PASSWORD -AsPlainText -Force), $flags)
            }
            else {
              [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, '', $flags)
            }
            $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
            $store.Open('ReadWrite')
            $store.Add($certificate)
            $store.Close()
            "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Installed the mls-verifier certificate (thumbprint $($certificate.Thumbprint), expires $($certificate.NotAfter.ToString('u')))."
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      # -Checkpoint layer: this is the layer's own run. L11 re-runs the same script
      # with -Checkpoint post-down / post-up, which is how V4.2 proves the labels
      # and their GUIDs survived a kill/rebuild cycle.
      - name: Run verification/layer-04-audit.ps1
        id: audit
        if: ${{ needs.preflight.outputs.verifier == 'true' }}
        uses: ./.github/actions/layer-audit
        with:
          layer: '04'
          # This job's timeout-minutes is 45, not the usual 60, so the audit gets a
          # smaller retry budget and still leaves room to write its report (F58).
          run-budget-minutes: '30'
          args: |
            -Organization
            ${{ vars.MLS_TENANT_DOMAIN || vars.PURVIEW_ORGANIZATION }}
            -VerifierAppId
            ${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
            -CertificateThumbprint
            ${{ steps.cert.outputs.thumbprint }}
            -Checkpoint
            layer
            -LabelGuidPath
            verification/reports/label-guids.json

      - name: Upload audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-04-audit-report
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30
