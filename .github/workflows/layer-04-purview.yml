name: layer-04-purview

# =============================================================================
# L4 — Purview sensitivity labels (<prefix>-public / -internal / -confidential /
# -export-controlled; the prefix is naming.bicep's defaultCompanyPrefix — F32).
# Playbook: docs/runbooks/layers/L04.md   Assets: infra/purview/labels.ps1
#
# labels.ps1 never authenticates on its own: the caller must already hold a
# Security & Compliance PowerShell session (Connect-IPPSSession). S&C PowerShell
# has no OIDC/federated path, so unattended CI needs certificate-based app-only
# auth. This workflow therefore has TWO guards:
#
#   1. the standard `demo` environment guard (pre-G0 no-op), and
#   2. an S&C credential guard — when PURVIEW_APP_ID / PURVIEW_ORGANIZATION /
#      PURVIEW_CERT_BASE64 are absent the apply step skips with a notice and the
#      layer stays a human-run step under the sponsor's login, exactly as the
#      playbook's degrade path allows. It never fails the run.
#
# Labels persist across kill/rebuild by design; their teardown is G3.
# =============================================================================

on:
  workflow_call:
    inputs:
      location:
        description: Unused by L4 (labels are tenant-scoped); accepted for uniform layer calls.
        type: string
        required: false
        default: ''
      dry_run:
        description: Run labels.ps1 with -WhatIf only.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      location:
        description: Unused by L4 (labels are tenant-scoped).
        type: string
        required: false
        default: ''
      dry_run:
        description: Run labels.ps1 with -WhatIf only.
        type: boolean
        required: false
        default: false

      only_criterion:
        description: >-
          Verify only these criteria, e.g. `V4.2` or `V4.1,V4.3`. Everything else
          reports SKIP and the audit exits 3 - a DIAGNOSTIC, never a sign-off. Re-testing
          one criterion should not cost a whole audit's wall clock (P-10). Leave empty for
          a verdict.
        type: string
        required: false
        default: ''
permissions:
  contents: read

jobs:
  preflight:
    name: preflight (demo environment + S&C credential guard)
    runs-on: ubuntu-latest
    # Bounded: reads repository variables and nothing else. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 10
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      # No `verifier` output: it is decided inside the `verify` job now, the only
      # one that can see MLS_VERIFIER_CERT_BASE64 at all (F170).
      scc: ${{ steps.scc.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: L4 Purview
      # THE VERIFIER GUARD IS NOT HERE ANY MORE, AND THAT IS THE FIX (F170).
      # It read `secrets.MLS_VERIFIER_CERT_BASE64` from a job declaring
      # `environment: demo`, but that secret lives on `verify`. An absent GitHub secret is
      # the empty string, so the guard reported "not configured" on every run and L4's
      # independent audit took its degrade path unconditionally. It now runs inside the
      # `verify` job, which declares `environment: verify` and can actually see it.
      - name: Check Security & Compliance app-only credentials
        id: scc
        env:
          PURVIEW_APP_ID: ${{ vars.PURVIEW_APP_ID }}
          PURVIEW_ORGANIZATION: ${{ vars.PURVIEW_ORGANIZATION }}
          PURVIEW_CERT_BASE64: ${{ secrets.PURVIEW_CERT_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${PURVIEW_APP_ID}" ] && [ -n "${PURVIEW_ORGANIZATION}" ] && [ -n "${PURVIEW_CERT_BASE64}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=L4 runs under the human login::Security & Compliance app-only credentials are not configured (PURVIEW_APP_ID / PURVIEW_ORGANIZATION / PURVIEW_CERT_BASE64). labels.ps1 is a human-run step for this cycle; see docs/runbooks/layers/L04.md."
          fi

  apply:
    name: apply L4 label taxonomy
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' && needs.preflight.outputs.scc == 'true' }}
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    environment: demo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install ExchangeOnlineManagement (pinned)
        uses: ./.github/actions/install-exo

      - name: Connect S&C PowerShell and apply the label taxonomy
        shell: pwsh
        env:
          PURVIEW_APP_ID: ${{ vars.PURVIEW_APP_ID }}
          PURVIEW_ORGANIZATION: ${{ vars.PURVIEW_ORGANIZATION }}
          PURVIEW_CERT_BASE64: ${{ secrets.PURVIEW_CERT_BASE64 }}
          PURVIEW_CERT_PASSWORD: ${{ secrets.PURVIEW_CERT_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'purview-app.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PURVIEW_CERT_BASE64))
          try {
            Import-Module ExchangeOnlineManagement
            $connect = @{
              AppId        = $env:PURVIEW_APP_ID
              Organization = $env:PURVIEW_ORGANIZATION
              ShowBanner   = $false
            }
            if ($env:PURVIEW_CERT_PASSWORD) {
              $connect['Certificate'] = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
                $pfx, (ConvertTo-SecureString $env:PURVIEW_CERT_PASSWORD -AsPlainText -Force))
            }
            else {
              $connect['CertificateFilePath'] = $pfx
            }
            Connect-IPPSSession @connect
            if ($env:DRY_RUN -eq 'true') {
              ./infra/purview/labels.ps1 -WhatIf *>&1 | Tee-Object -FilePath purview-plan.txt
            }
            else {
              ./infra/purview/labels.ps1 -Confirm:$false *>&1 | Tee-Object -FilePath purview-apply.txt
            }
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            Disconnect-ExchangeOnline -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Upload the label transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-04-purview
          path: |
            purview-plan.txt
            purview-apply.txt
          if-no-files-found: warn
          retention-days: 14

  protect:
    name: apply L4 table protection (CLS + RLS)
    # DELIBERATELY `needs: preflight`, NOT `needs: apply`. The two halves of L4 are
    # independent and only one of them enforces anything: labels CLASSIFY, and column-
    # and row-level security ENFORCE. `apply` is skipped whenever the Security &
    # Compliance app-only credentials are absent, and gating enforcement on the
    # classification layer's credentials would mean a missing Purview certificate
    # silently leaves the sensitive tables readable by every tier. A label has never
    # gated a read (F18); it must not gate a deploy either.
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    # Bounded for the same reason every other job here is (F81).
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply column- and row-level security to the sensitive tables
        shell: pwsh
        env:
          MLS_COMPANY_PREFIX: ${{ vars.MLS_COMPANY_PREFIX }}
          LAKEHOUSE_NAME: ${{ vars.MLS_LAKEHOUSE_NAME }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'

          # SqlServer 22+ is required for Invoke-Sqlcmd -AccessToken, which is how this
          # authenticates: the endpoint enforces Entra-only auth, so there is no password
          # anywhere to fall back on (CLAUDE.md hard rule 5).
          Install-Module SqlServer -Force -Scope CurrentUser -MinimumVersion 22.0.0 -AllowClobber

          Import-Module ./infra/fabric/fabric-api.psm1 -Force

          # The SQL endpoint FQDN is RESOLVED from the Fabric API, never stored. It is
          # regenerated on every rebuild, so a value pinned in a variable is correct until
          # the first teardown and wrong silently afterwards - F129's class, the same one
          # that put a Container Apps FQDN in a GitHub variable.
          $fabricToken = az account get-access-token `
            --resource https://api.fabric.microsoft.com --query accessToken -o tsv
          if (-not $fabricToken) {
            Write-Host '::error title=Token acquisition failed::Could not mint a Fabric token; the protection step cannot resolve its endpoint.'
            exit 1
          }

          $prefix = if ($env:MLS_COMPANY_PREFIX) { $env:MLS_COMPANY_PREFIX } else { 'mls' }
          $workspaceName = "$prefix-operations"
          $lakehouseName = if ($env:LAKEHOUSE_NAME) { $env:LAKEHOUSE_NAME } else { 'mls_operations' }

          $workspace = Get-FabricWorkspace -Token $fabricToken -Name $workspaceName
          if (-not $workspace) { throw "Fabric workspace '$workspaceName' not found. L5 must run before L4 can protect its tables." }

          $lakehouse = Get-FabricLakehouse -Token $fabricToken -WorkspaceId $workspace.id -Name $lakehouseName
          if (-not $lakehouse) { throw "Lakehouse '$lakehouseName' not found in workspace '$workspaceName'." }

          $endpoint = $lakehouse.properties.sqlEndpointProperties.connectionString
          if (-not $endpoint) { throw "Lakehouse '$lakehouseName' reports no SQL analytics endpoint yet. It provisions asynchronously after creation; re-run once provisioningStatus is Success." }
          Write-Host "Resolved SQL analytics endpoint for '$lakehouseName'."

          $sqlToken = az account get-access-token `
            --resource https://database.windows.net --query accessToken -o tsv
          if (-not $sqlToken) {
            Write-Host '::error title=Token acquisition failed::Could not mint a SQL token for the lakehouse endpoint.'
            exit 1
          }

          # NO continue-on-error anywhere in this step. A step allowed to fail is a step
          # nobody is watching (F119), and this one is the difference between a restricted
          # table and one that merely looks restricted. If it fails, L4 fails.
          $common = @{
            SqlEndpoint = $endpoint
            AccessToken = $sqlToken
            Database    = $lakehouseName
            Prefix      = $prefix
          }
          if ($env:DRY_RUN -eq 'true') {
            ./infra/fabric/protect-tables.ps1 @common -WhatIf *>&1 | Tee-Object -FilePath protection-plan.txt
          }
          else {
            ./infra/fabric/protect-tables.ps1 @common -Confirm:$false *>&1 | Tee-Object -FilePath protection-apply.txt
          }

      - name: Upload the protection transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-04-protection
          path: |
            protection-plan.txt
            protection-apply.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: verify L4 (mls-verifier)
    # `protect` IS IN needs FOR ORDERING, not for its result. Without it the verify job
    # runs in PARALLEL with the protection it is meant to audit, and V4.4 reads
    # sys.database_permissions before the DENYs exist - failing an estate that is
    # mid-deploy, with a verdict that would have been correct thirty seconds later.
    # always() keeps it running even when protect fails, because "the protection is
    # missing" is exactly the state V4.4 should then report.
    needs: [preflight, apply, protect]
    if: ${{ always() && needs.preflight.outputs.configured == 'true' && needs.apply.result != 'failure' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: verify
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Decided HERE, not in preflight, because this job declares `environment: verify` and
      # is the only one that can see MLS_VERIFIER_CERT_BASE64 (F170). The audit opens its
      # OWN read-only Security & Compliance session as mls-verifier (Exchange.ManageAsApp +
      # a read-only compliance role), a different credential from the deployer's app-only
      # cert. NOTE: that grant does not exist in the tenant yet - see g0 step 11d (F177).
      # All three inputs are required by Resolve-MlsInput, so guarding them turns a missing
      # one into a named NOTICE instead of an exit-2 stack trace — but it has to guard on
      # values it can actually read, or the NOTICE is what every run gets.
      - id: verifier
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          additional: |
            MLS_TENANT_DOMAIN=${{ vars.MLS_TENANT_DOMAIN || vars.PURVIEW_ORGANIZATION }}
            MLS_VERIFIER_APP_ID=${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
            MLS_VERIFIER_CERT_BASE64=${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
          layer: L4 verification (mls-verifier, Security & Compliance app-only)

      - name: Verifier Security & Compliance credentials not configured
        if: ${{ steps.verifier.outputs.configured != 'true' }}
        run: |
          set -euo pipefail
          echo "::notice title=L4 not independently verified::verification/layer-04-audit.ps1 needs its own read-only S&C session as mls-verifier and one of AZURE_VERIFIER_CLIENT_ID / MLS_TENANT_DOMAIN / MLS_VERIFIER_APP_ID / MLS_VERIFIER_CERT_BASE64 is absent. S&C PowerShell has no OIDC path, so certificate app-only auth is the only unattended option; without it the label audit stays a human-run step under the sponsor's login, exactly as the L04 playbook's degrade path allows. Nothing was verified and nothing was faked."

      - name: Azure login (OIDC, mls-verifier)
        if: ${{ steps.verifier.outputs.configured == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_VERIFIER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install ExchangeOnlineManagement (pinned)
        if: ${{ steps.verifier.outputs.configured == 'true' }}
        uses: ./.github/actions/install-exo

      - name: Stage the mls-verifier certificate
        id: cert
        if: ${{ steps.verifier.outputs.configured == 'true' }}
        shell: pwsh
        env:
          MLS_VERIFIER_CERT_BASE64: ${{ secrets.MLS_VERIFIER_CERT_BASE64 }}
        run: |
          # A FILE, NOT THE CERTIFICATE STORE. This step used to import the PFX into
          # CurrentUser\My and hand the audit a thumbprint, reasoning that .NET
          # implements that store on Linux too. The store part is true; the conclusion
          # was not. `-CertificateThumbprint` is a Windows-only DYNAMIC parameter of
          # Connect-IPPSSession -- the module adds it only `if($IsWindows)` -- so on
          # ubuntu-latest the audit died at parameter binding before opening a
          # connection, and exited 2 without recording a criterion (F176). Nobody saw
          # it for the life of the project because this job's credential guard read a
          # `verify` secret from a job declaring `environment: demo`, so it skipped
          # green on every run there has ever been (F170/F175).
          #
          # The apply job sixty lines above uses -Certificate / -CertificateFilePath,
          # which the module adds on EVERY platform, and it has always worked. This is
          # now the same path. The PFX stays in RUNNER_TEMP until the audit has read
          # it and is removed by the cleanup step below, whatever the verdict.
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mls-verifier.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:MLS_VERIFIER_CERT_BASE64))
          "MLS_VERIFIER_CERT_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Staged the mls-verifier PFX at $pfxPath ($((Get-Item $pfxPath).Length) bytes)."

      # -Checkpoint layer: this is the layer's own run. L11 re-runs the same script
      # with -Checkpoint post-down / post-up, which is how V4.2 proves the labels
      # and their GUIDs survived a kill/rebuild cycle.
      # V4.4 reads the lakehouse SQL analytics endpoint for the protection artefacts.
      # Resolved here, never stored: the FQDN regenerates on every rebuild (F129's class).
      # Fail-soft on purpose - if the endpoint cannot be resolved the audit still runs and
      # V4.4 reports UNOBSERVABLE, which is the honest outcome. It must never report the
      # protection absent because a lookup failed (F105).
      - name: Resolve the lakehouse SQL analytics endpoint
        id: endpoint
        continue-on-error: true
        shell: pwsh
        env:
          MLS_COMPANY_PREFIX: ${{ vars.MLS_COMPANY_PREFIX }}
          LAKEHOUSE_NAME: ${{ vars.MLS_LAKEHOUSE_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./infra/fabric/fabric-api.psm1 -Force
          $prefix = if ($env:MLS_COMPANY_PREFIX) { $env:MLS_COMPANY_PREFIX } else { 'mls' }
          $lakehouseName = if ($env:LAKEHOUSE_NAME) { $env:LAKEHOUSE_NAME } else { 'mls_operations' }
          $fabricToken = az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv
          $workspace = Get-FabricWorkspace -Token $fabricToken -Name "$prefix-operations"
          $lakehouse = Get-FabricLakehouse -Token $fabricToken -WorkspaceId $workspace.id -Name $lakehouseName
          $endpoint = $lakehouse.properties.sqlEndpointProperties.connectionString
          $sqlToken = az account get-access-token --resource https://database.windows.net --query accessToken -o tsv
          "endpoint=$endpoint" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "lakehouse=$lakehouseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prefix=$prefix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # The token goes through the environment, not an output: step outputs are not
          # masked and a process argument is visible on the runner.
          "MLS_SQL_ACCESS_TOKEN=$sqlToken" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved the SQL analytics endpoint for '$lakehouseName'."

      # F119: this step is allowed to fail, so something must assert the state it was
      # meant to produce. Nothing here does that silently - V4.4 itself is that assertion,
      # and it reports UNOBSERVABLE rather than passing when the endpoint is missing.
      - name: Note when the endpoint could not be resolved
        if: ${{ steps.endpoint.outcome == 'failure' }}
        run: echo "::warning title=SQL endpoint unresolved::V4.4 will report UNOBSERVABLE - it cannot read the table-protection artefacts. This is not a pass and not a claim that the protection is missing."

      - name: Run verification/layer-04-audit.ps1
        id: audit
        if: ${{ steps.verifier.outputs.configured == 'true' }}
        uses: ./.github/actions/layer-audit
        # The PFX password reaches the audit here rather than through GITHUB_ENV: a
        # path is not a secret and a password is, and a step-level env var is visible
        # to the child process the composite action starts.
        env:
          MLS_VERIFIER_CERT_PASSWORD: ${{ secrets.MLS_VERIFIER_CERT_PASSWORD }}
        with:
          layer: '04'
          # This job's timeout-minutes is 45, not the usual 60, so the audit gets a
          # smaller retry budget and still leaves room to write its report (F58).
          run-budget-minutes: '30'
          args: |
            -Organization
            ${{ vars.MLS_TENANT_DOMAIN || vars.PURVIEW_ORGANIZATION }}
            -VerifierAppId
            ${{ vars.MLS_VERIFIER_APP_ID || vars.AZURE_VERIFIER_CLIENT_ID }}
            -CertificateFilePath
            ${{ env.MLS_VERIFIER_CERT_PATH }}
            -Checkpoint
            layer
            -LabelGuidPath
            verification/reports/label-guids.json
            ${{ steps.endpoint.outputs.endpoint && '-SqlEndpoint' || '' }}
            ${{ steps.endpoint.outputs.endpoint }}
            ${{ steps.endpoint.outputs.lakehouse && '-LakehouseName' || '' }}
            ${{ steps.endpoint.outputs.lakehouse }}
            ${{ steps.endpoint.outputs.prefix && '-ProtectionPrefix' || '' }}
            ${{ steps.endpoint.outputs.prefix }}

            ${{ inputs.only_criterion && '-OnlyCriterion' || '' }}
            ${{ inputs.only_criterion }}
      - name: Remove the staged certificate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mls-verifier.pfx'
          if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }

      - name: Upload audit report
        if: ${{ always() && steps.audit.outputs.ran == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: layer-04-audit-report
          path: verification/reports/
          if-no-files-found: warn
          retention-days: 30
