name: app-mcp-tools-ci

# =============================================================================
# Path-filtered CI for apps/mcp-tools (L8).
# Playbook: docs/runbooks/layers/L08.md
# Amendment in force: docs/superpowers/specs/2026-08-24-amendment-copilot-studio.md
#
# build -> test (MCP client handshake + tool allowlist) -> tool eval
#       -> container build -> Trivy (fail on CRITICAL) -> smoke-test
#       (F22: docker run + /healthz) -> GHCR push
#       -> deploy to ACA via OIDC (guarded on the demo environment).
#
# This package is the MCP tool server the Copilot Studio agent attaches to. It
# runs NO model in-process, holds no key, and issues no token: the container app
# ingress is the security boundary. There is deliberately no LLM secret here to
# guard, which is what makes the amendment's "no stored secrets" absolute.
#
# ---------------------------------------------------------------------------
# OPEN ITEM P-7 — CLOSED by the amendment. This package no longer depends on the
# sibling @mls/spec-renderer (nothing here emits a component spec; the Copilot
# Studio agent renders Adaptive Cards), so no `npm run build:renderer` step is
# needed before the image build. The build context is still the repo root so the
# workspace lockfile is present for `npm ci`.
#
# OPEN ITEM P-1 — target port. The image serves on 8080 (Node, PORT=8080 in the
# Dockerfile) but infra/bicep/apps/demo.bicepparam may still default the
# container app's target port to the placeholder 80. Set MCP_TOOLS_PORT=8080 in
# the `demo` GitHub environment once the first real image publishes. Ingress is
# deliberately NOT mutated here — closing P-1 is an explicit config change.
# ---------------------------------------------------------------------------
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - apps/mcp-tools/**
      - package.json
      - package-lock.json
      - .github/workflows/app-mcp-tools-ci.yml
  # NO `paths:` FILTER HERE, AND THAT IS THE POINT. Read this before adding one
  # back.
  #
  # The `image` job below is the only thing in this repository that runs the
  # Trivy CRITICAL gate and F22's boot smoke test. Both were advisory until
  # 2026-08-28: the branch ruleset's required checks were lint-ci, CodeQL,
  # gitleaks and pytest, and not one image job. A pull request whose container
  # image failed to scan, or could not start at all, satisfied every rule the
  # ruleset had. That is not hypothetical -- PR #37, which fixed exactly those
  # two defects, could itself have been merged with both still in it.
  #
  # Making the image job a REQUIRED check is what closes that, and a required
  # check must be able to report on every pull request. A `paths:`-filtered
  # workflow does not run at all when the filter misses, GitHub never receives
  # a conclusion for the context, and the pull request stays pending forever.
  # So the filter comes off the `pull_request` trigger and stays on `push`,
  # where nothing is gated on it and skipping the work is free.
  #
  # The cost is one container build per pull request. It is not a push: this
  # job's build step is `push: false` on pull requests and the GHCR login and
  # push steps are `if: github.event_name != 'pull_request'`, so a pull-request
  # run writes nothing to the registry and consumes only Actions time, which is
  # free on a public repository.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-mcp-tools-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/mcp-tools
  APP_SLUG: mcp-tools
  WORKSPACE: apps/mcp-tools

jobs:
  preflight:
    name: preflight (demo environment guard)
    # Fork pull requests must not reach the `demo` environment. This job mints no
    # OIDC token (top-level permissions are contents: read), so it was never a
    # credential path — but a public-repo PR should not touch a deployment
    # environment at all, and the deploy job below carries the same guard.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
    steps:
      - uses: actions/checkout@v7
      - id: guard
        uses: ./.github/actions/demo-env-guard
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          layer: mcp-tools deploy

  build-test:
    name: build, test and tool eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate the deterministic dataset the tools read
        run: |
          set -euo pipefail
          cd data
          python -m generators build

      - name: Typecheck and build mcp-tools
        run: |
          set -euo pipefail
          npm run typecheck --workspace "${WORKSPACE}"
          npm run build --workspace "${WORKSPACE}"

      - name: Unit tests (tool allowlist + live MCP client handshake)
        run: npm run test --workspace "${WORKSPACE}"

      - name: Golden-question eval against the local MCP endpoint
        run: npm run eval --workspace "${WORKSPACE}"

      - name: Upload eval results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-tools-eval-results
          path: apps/mcp-tools/evals/eval-results.json
          if-no-files-found: warn
          retention-days: 14

  image:
    # Named per app, not just "container build, scan and push": all five
    # app-*-ci.yml workflows run this job on every pull request now, and a
    # required status check is matched by the check run's NAME. Five check
    # runs sharing one name cannot be required unambiguously.
    name: container build, scan and push (mcp-tools)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
      # The digest of what was actually pushed. L7's V7.1 binds the live
      # endpoint to the audited build by comparing the health payload's
      # content-hash marker with this, so it has to travel from the only
      # step that knows it to the deploy step that stamps it on the app.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute the GHCR reference
        id: tag
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          registry="ghcr.io/$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')/${APP_SLUG}"
          tag="sha-${GITHUB_SHA:0:7}"
          {
            echo "registry=${registry}"
            echo "tag=${tag}"
            echo "image=${registry}:${tag}"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image (context = repo root for the workspace lockfile)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=mcp-tools
          cache-to: type=gha,mode=max,scope=mcp-tools

      - name: Trivy gate — fail the build on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: table
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy SARIF for the Security tab (non-blocking)
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-mcp-tools.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload the Trivy SARIF
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('trivy-mcp-tools.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-mcp-tools.sarif
          category: trivy-mcp-tools

      - name: Smoke-test the image — boot it and check its own /healthz (F22)
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          set -euo pipefail
          # F22: CI built and Trivy-scanned this image but never started it.
          # mcp-tools REFUSES TO BOOT without MCP_AUTH_TOKEN unless explicitly
          # told to run open (F2's fix -- see src/auth-gate.ts::loadInboundAuth,
          # which throws at startup in every mode otherwise, not just cloud). A
          # plain `docker run` of this image would exit immediately and look
          # like an image defect rather than a missing setting.
          # MCP_ALLOW_UNAUTHENTICATED is a boolean opt-out, NOT a token: it
          # authenticates nothing, and /healthz is unauthenticated at the
          # ingress regardless (the gate is scoped to the MCP_PATH route only)
          # -- it exists purely so this smoke test's container can start.
          #
          # Placed after the Trivy CRITICAL gate (a vulnerable image is never
          # even started) and before "Log in to GHCR" (no registry credential
          # has entered the job's environment yet). The brief's other placement
          # rule -- no job holding packages:write or id-token:write -- cannot be
          # honoured to the letter: this `image` job builds AND pushes, so it
          # holds packages:write (and security-events:write) by construction,
          # same as every app-*-ci.yml image job. This is the closest safe
          # position inside the only job that has the built image loaded (see
          # the Task 24 report for the full ruling).
          container_id="$(docker run -d -p 127.0.0.1::8080 -e MCP_ALLOW_UNAUTHENTICATED=true "${IMAGE}")"
          cleanup() {
            docker stop "${container_id}" >/dev/null 2>&1 || true
            docker rm "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          host_port="$(docker port "${container_id}" 8080/tcp | awk -F: '{print $NF}' | head -n1)"
          if [ -z "${host_port}" ]; then
            echo "::error::mcp-tools: docker port reported no host mapping for 8080. Usually this means the container is already gone (an image whose entrypoint exits immediately); a container that starts but never binds 8080 normally fails the poll below instead."
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

          url="http://127.0.0.1:${host_port}/healthz"
          status=""
          body=""
          for _ in $(seq 1 30); do
            if raw="$(curl -s --max-time 3 -w '\n%{http_code}' "${url}")"; then
              status="${raw##*$'\n'}"
              body="${raw%$'\n'*}"
              break
            fi
            sleep 2
          done

          if [ -z "${status}" ]; then
            echo "::error::mcp-tools never accepted a connection on :8080/healthz within 60s"
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

          echo "GET /healthz -> ${status}: ${body}"
          if [ "${status}" != "200" ]; then
            echo "::error::mcp-tools /healthz returned HTTP ${status} (body: ${body})"
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi
          # mcp-tools' /healthz has no "service" field (unlike data-api's) --
          # .ok and .transport are its own discriminators.
          if ! printf '%s' "${body}" | jq -e '.ok == true and .transport == "streamable-http"' >/dev/null 2>&1; then
            echo "::error::mcp-tools /healthz did not report the app's own payload (expected .ok == true and .transport == \"streamable-http\", got: ${body})"
            docker logs "${container_id}" 2>&1 || true
            exit 1
          fi

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        id: push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.APP_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.registry }}:latest
          cache-from: type=gha,scope=mcp-tools
          cache-to: type=gha,mode=max,scope=mcp-tools

  deploy:
    name: deploy to Container Apps
    needs: [preflight, image]
    if: ${{ needs.preflight.outputs.configured == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - id: names
        uses: ./.github/actions/naming

      - name: Azure login (OIDC, mls-github-deployer)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll the new image onto the container app
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.names.outputs.ca-mcp }}
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          # MLS_IMAGE_DIGEST records which build this revision serves, the same
          # way the two frontends do it for L7's V7.1. --set-env-vars, not
          # --replace-env-vars: AZURE_CLIENT_ID (which binds
          # DefaultAzureCredential to the mcp-tools user-assigned identity) and
          # the App Insights connection string came from the L7 template.
          az containerapp update \
            --resource-group "${RG_APPS}" \
            --name "${APP_NAME}" \
            --image "${IMAGE}" \
            --set-env-vars "MLS_IMAGE_DIGEST=${IMAGE_DIGEST:-unset}" \
            --min-replicas 0 \
            --output none
          echo "Deployed ${IMAGE} (digest ${IMAGE_DIGEST:-unset}) to ${APP_NAME}."

      - name: Check the ingress target port (open item P-1)
        env:
          RG_APPS: ${{ steps.names.outputs.rg-apps }}
          APP_NAME: ${{ steps.names.outputs.ca-mcp }}
          CONFIGURED_PORT: ${{ vars.MCP_TOOLS_PORT }}
        run: |
          set -euo pipefail
          current="$(az containerapp show -g "${RG_APPS}" -n "${APP_NAME}" \
            --query properties.configuration.ingress.targetPort -o tsv)"
          echo "Current ingress target port: ${current}"
          if [ "${current}" = "80" ] && [ -z "${CONFIGURED_PORT}" ]; then
            echo "::warning title=P-1 open — target port still 80::${APP_NAME} serves a real image on 8080 but ingress still targets the placeholder port 80. Set MCP_TOOLS_PORT=8080 in the demo environment and re-run layer-07-apps.yml. Ingress was deliberately NOT mutated here."
          fi

      - name: Deployment summary
        env:
          APP_NAME: ${{ steps.names.outputs.ca-mcp }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          {
            echo "### mcp-tools deployed"
            echo
            echo "- container app: \`${APP_NAME}\` (external HTTPS ingress — Copilot Studio must reach it)"
            echo "- image: \`${IMAGE}\`"
            echo "- MCP endpoint: \`POST https://<fqdn>/mcp\` (Streamable HTTP, stateless)"
            echo
            echo "This pipeline runs the eval against the LOCAL tool surface. The live"
            echo "golden-question run against the deployed Copilot Studio agent over"
            echo "Direct Line is L8's own step (\`npm run eval:agent\`)."
          } >> "${GITHUB_STEP_SUMMARY}"
