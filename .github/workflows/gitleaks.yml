name: gitleaks

# =============================================================================
# Secret scanning with gitleaks — L1 deliverable ("gitleaks in CI").
# Playbook: docs/runbooks/layers/L01.md (failure mode 4: a gitleaks hit on a
# commit already on main is a real incident — rotate first, scrub second, and
# only with sponsor sign-off since the repo is public).
#
# This is the belt to GitHub's own braces: secret scanning + push protection are
# repo settings (V1.2), gitleaks is the in-repo check that also runs on forks and
# on full history.
#
# Since the 2026-08-24 amendment CI holds no CLOUD credential: everything Azure
# authenticates via OIDC, runtime LLM work is a Copilot Studio agent, and
# tenant/subscription IDs live in GitHub environment variables. CI is NOT
# secret-free, and saying it was is finding F28 — the "What a finding means"
# step below carries the complete rotation list (four GitHub secrets, two Key
# Vault secrets), because that is the text a responder reads at 2am. Keep it in
# sync with SECURITY.md and CLAUDE.md hard rule 5. A hit here is one of those
# six leaking where it must not go, or a test fixture that pattern-matches a
# credential (rewrite the fixture; never use the push-protection bypass for
# convenience).
#
# gitleaks-action v2 is free for public repositories; GITLEAKS_LICENSE is only
# required for organization-owned private repos.
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan history for secrets
    runs-on: ubuntu-latest
    # Bounded: talks to a cloud API and may legitimately be slow. An unbounded job inherits GitHub's six-hour
    # default, which is how a hung what-if consumed a whole run (F81).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the point is to catch a leak already on main, not just
          # the diff (L01 failure mode 4).
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

      - name: What a finding means
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          {
            echo "## gitleaks found something"
            echo
            echo "Treat this as an incident, in this order:"
            echo
            echo "1. **Rotate** whatever leaked. Everything *Azure* is OIDC, so there is"
            echo "   no cloud credential to rotate — but this system does hold long-lived"
            echo "   credentials, and this is the complete list (F28: the previous version"
            echo "   of this text named only the Direct Line secret, which would have sent"
            echo "   a responder home with six live credentials un-rotated):"
            echo
            echo "   | Credential | Where it lives | How to rotate |"
            echo "   |---|---|---|"
            echo "   | \`PURVIEW_CERT_BASE64\` / \`PURVIEW_CERT_PASSWORD\` | \`demo\` environment secret | New X.509 cert on the Purview S&C app registration; upload, then remove the old one |"
            echo "   | \`MLS_VERIFIER_CERT_BASE64\` / \`MLS_VERIFIER_CERT_PASSWORD\` | \`verify\` environment secret | Same, on the \`mls-verifier\` app registration |"
            echo "   | \`SELF_HEAL_TOKEN\` | repository secret — a PAT with \`repo\` **write** | Revoke the PAT in GitHub settings, mint a new one, re-set the secret |"
            echo "   | \`MLS_VERIFIER_GH_TOKEN\` | \`verify\` environment secret | Same |"
            echo "   | Direct Line secret | the platform **Key Vault** | Rotate in the agent's channel settings, then re-set the vault secret |"
            echo "   | \`mcp-auth-token\` | the platform **Key Vault** | Generate a new token, set the vault secret, restart the MCP container app |"
            echo
            echo "   \`SELF_HEAL_TOKEN\` is the most damaging of these: it can write to this"
            echo "   repository. Rotate it first if you cannot tell what leaked."
            echo "2. If it is a **test fixture** that merely pattern-matches a"
            echo "   credential, rewrite the fixture so it stops matching."
            echo "3. Only then consider history rewriting — and only with sponsor"
            echo "   sign-off, because this repository is public and shared."
          } >> "${GITHUB_STEP_SUMMARY}"
